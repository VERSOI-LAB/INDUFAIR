        <div class="field"><label>정렬 순서</label><input type="number" id="ff-sort" value="0"></div>
      </div>

        <span></span>

          <button type="button" class="btn btn-ghost" id="faqModalCancel">취소</button>

        </div>
      </div>
    </form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
var FQ = { list: [] };

function faqRowHtml(f) {
  return '<tr>' +
    '<td class="cell-strong" style="max-width:420px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + AC.esc(f.question) + '</td>' +
    '<td class="num">' + f.sort_order + '</td>' +
    '<td><div class="table-actions">' +
      '<button class="btn btn-ghost btn-sm" onclick="openFaqEdit(' + f.id + ')">수정</button>' +
      '<button class="btn btn-ghost btn-sm" style="color:var(--up);" onclick="deleteFaq(' + f.id + ')">삭제</button>' +
    '</div></td></tr>';
}

function renderFaqs() {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var list = FQ.list.filter(function (f) {
    if (q && (f.question + ' ' + f.answer).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  document.getElementById('faqTbody').innerHTML = list.map(faqRowHtml).join('') ||
    '<tr><td colspan="3" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">등록된 FAQ가 없습니다.</td></tr>';
  document.getElementById('totalCountText').textContent = '총 ' + list.length + '건';
}

async function loadFaqs() {
  var res = await sb.from('faqs').select('*').order('sort_order');
  FQ.list = res.data || [];
  renderFaqs();
}

function openFaqModal() { document.getElementById('faqModalOverlay').style.display = 'flex'; }
function closeFaqModal() { document.getElementById('faqModalOverlay').style.display = 'none'; }

document.getElementById('newFaqBtn').addEventListener('click', function () {
  document.getElementById('faqModalTitle').textContent = 'FAQ 등록';
  document.getElementById('faqSubmitBtn').textContent = '등록하기';
  document.getElementById('ff-id').value = '';
  document.getElementById('ff-question').value = '';
  document.getElementById('ff-answer').value = '';
  document.getElementById('ff-sort').value = FQ.list.length ? Math.max.apply(null, FQ.list.map(function (f) { return f.sort_order; })) + 1 : 0;
  openFaqModal();
});

window.openFaqEdit = function (id) {
  var f = FQ.list.find(function (x) { return x.id === id; });
  if (!f) return;
  document.getElementById('faqModalTitle').textContent = 'FAQ 수정';
  document.getElementById('faqSubmitBtn').textContent = '저장하기';
  document.getElementById('ff-id').value = f.id;
  document.getElementById('ff-question').value = f.question;
  document.getElementById('ff-answer').value = f.answer;
  document.getElementById('ff-sort').value = f.sort_order;
  openFaqModal();
};

window.deleteFaq = async function (id) {
  if (!confirm('이 FAQ 문항을 삭제하시겠습니까?')) return;
  var res = await sb.from('faqs').delete().eq('id', id);
  if (res.error) { alert('삭제에 실패했습니다: ' + res.error.message); return; }
  await loadFaqs();
};

document.getElementById('faqModalClose').addEventListener('click', closeFaqModal);
document.getElementById('faqModalCancel').addEventListener('click', closeFaqModal);
document.getElementById('faqForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var id = document.getElementById('ff-id').value;
  var payload = {
    question: document.getElementById('ff-question').value.trim(),
    answer: document.getElementById('ff-answer').value.trim(),
    sort_order: Number(document.getElementById('ff-sort').value || 0)
  };
  var res = id ? await sb.from('faqs').update(payload).eq('id', id) : await sb.from('faqs').insert(payload);
  if (res.error) { alert('저장에 실패했습니다: ' + res.error.message); return; }
  closeFaqModal();
  await loadFaqs();
});
document.getElementById('searchInput').addEventListener('input', renderFaqs);

AC.ready(async function (user) {
  document.querySelector('.admin-user .lbl b').textContent = (user.profile ? user.profile.name : user.email) || '관리자';
  document.querySelector('.admin-user .lbl span').textContent = user.email;
  document.querySelector('.admin-user .avatar').textContent = ((user.profile && user.profile.name) || user.email).charAt(0);
  await loadFaqs();
});
</script>
