<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>업체 플랜 - 판다산다</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="/app.css">
<style>
  .sec{margin-top:28px;}
  .sec > h2{font-size:20px;font-weight:800;}
  .sec > p.d{font-size:14px;color:var(--sub);margin-top:4px;line-height:1.5;}
  .msg{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:15px;font-weight:600;line-height:1.5;}
  .msg.ok{background:#F4FBF6;border:1px solid #D4F0DC;}
  .msg.err{background:#FFF0EF;color:var(--danger);}
  /* 지금 상태 */
  .now{margin-top:20px;padding:20px;border-radius:20px;background:var(--primary-light);}
  .now .tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;font-size:14px;font-weight:800;background:var(--text);color:#fff;}
  .now .tag.free{background:#888;}
  .now .who{font-size:22px;font-weight:800;margin-top:10px;line-height:1.35;word-break:keep-all;}
  .now .until{font-size:15px;color:var(--sub);margin-top:4px;}
  .meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px;}
  .meter{padding:12px 14px;border-radius:14px;background:var(--surface);}
  .meter span{display:block;font-size:13px;color:var(--sub);}
  .meter b{display:block;font-size:20px;font-weight:800;margin-top:2px;}
  .meter b small{font-size:13px;font-weight:600;color:var(--hint);margin-left:2px;}
  /* 입금 안내 */
  .pay{margin-top:16px;padding:20px;border-radius:20px;border:2px solid var(--primary);}
  .pay h3{font-size:18px;font-weight:800;}
  .pay .sub{font-size:14px;color:var(--sub);margin-top:2px;}
  .pay dl{margin:16px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 10px;align-items:center;font-size:16px;}
  .pay dt{color:var(--sub);font-size:15px;}
  .pay dd{margin:0;font-weight:800;word-break:break-all;}
  .pay dd.big{font-size:20px;}
  .pay .cp{height:32px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;font-weight:700;background:var(--surface);white-space:nowrap;}
  .pay .how{margin:14px 0 0;padding-left:18px;font-size:14px;color:var(--sub);line-height:1.7;}
  .pay .how b{color:var(--text);}
  .pay .row{display:flex;gap:8px;margin-top:14px;}
  .pay .row .btn{flex:1;}
  /* 플랜 */
  .months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px;padding:4px;border-radius:14px;background:#F2F2F2;}
  .months button{height:44px;border-radius:10px;font-size:15px;font-weight:700;color:var(--sub);}
  .months button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .months button em{font-style:normal;font-size:12px;color:#D97706;margin-left:2px;}
  .plans{display:grid;gap:12px;margin-top:12px;}
  .plan{padding:20px;border-radius:20px;border:1.5px solid var(--line);}
  .plan.best{border:2px solid var(--primary);}
  .plan .top{display:flex;align-items:center;gap:8px;}
  .plan .top b{font-size:20px;font-weight:800;}
  .plan .top .rec{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--primary);}
  .plan .top .cur{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--text);color:#fff;}
  .plan .price{margin-top:10px;font-size:26px;font-weight:800;line-height:1.2;}
  .plan .price small{font-size:14px;font-weight:600;color:var(--sub);margin-left:4px;}
  .plan .price s{font-size:15px;color:var(--hint);font-weight:600;margin-left:6px;}
  .plan .vat{font-size:14px;color:var(--sub);margin-top:4px;}
  .plan ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px;}
  .plan li{display:flex;gap:8px;font-size:15px;line-height:1.45;}
  .plan li::before{content:'✓';flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--primary-light);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .plan li.no{color:var(--hint);}
  .plan li.no::before{content:'–';background:#F2F2F2;}
  .plan .btn{margin-top:16px;}
  /* 이용권 */
  .packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px;}
  .pack{padding:16px;border-radius:16px;border:1.5px solid var(--line);display:flex;flex-direction:column;}
  .pack b{font-size:17px;font-weight:800;}
  .pack span{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.45;flex:1;}
  .pack .pr{font-size:18px;font-weight:800;margin-top:10px;}
  .pack .pr small{display:block;font-size:12px;font-weight:600;color:var(--sub);}
  .pack .btn{margin-top:10px;}
  /* 주문 내역 */
  .orders{margin-top:12px;display:grid;gap:8px;}
  .order{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:14px;background:var(--bg);font-size:15px;}
  .order .l{min-width:0;}
  .order .l b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .order .l span{font-size:13px;color:var(--sub);}
  .order .r{text-align:right;flex-shrink:0;}
  .order .r b{display:block;font-weight:800;}
  .order .r span{font-size:13px;color:var(--sub);}
  .st{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:8px;background:#E8E8E8;}
  .st.paid{background:#E6F7EC;color:#167A3A;}
  .st.pending{background:var(--primary-light);color:#8A5A00;}
  .refund{margin-top:28px;padding:16px 18px;border-radius:14px;background:var(--bg);font-size:14px;color:var(--sub);line-height:1.7;}
  .refund b{display:block;font-size:15px;color:var(--text);margin-bottom:4px;}
  .refund ul{margin:0;padding-left:18px;}
  .refund a{display:inline-block;margin-top:6px;text-decoration:underline;}
  /* 추천 물건 고르기 (노출 혜택이 있을 때) */
  .picks h2 em{font-style:normal;font-size:15px;color:var(--hint);font-weight:700;margin-left:6px;}
  .pick-list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:12px;max-height:420px;overflow-y:auto;}
  .pick-item{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px 8px 8px;border:1.5px solid var(--line);border-radius:14px;text-align:left;background:var(--surface);}
  .pick-item .th{width:52px;height:52px;border-radius:10px;overflow:hidden;background:#F2F2F2;flex-shrink:0;}
  .pick-item .th img{width:100%;height:100%;object-fit:cover;}
  .pick-item .tx{flex:1;min-width:0;}
  .pick-item .tx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pick-item .tx span{font-size:14px;color:var(--sub);}
  .pick-item .ck{width:26px;height:26px;border-radius:50%;border:2px solid #D5D5D5;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:transparent;}
  .pick-item.on{border-color:var(--primary);background:var(--primary-light);}
  .pick-item.on .ck{background:var(--primary);border-color:var(--primary);color:var(--text);}
  .pick-item:disabled{opacity:.6;}
  @media (max-width:360px){ .packs{grid-template-columns:minmax(0,1fr);} .pay dl{grid-template-columns:auto minmax(0,1fr);} .pay .cp{grid-column:2;justify-self:start;} }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" href="/my-biz" aria-label="업체 소개 관리로 돌아가기"><i data-icon="back" data-size="24"></i></a>
    <h1>업체 플랜</h1>
  </header>
  <main class="page" id="main">
    <div class="skeleton" style="height:220px;margin-top:20px;border-radius:20px"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  PS.renderTabbar('my');
  var $ = function (id) { return document.getElementById(id); };
  var main = $('main');
  var bizId = PS.param('id');
  var MAX_PICKS = 4;
  var TIER = { free: '무료', pro: '프로', biz: '비즈' };
  var me = null, products = [], settings = null, biz = null, notice = null, months = 1, busy = false;
  var myProducts = [], picks = {}, picksReady = false;

  var money = function (n) { return Number(n || 0).toLocaleString('ko-KR') + '원'; };
  var vat = function (n) { return n + Math.floor(n / 10); };
  function day(iso) { var d = new Date(iso); return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate(); }
  function prod(code) { return products.filter(function (p) { return p.code === code; })[0]; }

  async function load() {
    var r = await sb.rpc('my_billing');
    if (r.error || !r.data || r.data.error) { me = null; return; }
    me = r.data;
    biz = (me.businesses || []).filter(function (b) { return b.id === bizId; })[0] || (me.businesses || [])[0] || null;
    if (biz) bizId = biz.id;
  }

  PS.ready.then(async function (user) {
    if (!user) return PS.goLogin();
    var rs = await Promise.all([
      sb.from('billing_products').select('*').eq('active', true).order('sort'),
      sb.from('billing_settings').select('*').eq('id', 1).maybeSingle(),
      load()
    ]);
    products = rs[0].data || []; settings = rs[1].data;
    if (!me) { main.innerHTML = '<div class="empty">' + PS.sticker('working', 120) + '<b>업체 플랜을 준비하고 있어요</b>조금만 기다려 주세요</div>'; return; }
    PS.track('premium_view', { business_id: bizId, tier: me.tier });
    if (biz) await loadPicks();
    render();
    watchPending();
  });

  // 입금 기다리는 주문이 있으면 화면을 보는 동안 30초마다 확인 (자동 확인은 10분 간격)
  var pollTimer = null;
  function watchPending() {
    clearInterval(pollTimer);
    if (!pendingOrders().length) return;
    pollTimer = setInterval(async function () {
      if (document.hidden) return;
      var before = pendingOrders().map(function (o) { return o.id; });
      await load();
      var paid = (me.orders || []).filter(function (o) { return before.indexOf(o.id) >= 0 && o.status === 'paid'; });
      if (paid.length) { notice = { ok: true, text: '입금을 확인했어요! ' + paid[0].item_name + ' 적용을 시작했어요. 세금계산서는 메일로 보내 드려요.' }; render(); watchPending(); }
    }, 30000);
  }
  function pendingOrders() {
    return (me.orders || []).filter(function (o) { return o.status === 'pending' && Date.parse(o.expires_at) > Date.now(); });
  }

  // ---- 추천 물건 (노출 혜택이 있는 동안) ----
  async function loadPicks() {
    var fr = await sb.from('biz_featured').select('product_id').eq('business_id', bizId);
    if (fr.error) { picksReady = false; return; }
    picks = {};
    (fr.data || []).forEach(function (x) { picks[x.product_id] = 1; });
    var pr = await sb.from('products').select('id,title,price,product_images(url,sort_order)')
      .eq('seller_profile_id', PS.user.id).eq('status', 'selling').order('created_at', { ascending: false }).limit(200);
    myProducts = pr.data || [];
    picksReady = true;
  }
  function picksHtml() {
    var n = Object.keys(picks).length;
    var list = myProducts.slice().sort(function (a, b) { return (picks[b.id] ? 1 : 0) - (picks[a.id] ? 1 : 0); });
    return '<h2>추천순에 올릴 물건<em>' + n + ' / ' + MAX_PICKS + '</em></h2>' +
      '<p class="d">고른 물건은 산다 화면의 "추천순" 맨 앞에 보여요. 판매중 물건 중 최대 ' + MAX_PICKS + '개까지 고를 수 있어요.</p>' +
      (list.length ? '<div class="pick-list">' + list.map(function (p) {
        var img = PS.firstImage(p);
        return '<button type="button" class="pick-item' + (picks[p.id] ? ' on' : '') + '" data-pick="' + PS.esc(p.id) + '" aria-pressed="' + !!picks[p.id] + '">' +
          '<span class="th">' + (img ? '<img src="' + PS.esc(img) + '" alt="" loading="lazy">' : '') + '</span>' +
          '<span class="tx"><b>' + PS.esc(p.title) + '</b><span>' + PS.won(p.price) + '</span></span><span class="ck" aria-hidden="true">✓</span></button>';
      }).join('') + '</div>'
        : '<p class="d" style="margin-top:12px">아직 판매중인 물건이 없어요. <a href="/sell" style="text-decoration:underline">물건 올리기</a></p>');
  }
  async function togglePick(btn) {
    var id = btn.dataset.pick, on = !picks[id];
    if (on && Object.keys(picks).length >= MAX_PICKS) { PS.toast('추천 물건은 ' + MAX_PICKS + '개까지 고를 수 있어요'); return; }
    btn.disabled = true;
    var r = await sb.rpc('set_biz_featured', { p_business_id: bizId, p_product_id: id, p_on: on });
    btn.disabled = false;
    if (r.error || r.data !== 'ok') {
      PS.toast(r.data === 'full' ? '추천 물건은 ' + MAX_PICKS + '개까지 고를 수 있어요'
        : r.data === 'not_premium' ? '프로·비즈 플랜일 때만 고를 수 있어요' : '바꾸지 못했어요. 잠시 후 다시 해 주세요');
      return;
    }
    if (on) picks[id] = 1; else delete picks[id];
    $('picks').innerHTML = picksHtml();
  }

  // ---- 화면 ----
  function meter(label, u, unit) {
    if (!u) return '';
    var v = u.left < 0 ? '무제한' : u.left + '<small>/ ' + u.limit + unit + '</small>';
    return '<div class="meter"><span>' + label + '</span><b>' + v + '</b></div>';
  }

  function nowHtml() {
    var t = me.tier, paidUntil = biz && biz.plan_until, prem = biz && biz.premium_until;
    var until = t !== 'free' && paidUntil ? TIER[biz.plan_tier] + ' 플랜 ' + day(paidUntil) + '까지'
      : t !== 'free' && me.trial_until ? '🎁 가입 첫 달 무료 · ' + day(me.trial_until) + '까지'
      : t !== 'free' && prem ? '🎁 친구 초대 보상 · ' + day(prem) + '까지'
      : '견적은 30일에 3건까지 무료예요';
    return '<div class="now"><span class="tag' + (t === 'free' ? ' free' : '') + '">' + TIER[t] + ' 플랜 이용 중</span>' +
      '<div class="who">' + (biz ? PS.esc(biz.name) : '업체 소개를 먼저 올려 주세요') + '</div>' +
      '<div class="until">' + until + '</div>' +
      (biz ? '<div class="meters">' +
        meter('견적 (30일)', me.usage.buy, '건') + meter('매입 제안 (30일)', me.usage.sell, '건') +
        '<div class="meter"><span>견적권</span><b>' + me.credits.quote + '<small>장</small></b></div>' +
        '<div class="meter"><span>매입 제안권</span><b>' + me.credits.offer + '<small>장</small></b></div>' +
      '</div>' : '<a class="btn" href="/biz/new" style="margin-top:16px">업체 소개 올리기 (무료)</a>') +
      '</div>';
  }

  function payHtml(o) {
    var s = settings || {};
    var ready = s.bank_name && s.account_no;
    return '<div class="pay" data-order="' + o.id + '"><h3>입금하면 바로 시작돼요</h3><div class="sub">' + PS.esc(o.item_name) + ' · ' + day(o.expires_at) + '까지 입금</div>' +
      (ready ? '<dl>' +
        '<dt>입금 계좌</dt><dd>' + PS.esc(s.bank_name) + ' ' + PS.esc(s.account_no) + '<br><span style="font-weight:600;color:var(--sub)">예금주 ' + PS.esc(s.account_holder) + '</span></dd><button class="cp" type="button" data-copy="' + PS.esc(s.account_no.replace(/[^0-9]/g, '')) + '">복사</button>' +
        '<dt>입금액</dt><dd class="big">' + money(o.total_amount) + '</dd><button class="cp" type="button" data-copy="' + o.total_amount + '">복사</button>' +
        '<dt>입금자명</dt><dd class="big">' + PS.esc(o.depositor_code) + '</dd><button class="cp" type="button" data-copy="' + PS.esc(o.depositor_code) + '">복사</button>' +
      '</dl>' : '<p class="msg err">입금 계좌를 준비하고 있어요. 고객센터로 문의해 주세요.</p>') +
      '<ul class="how">' +
        '<li>입금자명을 <b>' + PS.esc(o.depositor_code) + '</b>(으)로 바꿔서 보내 주세요. 이름 그대로 보내도 상호(' + PS.esc(o.buyer_corp_name) + ')와 금액이 맞으면 확인돼요.</li>' +
        '<li>입금하면 <b>10분 안에</b> 자동으로 확인하고 바로 적용해요 (밤 12시~아침 7시 입금은 아침에 확인).</li>' +
        '<li>공급가액 ' + money(o.supply_amount) + ' + 부가세 ' + money(o.vat_amount) + '. 세금계산서는 <b>' + PS.esc(o.buyer_email || '이메일 없음') + '</b>(으)로 자동 발행돼요.</li>' +
      '</ul>' +
      '<div class="row"><button class="btn white small" type="button" data-email="' + o.id + '">계산서 받을 메일 바꾸기</button><button class="btn white small" type="button" data-cancel="' + o.id + '">주문 취소</button></div>' +
      '</div>';
  }

  function planCard(tier) {
    var cur = me.tier === tier && biz && biz.plan_tier === tier;
    if (tier === 'free') {
      return '<div class="plan"><div class="top"><b>무료</b>' + (me.tier === 'free' ? '<span class="cur">지금</span>' : '') + '</div>' +
        '<div class="price">0원</div><ul>' +
        '<li>업체 소개 올리기 · 하루 한 번 직접 끌어올리기</li><li>구해요 견적 30일에 3건</li><li class="no">설비 처분 매입 제안 (매입 제안권으로)</li><li class="no">맨 앞 고정 · 매일 자동 끌어올리기</li></ul></div>';
    }
    var p = prod(tier + '_' + months), p1 = prod(tier + '_1');
    if (!p || !p1) return '';
    var perMonth = Math.round(p.supply_amount / p.months);
    var feats = tier === 'pro'
      ? ['구해요 견적 30일에 <b>30건</b>', '설비 처분 매입 제안 30일에 <b>3건</b>', '동네 업체 맨 앞 고정 · 매일 자동 끌어올리기', '추천 물건 ' + MAX_PICKS + '개를 산다 화면 추천순 맨 앞에']
      : ['구해요 견적 <b>무제한</b>', '설비 처분 매입 제안 30일에 <b>10건</b>', '동네 업체 맨 앞 고정 · 매일 자동 끌어올리기', '추천 물건 ' + MAX_PICKS + '개를 산다 화면 추천순 맨 앞에'];
    var other = biz && biz.plan_tier && biz.plan_tier !== tier;
    return '<div class="plan' + (tier === 'pro' ? ' best' : '') + '"><div class="top"><b>' + TIER[tier] + '</b>' +
        (tier === 'pro' ? '<span class="rec">추천</span>' : '') + (cur ? '<span class="cur">이용 중</span>' : '') + '</div>' +
      '<div class="price">월 ' + money(perMonth) + '<small>부가세 별도</small>' + (p.list_supply > p.supply_amount ? '<s>월 ' + money(p1.supply_amount) + '</s>' : '') + '</div>' +
      '<div class="vat">' + (p.months > 1 ? p.months + '개월 ' : '') + '입금액 <b>' + money(vat(p.supply_amount)) + '</b> (부가세 포함)</div>' +
      '<ul>' + feats.map(function (f) { return '<li><span>' + f + '</span></li>'; }).join('') + '</ul>' +
      '<button class="btn' + (tier === 'pro' ? '' : ' white') + '" type="button" data-buy="' + p.code + '"' + (!biz || other ? ' disabled' : '') + '>' +
        (other ? TIER[biz.plan_tier] + ' 플랜이 끝난 뒤 바꿀 수 있어요' : cur ? p.months + '개월 연장하기' : TIER[tier] + ' ' + p.months + '개월 신청하기') + '</button></div>';
  }

  function packCard(code, desc) {
    var p = prod(code);
    if (!p) return '';
    return '<div class="pack"><b>' + PS.esc(p.name) + '</b><span>' + desc + '</span>' +
      '<div class="pr">' + money(vat(p.supply_amount)) + '<small>공급가액 ' + money(p.supply_amount) + ' + 부가세</small></div>' +
      '<button class="btn small white" type="button" data-buy="' + p.code + '"' + (biz ? '' : ' disabled') + '>사기</button></div>';
  }

  function ordersHtml() {
    var list = (me.orders || []).filter(function (o) { return o.status !== 'pending' || Date.parse(o.expires_at) <= Date.now(); });
    if (!list.length) return '';
    var ST = { paid: ['결제 완료', 'paid'], refunded: ['환불', ''], canceled: ['취소', ''], expired: ['입금 기한 지남', ''], pending: ['입금 대기', 'pending'] };
    var INV = { issued: '세금계산서 발행', pending: '세금계산서 발행 준비 중', failed: '세금계산서 확인 중', canceled: '' };
    return '<section class="sec"><h2>결제 내역</h2><div class="orders">' + list.map(function (o) {
      var st = ST[o.status] || [o.status, ''];
      return '<div class="order"><div class="l"><b>' + PS.esc(o.item_name) + '</b><span>' + day(o.paid_at || o.created_at) + ' · ' + PS.esc(o.order_no) + '</span></div>' +
        '<div class="r"><b>' + money(o.total_amount) + '</b><span class="st ' + st[1] + '">' + st[0] + '</span>' +
        (o.status === 'paid' || o.status === 'refunded' ? '<span style="display:block;margin-top:2px">' + (INV[o.invoice_status] || '') + '</span>' : '') +
        (o.refund_amount ? '<span style="display:block">환불 ' + money(o.refund_amount) + '</span>' : '') + '</div></div>';
    }).join('') + '</div></section>';
  }

  function render() {
    var html = '';
    if (notice) html += '<div class="msg ' + (notice.ok ? 'ok' : 'err') + '" role="status">' + PS.esc(notice.text) + '</div>';
    html += nowHtml();
    html += pendingOrders().map(payHtml).join('');
    if (biz && biz.premium_until && picksReady) html += '<section class="sec picks" id="picks">' + picksHtml() + '</section>';
    if (!me.verified) html += '<div class="msg err">세금계산서를 보내 드리려면 사업자 인증이 필요해요. <a href="/biz/verify" style="text-decoration:underline">사업자 인증하기</a></div>';

    html += '<section class="sec"><h2>플랜</h2><p class="d">표시된 월 요금은 부가세 별도예요. 입금은 부가세 10%를 더한 금액으로 해 주세요. 자동 결제는 없고, 기간이 끝나면 무료 플랜으로 돌아가요.</p>' +
      '<div class="months" role="tablist" aria-label="기간">' + [1, 3, 12].map(function (m) {
        return '<button type="button" role="tab" data-months="' + m + '" class="' + (m === months ? 'on' : '') + '" aria-selected="' + (m === months) + '">' + m + '개월' + (m === 12 ? '<em>2달 무료</em>' : '') + '</button>';
      }).join('') + '</div>' +
      '<div class="plans">' + planCard('pro') + planCard('biz') + planCard('free') + '</div></section>';

    html += '<section class="sec"><h2>이용권</h2><p class="d">플랜 한도를 다 쓴 뒤에 1장씩 써요. 쓴 만큼만 줄고, 기간 제한이 없어요.</p><div class="packs">' +
      packCard('quote_10', '구해요 요청에 견적을 보낼 때 1장') + packCard('offer_3', '설비 처분 요청에 매입 제안을 보낼 때 1장') + '</div></section>';

    html += ordersHtml();

    // 결제·환불 기준 (이용약관 제17조와 같은 내용)
    html += '<div class="refund"><b>결제·환불 안내</b><ul>' +
      '<li>계좌이체로만 받아요. 입금이 확인되면 바로 적용되고, 세금계산서(영수)는 사업자 인증 정보로 자동 발행돼요.</li>' +
      '<li>결제 후 7일 안이고 견적·매입 제안을 하나도 보내지 않았다면 전액 환불해 드려요.</li>' +
      '<li>그 뒤 플랜은 이미 시작한 달을 1개월 요금으로 빼고 남은 금액을, 이용권은 쓰지 않은 장수만큼 돌려드려요.</li>' +
      '<li>환불은 고객센터로 요청해 주세요. 환불분은 수정세금계산서로 처리돼요.</li></ul>' +
      '<a href="/terms#c6">이용약관 보기</a></div>';
    main.innerHTML = html;
  }

  main.addEventListener('click', async function (e) {
    var t;
    if ((t = e.target.closest('[data-months]'))) { months = Number(t.dataset.months); render(); return; }
    if ((t = e.target.closest('[data-pick]')) && !t.disabled) { togglePick(t); return; }
    if ((t = e.target.closest('[data-copy]'))) {
      try { await navigator.clipboard.writeText(t.dataset.copy); PS.toast('복사했어요'); } catch (_) { PS.toast(t.dataset.copy); }
      return;
    }
    if ((t = e.target.closest('[data-buy]')) && !t.disabled && !busy) { buy(t.dataset.buy, t); return; }
    if ((t = e.target.closest('[data-cancel]'))) {
      if (!confirm('이 주문을 취소할까요? 이미 입금했다면 취소하지 말고 기다려 주세요.')) return;
      var r = await sb.rpc('cancel_billing_order', { p_id: t.dataset.cancel });
      if (r.data === 'ok') { notice = { ok: true, text: '주문을 취소했어요.' }; await load(); render(); watchPending(); }
      else PS.toast('취소하지 못했어요. 잠시 후 다시 해 주세요');
      return;
    }
    if ((t = e.target.closest('[data-email]'))) {
      var o = (me.orders || []).filter(function (x) { return x.id === t.dataset.email; })[0];
      var v = prompt('세금계산서를 받을 이메일', (o && o.buyer_email) || '');
      if (!v) return;
      var r2 = await sb.rpc('set_order_email', { p_id: t.dataset.email, p_email: v.trim() });
      if (r2.data === 'ok') { await load(); render(); PS.toast('바꿨어요'); }
      else PS.toast(r2.data === 'bad_input' ? '이메일을 다시 확인해 주세요' : '바꾸지 못했어요');
    }
  });

  async function buy(code, btn) {
    var p = prod(code);
    if (!p) return;
    if (!me.verified) { PS.toast('사업자 인증을 먼저 해 주세요'); return; }
    if (!confirm(p.name + '\n입금액 ' + money(vat(p.supply_amount)) + ' (부가세 포함)\n\n주문하면 입금 계좌와 입금자명을 알려 드려요.')) return;
    busy = true; btn.disabled = true;
    var r = await sb.rpc('create_billing_order', { p_product: code, p_business_id: p.kind === 'plan' ? bizId : null });
    busy = false; btn.disabled = false;
    var d = r.data || {};
    if (r.error || d.error) {
      PS.toast({ need_verify: '사업자 인증을 먼저 해 주세요', need_biz: '업체 소개를 먼저 올려 주세요', too_many: '입금 기다리는 주문이 3개예요. 먼저 입금하거나 취소해 주세요',
        other_tier: '지금 쓰는 플랜이 끝난 뒤에 바꿀 수 있어요. 바로 바꾸려면 고객센터로 알려 주세요' }[d.error] || '주문하지 못했어요. 잠시 후 다시 해 주세요');
      return;
    }
    PS.track('billing_order', { product: code, amount: d.order.total_amount, existing: !!d.existing });
    notice = { ok: true, text: d.existing ? '이미 주문한 내용이 있어요. 아래 안내대로 입금해 주세요.' : '주문했어요. 아래 계좌로 입금하면 바로 시작돼요.' };
    await load(); render(); watchPending();
    var el = document.querySelector('[data-order="' + d.order.id + '"]');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
})();
</script>
</body>
</html>
