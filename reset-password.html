<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>새 비밀번호 - 판다산다</title>
<link rel="icon" href="/이미지/web/logo.jpg">
<link rel="stylesheet" href="/app.css">
<style>
  .hello{text-align:center;padding:40px 0 8px;}
  .hello h1{font-size:26px;font-weight:800;margin-top:12px;}
  .hello p{color:var(--sub);margin-top:4px;}
  .err{margin-top:14px;padding:12px 14px;border-radius:12px;background:#FFF0EF;color:var(--danger);font-size:15px;font-weight:600;}
</style>
</head>
<body>
<div class="app no-tabbar">
  <header class="topbar"><a class="back" href="/login" aria-label="로그인으로"><i data-icon="back" data-size="24"></i></a><h1></h1></header>
  <main class="page" id="main">
    <div class="skeleton" style="height:200px;margin-top:40px"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  var main = document.getElementById('main');

  function hello(sticker, title, sub) {
    return '<section class="hello">' + PS.sticker(sticker, 140) + '<h1>' + title + '</h1><p>' + sub + '</p></section>';
  }

  function showExpired() {
    main.innerHTML = hello('sorry', '링크가 만료됐어요', '메일 링크는 한 번만, 1시간 안에 쓸 수 있어요') +
      '<a class="btn" href="/login?mode=reset" style="margin-top:28px">메일 다시 받기</a>';
  }

  function showForm() {
    main.innerHTML = hello('checking', '새 비밀번호를 정해 주세요', '6자 이상, 잊지 않을 걸로요') +
      '<form id="form" novalidate>' +
        '<label class="field"><span>새 비밀번호</span><input class="input" id="pw1" type="password" autocomplete="new-password" placeholder="6자 이상"></label>' +
        '<label class="field"><span>한 번 더</span><input class="input" id="pw2" type="password" autocomplete="new-password" placeholder="같은 비밀번호"></label>' +
        '<div class="err" id="err" hidden></div>' +
        '<button class="btn" id="submit" type="submit" style="margin-top:24px">비밀번호 바꾸기</button>' +
      '</form>';
    var err = document.getElementById('err');
    function showErr(m) { err.textContent = m; err.hidden = false; }
    document.getElementById('pw1').focus();

    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      err.hidden = true;
      var pw1 = document.getElementById('pw1').value;
      var pw2 = document.getElementById('pw2').value;
      if (pw1.length < 6) return showErr('비밀번호는 6자 이상이에요');
      if (pw1 !== pw2) return showErr('두 비밀번호가 달라요. 다시 써 주세요');
      var btn = document.getElementById('submit');
      btn.disabled = true;
      btn.textContent = '바꾸는 중…';
      var res = await sb.auth.updateUser({ password: pw1 });
      btn.disabled = false;
      btn.textContent = '비밀번호 바꾸기';
      if (res.error) {
        if (/different|same/i.test(res.error.message)) return showErr('예전과 다른 비밀번호를 써 주세요');
        if (/weak|password/i.test(res.error.message)) return showErr('비밀번호가 너무 쉬워요. 더 길게 써 주세요');
        if (/session|jwt|expired/i.test(res.error.message)) return showExpired();
        return showErr('바꾸지 못했어요. 잠시 후 다시 해 주세요');
      }
      main.innerHTML = hello('done', '비밀번호를 바꿨어요!', '이제 새 비밀번호로 로그인하면 돼요') +
        '<a class="btn" href="/" style="margin-top:28px">시작하기</a>';
    });
  }

  PS.ready.then(function (user) {
    var q = new URLSearchParams(location.search);
    if (PS.hashParams.get('error_description') || q.get('error_description')) return showExpired();
    if (!user) return showExpired();
    showForm();
  });
})();
</script>
</body>
</html>
