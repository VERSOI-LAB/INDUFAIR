<script>
  var sidebarToggle = document.getElementById('sidebarToggle');
  var adminSidebar = document.getElementById('adminSidebar');
  if(sidebarToggle){ sidebarToggle.addEventListener('click', function(){ adminSidebar.classList.toggle('open'); }); }

  function activateTab(name) {
    document.querySelectorAll('[data-tab-target]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab-target') === name); });
    document.querySelectorAll('[data-tab-panel]').forEach(function (p) { p.classList.toggle('active', p.getAttribute('data-tab-panel') === name); });
    document.getElementById('pageTitle').textContent = name === 'companies' ? '입점사 관리' : '회원 관리';
    document.getElementById('crumbSub').textContent = name === 'companies' ? '회원 관리 · 입점사' : '회원 관리 · 전체 회원';
  }
  document.querySelectorAll('[data-tab-target]').forEach(function (btn) {
    btn.addEventListener('click', function () { activateTab(btn.getAttribute('data-tab-target')); });
  });
  var initialTab = new URLSearchParams(location.search).get('tab') === 'companies' ? 'companies' : 'members';
  activateTab(initialTab);
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-common.js"></script>
<script>
var MF = { members: [], companies: [] };

function memberRowHtml(m) {
  var status = m.status || 'active';
  return '<tr>' +
    '<td class="cell-strong">' + AC.esc(m.name || '(이름 없음)') + '</td>' +
    '<td>' + AC.esc(m.email || '-') + '</td>' +
    '<td>' + AC.label(m.member_type) + '</td>' +
    '<td class="num">' + AC.dt(m.created_at) + '</td>' +
    '<td><span class="badge ' + AC.badgeCls(status) + '">' + AC.label(status) + '</span></td>' +
    '<td><div class="table-actions">' +
      (status === 'suspended'
        ? '<button class="btn btn-ghost btn-sm" onclick="setMemberStatus(\'' + m.id + '\',\'active\')">정지 해제</button>'
        : (status === 'active' ? '<button class="btn btn-ghost btn-sm" style="color:var(--up);" onclick="setMemberStatus(\'' + m.id + '\',\'suspended\')">정지</button>' : '')) +
    '</div></td></tr>';
}

function renderMembers() {
  var q = document.getElementById('memberSearchInput').value.trim().toLowerCase();
  var type = document.getElementById('memberTypeFilter').value;
  var status = document.getElementById('memberStatusFilter').value;
  var list = MF.members.filter(function (m) {
    if (type && m.member_type !== type) return false;
    if (status && (m.status || 'active') !== status) return false;
    if (q && ((m.name || '') + ' ' + (m.email || '')).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  document.getElementById('membersTbody').innerHTML = list.map(memberRowHtml).join('') ||
    '<tr><td colspan="6" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">회원이 없습니다.</td></tr>';
  document.getElementById('memberCountText').textContent = '총 ' + list.length + '명';
}

window.setMemberStatus = async function (id, status) {
  if (!confirm(status === 'suspended' ? '이 회원을 정지 처리하시겠습니까?' : '정지를 해제하시겠습니까?')) return;
  var res = await sb.from('profiles').update({ status: status }).eq('id', id);
  if (res.error) { alert('처리에 실패했습니다: ' + res.error.message); return; }
  await loadMembers();
};

async function loadMembers() {
  var res = await sb.from('profiles').select('id, name, email, member_type, status, created_at').order('created_at', { ascending: false });
  MF.members = res.data || [];
  document.getElementById('cnt-members').textContent = MF.members.length;
  renderMembers();
}

function companyRowHtml(c) {
  return '<tr>' +
    '<td class="cell-strong">' + AC.esc(c.name) + '</td>' +
    '<td>' + AC.esc(c.biz_reg_no || '-') + '</td>' +
    '<td>' + AC.esc(c.ceo_name || '-') + '</td>' +
    '<td>' + AC.esc(c.grade) + '</td>' +
    '<td class="num">' + Number(c.fee_rate).toFixed(1) + '%</td>' +
    '<td>' + ({ weekly: '주 단위', biweekly: '격주', monthly: '월 단위' }[c.settlement_cycle] || c.settlement_cycle) + '</td>' +
    '<td>' + (c.biz_verified_at ? '<span class="badge badge-good">인증완료</span>' : '<span class="badge badge-warn">대기</span>') + '</td>' +
    '<td class="num">' + AC.dt(c.created_at) + '</td>' +
    '<td><div class="table-actions"><button class="btn btn-ghost btn-sm" onclick="openCompanyEdit(\'' + c.id + '\')">수정</button></div></td></tr>';
}

function renderCompanies() {
  var q = document.getElementById('companySearchInput').value.trim().toLowerCase();
  var list = MF.companies.filter(function (c) {
    if (q && ((c.name || '') + ' ' + (c.ceo_name || '') + ' ' + (c.biz_reg_no || '')).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  document.getElementById('companiesTbody').innerHTML = list.map(companyRowHtml).join('') ||
    '<tr><td colspan="9" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">입점사가 없습니다.</td></tr>';
  document.getElementById('companyCountText').textContent = '총 ' + list.length + '개사';
}

async function loadCompanies() {
  var res = await sb.from('companies').select('*').order('created_at', { ascending: false });
  MF.companies = res.data || [];
  document.getElementById('cnt-companies').textContent = MF.companies.length;
  renderCompanies();
}

window.openCompanyEdit = function (id) {
  var c = MF.companies.find(function (x) { return x.id === id; });
  if (!c) return;
  document.getElementById('cf-id').value = c.id;
  document.getElementById('cf-name').value = c.name;
  document.getElementById('cf-grade').value = c.grade || '';
  document.getElementById('cf-fee').value = c.fee_rate;
  document.getElementById('cf-cycle').value = c.settlement_cycle;
  document.getElementById('companyModalOverlay').style.display = 'flex';
};
document.getElementById('companyModalClose').addEventListener('click', function () { document.getElementById('companyModalOverlay').style.display = 'none'; });
document.getElementById('companyModalCancel').addEventListener('click', function () { document.getElementById('companyModalOverlay').style.display = 'none'; });
document.getElementById('companyForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var id = document.getElementById('cf-id').value;
  var res = await sb.from('companies').update({
    grade: document.getElementById('cf-grade').value.trim() || '일반 판매자',
    fee_rate: Number(document.getElementById('cf-fee').value || 0),
    settlement_cycle: document.getElementById('cf-cycle').value
  }).eq('id', id);
  if (res.error) { alert('저장에 실패했습니다: ' + res.error.message); return; }
  document.getElementById('companyModalOverlay').style.display = 'none';
  await loadCompanies();
});

document.getElementById('memberSearchInput').addEventListener('input', renderMembers);
document.getElementById('memberTypeFilter').addEventListener('change', renderMembers);
document.getElementById('memberStatusFilter').addEventListener('change', renderMembers);
document.getElementById('memberResetBtn').addEventListener('click', function () {
  document.getElementById('memberSearchInput').value = '';
  document.getElementById('memberTypeFilter').value = '';
  document.getElementById('memberStatusFilter').value = '';
  renderMembers();
});
document.getElementById('companySearchInput').addEventListener('input', renderCompanies);
document.getElementById('companyResetBtn').addEventListener('click', function () {
  document.getElementById('companySearchInput').value = '';
  renderCompanies();
});

AC.ready(async function (user) {
  document.querySelector('.admin-user .lbl b').textContent = (user.profile ? user.profile.name : user.email) || '관리자';
  document.querySelector('.admin-user .lbl span').textContent = user.email;
  document.querySelector('.admin-user .avatar').textContent = ((user.profile && user.profile.name) || user.email).charAt(0);
  await Promise.all([loadMembers(), loadCompanies()]);
});
</script>
</body>
