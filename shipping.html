<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>배송비 설정 - 판다산다</title>
<link rel="icon" href="/이미지/web/logo.jpg">
<link rel="stylesheet" href="/app.css">
<style>
  .app,.app.no-tabbar{padding-bottom:calc(var(--tabbar-h) + 104px + env(safe-area-inset-bottom));}
  .lead{font-size:15px;color:var(--sub);line-height:1.6;margin-top:4px;}
  .price-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .price-row .input{flex:1;font-size:20px;font-weight:700;}
  .price-row span{font-weight:700;}
  .qset{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .ex{margin-top:24px;background:var(--bg);border-radius:16px;padding:16px;font-size:15px;line-height:1.7;}
  .ex b{display:block;margin-bottom:4px;}
  .footer{position:fixed;left:0;right:0;bottom:0;max-width:var(--app-w);margin:0 auto;z-index:30;background:var(--surface);padding:12px 16px;border-top:1px solid var(--line);}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" href="/mypage" aria-label="마이로 돌아가기"><i data-icon="back" data-size="24"></i></a><h1>배송비 설정</h1>
  </header>
  <main class="page" id="main"><div class="skeleton" style="height:160px;border-radius:16px;margin-top:12px"></div></main>
</div>
<div class="footer over-tabbar" id="footer" hidden><button class="btn" id="saveBtn">저장하기</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var on = false, min = 0;

  PS.ready.then(async function (user) {
    if (!user) return PS.goLogin();
    var r = await sb.from('profiles').select('free_ship_min').eq('id', user.id).maybeSingle();
    if (r.error) { $('main').innerHTML = '<div class="empty">' + PS.sticker('sorry', 120) + '<b>아직 준비 중이에요</b>잠시 후 다시 열어 주세요</div>'; return; }
    min = (r.data && r.data.free_ship_min) || 0;
    on = min > 0;
    render();
    $('footer').hidden = false;
  });

  function render() {
    $('main').innerHTML =
      '<div class="field" style="margin-top:12px"><span>배송비 무료 기준</span>' +
        '<p class="lead">사는 사람이 내 물건을 한 번에 주문한 금액이 기준 이상이면 배송비를 받지 않아요.</p>' +
        '<div class="chip-grid" style="margin-top:12px">' +
          '<button type="button" class="chip' + (on ? ' on' : '') + '" data-on="1">기준 금액 정하기</button>' +
          '<button type="button" class="chip' + (on ? '' : ' on') + '" data-on="0">기준 없음</button></div>' +
        (on ? '<div class="price-row"><input class="input" id="minInput" inputmode="numeric" placeholder="300,000" value="' + (min ? min.toLocaleString('ko-KR') : '') + '"><span>원 이상</span></div>' +
          '<div class="qset">' + [100000, 200000, 300000, 500000].map(function (n) { return '<button type="button" class="chip" data-set="' + n + '">' + PS.won(n) + '</button>'; }).join('') + '</div>' : '') +
      '</div>' +
      '<div class="ex"><b>이렇게 계산돼요</b>' +
        (on && min ? '· 같이 주문한 금액이 ' + PS.won(min) + ' 이상 → 배송비 무료<br>· ' + PS.won(min) + ' 미만 → 물건에 설정한 배송비(가장 큰 금액 한 번)'
          : '· 물건마다 설정한 배송비를 받아요 (같이 주문하면 가장 큰 배송비 한 번)') +
        '<br>· 물건별 배송비는 판매하기·규격 수정하기에서 정해요</div>';
    $('main').querySelectorAll('[data-on]').forEach(function (b) {
      b.addEventListener('click', function () { on = b.dataset.on === '1'; render(); if (on) $('minInput').focus(); });
    });
    $('main').querySelectorAll('[data-set]').forEach(function (b) {
      b.addEventListener('click', function () { min = Number(b.dataset.set); render(); });
    });
    if ($('minInput')) $('minInput').addEventListener('input', function (e) {
      min = Number(e.target.value.replace(/[^0-9]/g, '').slice(0, 9)) || 0;
      e.target.value = min ? min.toLocaleString('ko-KR') : '';
    });
  }

  $('saveBtn').addEventListener('click', async function () {
    if (on && !min) return PS.toast('기준 금액을 써 주세요');
    var btn = $('saveBtn');
    btn.disabled = true;
    var r = await sb.from('profiles').update({ free_ship_min: on ? min : null }).eq('id', PS.user.id);
    btn.disabled = false;
    if (r.error) { console.error(r.error); return PS.toast('저장하지 못했어요. 다시 해 주세요'); }
    PS.toast(on ? PS.won(min) + ' 이상 배송비 무료로 저장했어요' : '배송비 무료 기준을 없앴어요');
  });
})();
</script>
</body>
</html>
