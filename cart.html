<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>장바구니 - 판다산다</title>
<link rel="icon" href="/이미지/web/logo.jpg">
<link rel="stylesheet" href="/app.css">
<style>
  .app{background:#F2F3F5;}
  .topbar{background:#F2F3F5;}
  .grp{background:var(--surface);border-radius:18px;padding:18px;margin-bottom:12px;}
  .grp h3{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;margin-bottom:6px;}
  .grp h3 a{color:inherit;}
  .it{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);}
  .it:first-of-type{border-top:0;}
  .it img,.it .noimg{width:72px;height:72px;border-radius:12px;object-fit:contain;background:#F7F7F7;flex-shrink:0;}
  .it .tx{flex:1;min-width:0;}
  .it .nm{font-size:15px;line-height:1.4;}
  .it .op{display:inline-block;font-size:12px;font-weight:700;background:var(--primary-light);border-radius:6px;padding:2px 8px;margin-top:4px;}
  .it .pr{font-size:17px;font-weight:800;margin-top:4px;}
  .it .bad{font-size:13px;color:var(--danger);font-weight:700;margin-top:4px;}
  .it .row2{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;}
  .stepper button{width:36px;height:36px;font-size:20px;font-weight:700;}
  .stepper b{min-width:32px;text-align:center;}
  .del{font-size:13px;color:var(--hint);padding:6px;}
  .sum{border-top:1px solid var(--line);margin-top:4px;padding-top:12px;}
  .sum div{display:flex;justify-content:space-between;font-size:15px;color:var(--sub);margin-top:6px;}
  .sum .tot{color:var(--text);font-size:17px;font-weight:800;}
  .more{font-size:13px;font-weight:700;color:#D9480F;background:#FFF0E8;border-radius:8px;padding:8px 10px;margin-top:10px;}
  .free{font-size:13px;font-weight:700;color:#2B8A3E;background:#EBFBEE;border-radius:8px;padding:8px 10px;margin-top:10px;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="back" id="backBtn" aria-label="뒤로"><i data-icon="back" data-size="24"></i></button><h1>장바구니</h1>
  </header>
  <main class="page" id="main"><div class="skeleton" style="height:160px;border-radius:18px"></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var products = {};
  var names = {}, mins = {};

  $('backBtn').addEventListener('click', function () {
    if (history.length > 1 && document.referrer.indexOf(location.host) !== -1) history.back(); else location.href = '/buy';
  });

  PS.ready.then(async function (user) {
    if (!user) return PS.goLogin();
    var items = PS.cart.items();
    if (!items.length) return empty();
    var ids = items.map(function (x) { return x.pid; });
    var r = await sb.from('products').select('id,title,price,status,seller_profile_id,options,shipping_fee,product_images(url,sort_order)').in('id', ids);
    (r.data || []).forEach(function (p) { products[p.id] = p; });
    var sellers = Object.keys(products).map(function (k) { return products[k].seller_profile_id; });
    var res = await Promise.all([PS.publicProfiles(sellers), PS.freeShipMins(sellers)]);
    names = res[0]; mins = res[1];
    render();
  });

  function empty() {
    $('main').innerHTML = '<div class="empty" style="padding-top:60px">' + PS.icon3d('buy', 96) + '<b>장바구니가 비어 있어요</b>마음에 드는 물건을 담아 보세요<div style="margin-top:20px"><a class="btn" href="/buy">물건 보러 가기</a></div></div>';
  }

  function lineOf(x) {
    var p = products[x.pid];
    if (!p) return null;
    var opts = PS.options(p);
    var price = opts.length ? (x.opt != null && opts[x.opt] ? PS.optionPrice(p, x.opt) : 0) : p.price;
    var bad = p.status !== 'selling' ? (PS.STATUS[p.status] || '판매 종료') : !(price > 0) ? '가격 협의' : opts.length && (x.opt == null || !opts[x.opt]) ? '규격을 다시 골라 주세요' : '';
    return { x: x, p: p, price: price, qty: x.qty, fee: p.shipping_fee || 0, bad: bad, opt: opts.length && opts[x.opt] ? opts[x.opt].name : '' };
  }

  function render() {
    var items = PS.cart.items();
    if (!items.length) return empty();
    var groups = {};
    items.forEach(function (x) {
      var l = lineOf(x);
      if (!l) return;
      (groups[l.p.seller_profile_id] = groups[l.p.seller_profile_id] || []).push(l);
    });
    var gone = items.filter(function (x) { return !products[x.pid]; });
    if (gone.length) PS.cart.removeMany(gone.map(function (x) { return x.pid + '|' + x.opt; })); // 지워진 물건 정리
    var keys = Object.keys(groups);
    if (!keys.length) return empty();
    $('main').innerHTML = keys.map(function (sid) {
      var lines = groups[sid];
      var ok = lines.filter(function (l) { return !l.bad; });
      var min = mins[sid] || 0;
      var g = PS.groupShip(ok, min);
      return '<section class="grp"><h3>' + PS.icon('receipt', 18) + '<a href="' + PS.profileUrl(sid) + '">' + PS.esc((names[sid] && names[sid].name) || '판매자') + '</a></h3>' +
        lines.map(function (l) {
          var img = PS.firstImage(l.p);
          var key = l.x.pid + '|' + l.x.opt;
          return '<div class="it">' + (img ? '<img src="' + PS.esc(img) + '" alt="">' : '<div class="noimg"></div>') +
            '<div class="tx"><a class="nm" href="' + PS.productUrl(l.p.id) + '">' + PS.esc(PS.splitTitle(l.p.title).name) + '</a>' +
            (l.opt ? '<br><span class="op">규격: ' + PS.esc(l.opt) + '</span>' : '') +
            (l.bad ? '<div class="bad">' + PS.esc(l.bad) + '</div>' : '<div class="pr">' + (l.price * l.qty).toLocaleString('ko-KR') + '원</div>') +
            '<div class="row2"><div class="stepper"><button data-k="' + key + '" data-d="-1" aria-label="빼기">−</button><b>' + l.qty + '</b><button data-k="' + key + '" data-d="1" aria-label="더하기">+</button></div>' +
            '<button class="del" data-del="' + key + '">삭제</button></div></div></div>';
        }).join('') +
        '<div class="sum"><div><span>상품 금액</span><span>' + g.sub.toLocaleString('ko-KR') + '원</span></div>' +
        '<div><span>배송비</span><span>' + (g.fee ? g.fee.toLocaleString('ko-KR') + '원' : '무료') + '</span></div>' +
        '<div class="tot"><span>합계</span><span>' + (g.sub + g.fee).toLocaleString('ko-KR') + '원</span></div></div>' +
        (g.left > 0 ? '<div class="more">' + g.left.toLocaleString('ko-KR') + '원 더 담으면 배송비 무료 (' + PS.won(min) + ' 이상)</div>'
          : min > 0 && ok.length && !g.fee && ok.some(function (l) { return l.fee > 0; }) ? '<div class="free">' + PS.won(min) + ' 이상이라 배송비 무료!</div>' : '') +
        '<button class="btn" style="margin-top:14px" data-order="' + sid + '"' + (ok.length ? '' : ' disabled') + '>' + (ok.length ? (g.sub + g.fee).toLocaleString('ko-KR') + '원 주문하기' : '주문할 수 있는 물건이 없어요') + '</button>' +
        '</section>';
    }).join('') + '<p style="font-size:13px;color:var(--hint);text-align:center;margin:8px 0 0">판매자마다 따로 주문·배송돼요</p>';
  }

  $('main').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.k) {
      var parts = b.dataset.k.split('|');
      var pid = parts[0], opt = parts[1] === 'null' ? null : Number(parts[1]);
      var cur = PS.cart.items().filter(function (x) { return x.pid === pid && x.opt === opt; })[0];
      if (!cur) return;
      var q = Math.max(1, Math.min(999, cur.qty + Number(b.dataset.d)));
      PS.cart.setQty(pid, opt, q);
      render();
    } else if (b.dataset.del) {
      PS.cart.removeMany([b.dataset.del]);
      render();
    } else if (b.dataset.order) {
      location.href = '/checkout?seller=' + encodeURIComponent(b.dataset.order);
    }
  });
})();
</script>
</body>
</html>
