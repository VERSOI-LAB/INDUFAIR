<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>판다산다 - 산업용품 신품부터 중고까지 가장 쉽게</title>
<meta name="description" content="사진 찍고, 가격 쓰고, 끝. 산업용품을 당근마켓처럼 쉽게 사고파는 판다산다">
<link rel="icon" href="/이미지/web/logo.jpg">
<link rel="stylesheet" href="/app.css">
<style>
  .hero{padding:28px 0 4px;text-align:center;}
  .hero .brand{font-size:15px;font-weight:800;color:var(--primary-press);letter-spacing:.02em;}
  .hero h1{margin-top:6px;font-size:min(20px, 5.2vw);font-weight:800;line-height:1.3;white-space:nowrap;}
  .hero p{margin-top:6px;color:var(--sub);font-size:16px;}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
  .pick-card{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;transition:transform .08s ease;}
  .pick-card:active{transform:scale(.97);}
  .pick-card img{width:100%;aspect-ratio:3/4;object-fit:cover;}
  .pick-card .go{display:flex;align-items:center;justify-content:center;gap:6px;height:56px;font-size:18px;font-weight:800;}
  .pick-card.sell{background:#FBF5E9;}
  .pick-card.sell .go{background:var(--primary);}
  .pick-card.buy{background:#EAF2FE;}
  .pick-card.buy .go{background:#2F5BD3;color:#fff;}
  .more{margin:24px 0 8px;}
</style>
</head>
<body>
<div class="app">
  <main class="page">
    <section class="hero">
      <div class="brand">판다산다</div>
      <h1>산업용품 신품부터 중고까지 가장 쉽게</h1>
      <p>사진 찍고, 가격 쓰면 끝!</p>
    </section>

    <div class="actions">
      <a class="pick-card sell" href="/sell">
        <img src="/이미지/web/panda-sell.jpg" alt="판다 - 필요한 산업용품, 판매하세요!" width="600" height="800">
        <span class="go"><i data-icon3d="camera" data-size="30"></i> 판매하기</span>
      </a>
      <a class="pick-card buy" href="/buy">
        <img src="/이미지/web/panda-buy.jpg" alt="산다 - 원하는 산업용품, 구매하세요!" width="600" height="800">
        <span class="go"><i data-icon3d="buy" data-size="30"></i> 구매하기</span>
      </a>
    </div>

    <h2 class="sec-title">방금 올라온 물건</h2>
    <div class="list" id="recentGrid"></div>
    <div class="more" id="moreWrap" hidden><button class="btn white small" id="moreBtn">더 보기</button></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  PS.renderTabbar('home');
  var PAGE = 20;
  var offset = 0;
  var grid = document.getElementById('recentGrid');
  var moreWrap = document.getElementById('moreWrap');

  grid.innerHTML = Array(4).join('.').split('.').map(function () {
    return '<div class="row"><div class="skeleton" style="width:108px;height:108px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton" style="height:20px"></div><div class="skeleton" style="height:16px;width:60%;margin-top:8px"></div></div></div>';
  }).join('');

  async function load() {
    var res = await sb.from('products').select(PS.PRODUCT_LIST_COLUMNS)
      .in('status', ['selling', 'reserved'])
      .order('created_at', { ascending: false })
      .range(offset, offset + PAGE - 1);
    var rows = res.data || [];
    if (offset === 0) grid.innerHTML = '';
    if (offset === 0 && !rows.length) {
      grid.outerHTML = '<div class="empty">' + PS.icon3d('sell', 96) + '<b>아직 올라온 물건이 없어요</b>첫 번째로 판매해 보세요!</div>';
      return;
    }
    grid.insertAdjacentHTML('beforeend', rows.map(PS.rowHtml).join(''));
    offset += rows.length;
    moreWrap.hidden = rows.length < PAGE;
  }

  document.getElementById('moreBtn').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
