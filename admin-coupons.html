<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-common.js"></script>
<script>
var CF = { coupons: [], usage: {} };

function discountLabel(c) {
  return c.discount_type === 'percent' ? (c.discount_value + '%') : AC.won(c.discount_value);
}

function periodLabel(c) {
  var from = c.valid_from ? c.valid_from.slice(0, 10).replace(/-/g, '.') : '-';
  var until = c.valid_until ? c.valid_until.slice(0, 10).replace(/-/g, '.') : '무기한';
  return from + ' ~ ' + until;
}

function couponRowHtml(c) {
  var usage = CF.usage[c.id] || { issued: 0, used: 0 };
  return '<tr>' +
    '<td class="cell-strong">' + AC.esc(c.title) + '</td>' +
    '<td class="num">' + AC.esc(c.code) + '</td>' +
    '<td>' + discountLabel(c) + '</td>' +
    '<td class="num">' + AC.won(c.min_order_amount) + '</td>' +
    '<td>' + periodLabel(c) + '</td>' +
    '<td class="num">' + usage.issued + ' / ' + usage.used + '</td>' +
    '<td><div class="table-actions">' +
      '<button class="btn btn-ghost btn-sm" onclick="openCouponEdit(' + c.id + ')">수정</button>' +
      '<button class="btn btn-ghost btn-sm" style="color:var(--up);" onclick="deleteCoupon(' + c.id + ')">삭제</button>' +
    '</div></td></tr>';
}

function renderCoupons() {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var list = CF.coupons.filter(function (c) {
    if (q && (c.title + ' ' + c.code).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  document.getElementById('couponsTbody').innerHTML = list.map(couponRowHtml).join('') ||
    '<tr><td colspan="7" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">등록된 쿠폰이 없습니다.</td></tr>';
  document.getElementById('totalCountText').textContent = '총 ' + list.length + '건';
}

async function loadCoupons() {
  var [couponsRes, usageRes] = await Promise.all([
    sb.from('coupons').select('*').order('created_at', { ascending: false }),
    sb.from('user_coupons').select('coupon_id, used_at')
  ]);
  CF.coupons = couponsRes.data || [];
  CF.usage = {};
  (usageRes.data || []).forEach(function (u) {
    if (!CF.usage[u.coupon_id]) CF.usage[u.coupon_id] = { issued: 0, used: 0 };
    CF.usage[u.coupon_id].issued++;
    if (u.used_at) CF.usage[u.coupon_id].used++;
  });
  renderCoupons();
}

function openCouponModal() { document.getElementById('couponModalOverlay').style.display = 'flex'; }
function closeCouponModal() { document.getElementById('couponModalOverlay').style.display = 'none'; }

document.getElementById('newCouponBtn').addEventListener('click', function () {
  document.getElementById('couponModalTitle').textContent = '쿠폰 등록';
  document.getElementById('couponSubmitBtn').textContent = '등록하기';
  document.getElementById('cpf-id').value = '';
  document.getElementById('couponForm').reset();
  document.getElementById('cpf-min').value = 0;
  openCouponModal();
});

window.openCouponEdit = function (id) {
  var c = CF.coupons.find(function (x) { return x.id === id; });
  if (!c) return;
  document.getElementById('couponModalTitle').textContent = '쿠폰 수정';
  document.getElementById('couponSubmitBtn').textContent = '저장하기';
  document.getElementById('cpf-id').value = c.id;
  document.getElementById('cpf-title').value = c.title;
  document.getElementById('cpf-code').value = c.code;
  document.getElementById('cpf-type').value = c.discount_type;
  document.getElementById('cpf-value').value = c.discount_value;
  document.getElementById('cpf-min').value = c.min_order_amount;
  document.getElementById('cpf-from').value = c.valid_from ? c.valid_from.slice(0, 10) : '';
  document.getElementById('cpf-until').value = c.valid_until ? c.valid_until.slice(0, 10) : '';
  openCouponModal();
};

window.deleteCoupon = async function (id) {
  if (!confirm('이 쿠폰을 삭제하시겠습니까?')) return;
  var res = await sb.from('coupons').delete().eq('id', id);
  if (res.error) { alert('삭제에 실패했습니다: ' + res.error.message); return; }
  await loadCoupons();
};

document.getElementById('couponModalClose').addEventListener('click', closeCouponModal);
document.getElementById('couponModalCancel').addEventListener('click', closeCouponModal);
document.getElementById('couponForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var id = document.getElementById('cpf-id').value;
  var payload = {
    title: document.getElementById('cpf-title').value.trim(),
    code: document.getElementById('cpf-code').value.trim().toUpperCase(),
    discount_type: document.getElementById('cpf-type').value,
    discount_value: Number(document.getElementById('cpf-value').value || 0),
    min_order_amount: Number(document.getElementById('cpf-min').value || 0),
    valid_from: document.getElementById('cpf-from').value || new Date().toISOString().slice(0, 10),
    valid_until: document.getElementById('cpf-until').value || null
  };
  var res = id ? await sb.from('coupons').update(payload).eq('id', id) : await sb.from('coupons').insert(payload);
  if (res.error) { alert('저장에 실패했습니다: ' + res.error.message); return; }
  closeCouponModal();
  await loadCoupons();
});
document.getElementById('searchInput').addEventListener('input', renderCoupons);

AC.ready(async function (user) {
  document.querySelector('.admin-user .lbl b').textContent = (user.profile ? user.profile.name : user.email) || '관리자';
  document.querySelector('.admin-user .lbl span').textContent = user.email;
  document.querySelector('.admin-user .avatar').textContent = ((user.profile && user.profile.name) || user.email).charAt(0);
  await loadCoupons();
});
</script>
