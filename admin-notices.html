<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
var NF = { notices: [] };

function noticeRowHtml(n) {
  return '<tr>' +
    '<td class="cell-strong">' + AC.esc(n.title) + '</td>' +
    '<td class="num">' + AC.dt(n.created_at) + '</td>' +
    '<td><div class="table-actions">' +
      '<button class="btn btn-ghost btn-sm" onclick="openNoticeEdit(' + n.id + ')">수정</button>' +
      '<button class="btn btn-ghost btn-sm" style="color:var(--up);" onclick="deleteNotice(' + n.id + ')">삭제</button>' +
    '</div></td></tr>';
}

function renderNotices() {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var list = NF.notices.filter(function (n) {
    if (q && (n.title + ' ' + n.content).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  document.getElementById('noticesTbody').innerHTML = list.map(noticeRowHtml).join('') ||
    '<tr><td colspan="3" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">등록된 공지가 없습니다.</td></tr>';
  document.getElementById('totalCountText').textContent = '총 ' + list.length + '건';
}

async function loadNotices() {
  var res = await sb.from('notices').select('*').order('created_at', { ascending: false });
  NF.notices = res.data || [];
  renderNotices();
}

function openNoticeModal() { document.getElementById('noticeModalOverlay').style.display = 'flex'; }
function closeNoticeModal() { document.getElementById('noticeModalOverlay').style.display = 'none'; }

document.getElementById('newNoticeBtn').addEventListener('click', function () {
  document.getElementById('noticeModalTitle').textContent = '공지 등록';
  document.getElementById('noticeSubmitBtn').textContent = '등록하기';
  document.getElementById('nf-id').value = '';
  document.getElementById('nf-title').value = '';
  document.getElementById('nf-content').value = '';
  openNoticeModal();
});

window.openNoticeEdit = function (id) {
  var n = NF.notices.find(function (x) { return x.id === id; });
  if (!n) return;
  document.getElementById('noticeModalTitle').textContent = '공지 수정';
  document.getElementById('noticeSubmitBtn').textContent = '저장하기';
  document.getElementById('nf-id').value = n.id;
  document.getElementById('nf-title').value = n.title;
  document.getElementById('nf-content').value = n.content;
  openNoticeModal();
};

window.deleteNotice = async function (id) {
  if (!confirm('이 공지사항을 삭제하시겠습니까?')) return;
  var res = await sb.from('notices').delete().eq('id', id);
  if (res.error) { alert('삭제에 실패했습니다: ' + res.error.message); return; }
  await loadNotices();
};

document.getElementById('noticeModalClose').addEventListener('click', closeNoticeModal);
document.getElementById('noticeModalCancel').addEventListener('click', closeNoticeModal);
document.getElementById('noticeForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var id = document.getElementById('nf-id').value;
  var payload = {
    title: document.getElementById('nf-title').value.trim(),
    content: document.getElementById('nf-content').value.trim()
  };
  var res = id ? await sb.from('notices').update(payload).eq('id', id) : await sb.from('notices').insert(payload);
  if (res.error) { alert('저장에 실패했습니다: ' + res.error.message); return; }
  closeNoticeModal();
  await loadNotices();
});
document.getElementById('searchInput').addEventListener('input', renderNotices);

AC.ready(async function (user) {
  document.querySelector('.admin-user .lbl b').textContent = (user.profile ? user.profile.name : user.email) || '관리자';
  document.querySelector('.admin-user .lbl span').textContent = user.email;
  document.querySelector('.admin-user .avatar').textContent = ((user.profile && user.profile.name) || user.email).charAt(0);
  await loadNotices();
});
</script>
