<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>마이 - 판다산다</title>
<link rel="icon" href="/이미지/web/logo.jpg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/이미지/app/icon-180.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="/app.css">
<style>
  .gear{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .gear:active{background:#E8E9EB;}
  .me{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;padding:16px 20px;margin-bottom:12px;}
  .me .avatar{width:56px;height:56px;border-radius:50%;background:var(--primary-light);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .me .avatar img{width:100%;height:100%;object-fit:cover;}
  .me b{display:block;font-size:20px;font-weight:800;}
  .me span{font-size:14px;color:var(--sub);}
  .me .go{margin-left:auto;color:#BBB;display:flex;}
  .sell-btn{margin-bottom:12px;}
  .quick{grid-template-columns:repeat(3,1fr);}
  .guest{text-align:center;padding:60px 0 40px;}
  .guest h1{font-size:24px;font-weight:800;margin-top:12px;}
  .guest p{color:var(--sub);margin:6px 0 28px;}
</style>
</head>
<body class="gray-page">
<div class="app">
  <main class="page">
    <div class="page-title">
      <h1>마이</h1>
      <a class="gear" href="/settings" aria-label="설정"><i data-icon="gear" data-size="28"></i></a>
    </div>
    <div id="main"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  PS.renderTabbar('my');
  var main = document.getElementById('main');

  function row(href, icon, label, extra) {
    return '<a class="mrow" href="' + href + '">' + PS.icon(icon, 26) + '<span>' + label + '</span>' + (extra || '') +
      '<span class="go">' + PS.icon('chevron', 20) + '</span></a>';
  }

  PS.ready.then(function (user) {
    if (!user) {
      main.innerHTML = '<div class="guest">' + PS.sticker('hello', 160) + '<h1>판다산다에 오신 걸 환영해요</h1><p>로그인하면 내 물건과 채팅을 볼 수 있어요</p><a class="btn" href="/login?next=/mypage">로그인 / 가입하기</a></div>';
      return;
    }
    var pr = PS.profile || {};
    var home = PS.getHome();
    main.innerHTML =
      '<a class="me" href="' + PS.profileUrl(user.id) + '">' +
        '<div class="avatar">' + PS.avatarHtml(pr.avatar_url) + '</div>' +
        '<div style="min-width:0"><b>' + PS.esc(pr.name || '이웃') + '</b><span>내 프로필 보기</span></div>' +
        '<span class="go">' + PS.icon('chevron', 20) + '</span>' +
      '</a>' +
      '<a class="btn sell-btn" href="/sell">' + PS.icon3d('camera', 32) + ' 판다 · 새 물건 팔기</a>' +

      '<div class="quick">' +
        '<a href="/favorites">' + PS.icon('heart', 28) + '관심목록</a>' +
        '<a href="/recent">' + PS.icon('clock', 28) + '최근 본</a>' +
        '<a href="/cart">' + PS.icon('bag', 28) + '장바구니</a>' +
      '</div>' +

      '<div id="payoutNeed"></div>' +
      '<section class="mcard" style="display:flex;align-items:center;gap:12px">' +
        '<div style="flex:1;min-width:0"><b style="display:block;font-size:17px">친구 초대하기</b>' +
        '<span style="font-size:14px;color:var(--sub)" id="inviteN">같은 일 하는 동료에게 판다산다를 알려 주세요</span></div>' +
        '<button type="button" class="btn small" id="inviteBtn" style="width:auto;padding:0 16px;flex-shrink:0">초대 링크 보내기</button>' +
      '</section>' +
      '<section class="mcard"><h3>자주 사용</h3>' +
        row('/neighborhood', 'pin', '내 동네 설정', home ? '<span style="margin-left:auto;font-size:14px;color:var(--sub)">' + PS.esc(home.region) + '</span>' : '') +
      '</section>' +

      '<section class="mcard"><h3>나의 거래</h3>' +
        row('/sales', 'receipt', '판매관리') +
        row('/purchases', 'bag', '구매내역') +
        row('/price', 'scan', '내 물건 가격 찾기') +
        row('/my-biz', 'receipt', '업체 소개 관리') +
        row('/pay-seller', 'receipt', '안전결제 판매자', '<span style="margin-left:auto;font-size:14px;color:var(--sub)" id="payState"></span>') +
        row('/shipping', 'bag', '배송비 설정') +
      '</section>' +

      '<section class="mcard"><h3>나의 관심</h3>' +
        row('/favorites', 'heart', '관심목록') +
        row('/keywords', 'tag', '키워드 알림 설정', '<span class="badge-n" id="kwBadge" hidden></span>') +
        row('/support', 'receipt', '정부 지원사업') +
        row('/events', 'receipt', '교육·세미나·행사') +
      '</section>' +
      '<section class="mcard"><h3>설정</h3>' +
        '<button type="button" class="mrow" id="blocksBtn" style="width:100%;text-align:left">' + PS.icon('gear', 26) + '<span>차단한 사용자</span><span style="margin-left:auto;font-size:14px;color:var(--sub)" id="blocksN"></span><span class="go" style="margin-left:6px">' + PS.icon('chevron', 20) + '</span></button>' +
        '<div id="blocksList" hidden></div>' +
      '</section>';
    // "내 동네" 글자가 있으면 화살표와 겹치지 않게
    main.querySelectorAll('.mrow span[style*="margin-left:auto"] + .go').forEach(function (g) { g.style.marginLeft = '6px'; });
    loadKeywordBadge();
    loadPaySeller();
    loadStoryAdmin();
    loadInvite();
    loadBlocks();
  });

  // 사업자 인증을 했는데 정산 계좌가 없으면 등록 안내. 안전결제 판매자 상태 표시
  async function loadPaySeller() {
    var r = await sb.from('business_verifications').select('pay_status').eq('profile_id', PS.user.id).maybeSingle();
    var v = r.error ? null : r.data;
    var st = document.getElementById('payState');
    if (st) {
      st.textContent = !v ? '' : { approved: '이용 중', requested: '확인 중', rejected: '반려됨' }[v.pay_status] || '신청 가능';
      var go = st.parentNode && st.parentNode.querySelector('.go'); if (go) go.style.marginLeft = '6px';
    }
    if (!v) return;
    var acct = await PS.myPayoutAccount();
    if (acct) return;
    var box = document.getElementById('payoutNeed');
    box.innerHTML = '<section class="mcard" style="background:var(--primary-light)"><div style="display:flex;gap:12px;align-items:center;padding:4px 0">' +
      '<div style="flex:1;min-width:0"><b style="display:block;font-size:16px">정산 계좌를 등록해 주세요</b>' +
      '<span style="font-size:14px;color:var(--sub)">' + (v.pay_status === 'approved' ? '계좌가 있어야 판매 대금을 받을 수 있어요' : '사업자 판매자는 계좌를 등록하고 안전결제를 신청할 수 있어요') + '</span></div>' +
      '<button type="button" class="btn small" id="payoutBtn" style="width:auto;padding:0 16px;flex-shrink:0">등록</button></div></section>';
    document.getElementById('payoutBtn').addEventListener('click', function () {
      PS.openPayoutAccount({ onSaved: function () { box.innerHTML = ''; if (v.pay_status === 'none' || v.pay_status === 'rejected') location.href = '/pay-seller'; } });
    });
  }

  // 차단한 사용자: 수 표시, 누르면 목록 펼치고 '차단 풀기'
  async function loadBlocks() {
    var r = await sb.from('user_blocks').select('blocked_id,created_at').order('created_at', { ascending: false });
    var rows = r.error ? [] : (r.data || []);
    var n = document.getElementById('blocksN'); if (n) n.textContent = rows.length ? rows.length + '명' : '';
    var box = document.getElementById('blocksList');
    var people = await PS.publicProfiles(rows.map(function (b) { return b.blocked_id; }));
    box.innerHTML = rows.length ? rows.map(function (b) {
      var o = people[b.blocked_id] || {};
      return '<div style="display:flex;align-items:center;gap:10px;padding:10px 4px">' +
        '<a href="' + PS.profileUrl(b.blocked_id) + '" style="flex:1;min-width:0;font-size:16px;font-weight:700">' + PS.esc(o.name || '이웃') + '</a>' +
        '<button type="button" class="btn white small" data-unblock="' + b.blocked_id + '" style="width:auto;padding:0 14px">차단 풀기</button></div>';
    }).join('') : '<p style="color:var(--sub);font-size:14px;padding:10px 4px">차단한 사용자가 없어요</p>';
    document.getElementById('blocksBtn').onclick = function () { box.hidden = !box.hidden; };
    box.onclick = async function (e) {
      var u = e.target.closest('[data-unblock]'); if (!u) return;
      u.disabled = true;
      var d = await sb.from('user_blocks').delete().eq('blocker_id', PS.user.id).eq('blocked_id', u.dataset.unblock);
      if (d.error) { u.disabled = false; PS.toast('잠시 후 다시 해 주세요'); return; }
      PS.toast('차단을 풀었어요');
      await loadBlocks(); box.hidden = false;
    };
  }

  // 친구 초대: 내 링크 보내기 + 가입한 친구 수
  async function loadInvite() {
    var r = await sb.rpc('my_invite');
    var n = r.data && r.data.invited;
    if (n) document.getElementById('inviteN').textContent = '지금까지 ' + n + '명이 내 초대로 가입했어요';
    document.getElementById('inviteBtn').onclick = async function () {
      var how = await psShare('판다산다', '산업용품 사고팔기, 정부 지원사업 마감 알림까지. 판다산다 같이 써요!', '/');
      if (how === 'copied') PS.toast('초대 링크를 복사했어요. 카톡에 붙여 넣어 보내 주세요');
    };
  }

  // 운영자: 이야기 신고 검토 메뉴 + 처리할 신고 수
  async function loadStoryAdmin() {
    var ok = await sb.rpc('is_app_admin');
    if (ok.error || ok.data !== true) return;
    var n = await sb.rpc('story_admin_open_count');
    var cnt = n.error ? 0 : (n.data || 0);
    main.insertAdjacentHTML('beforeend', '<section class="mcard"><h3>운영</h3>' +
      row('/community/admin', 'chat', '이야기 신고 검토', cnt ? '<span class="badge-n">' + (cnt > 99 ? '99+' : cnt) + '</span>' : '') + '</section>');
  }

  // 키워드 알림: 마지막으로 본 뒤 새로 올라온, 키워드가 들어간 물건 수
  async function loadKeywordBadge() {
    var kw = await sb.from('keyword_alerts').select('keyword').eq('profile_id', PS.user.id);
    if (kw.error || !(kw.data || []).length) return;
    var since = null;
    try { since = localStorage.getItem('ps_kw_seen'); } catch (e) {}
    since = since || new Date(Date.now() - 7 * 86400000).toISOString();
    var ors = kw.data.map(function (k) { return 'title.ilike.%' + k.keyword.replace(/[%_,()]/g, ' ') + '%'; }).join(',');
    var got = await Promise.all([
      sb.from('products').select('id', { count: 'exact', head: true })
        .in('status', ['selling', 'reserved']).neq('seller_profile_id', PS.user.id).gt('created_at', since).or(ors),
      sb.from('support_programs').select('id', { count: 'exact', head: true }).gt('posted_at', since).or(ors),
      sb.from('biz_events').select('id', { count: 'exact', head: true }).gt('posted_at', since).or(ors)
    ]);
    var n = got.reduce(function (s, r) { return s + (r.error ? 0 : r.count || 0); }, 0);
    var b = document.getElementById('kwBadge');
    if (b && n) { b.textContent = n > 99 ? '99+' : n; b.hidden = false; }
  }
})();
</script>
</body>
</html>
