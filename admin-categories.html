<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>

<script>
var CTF = { categories: [] };

function renderCategories() {
  var tops = CTF.categories.filter(function (c) { return !c.parent_id; }).sort(function (a, b) { return a.sort_order - b.sort_order; });
  var rows = [];
  tops.forEach(function (top) {
    rows.push('<tr class="cat-top"><td>' + AC.esc(top.name) + '</td><td>대분류</td><td class="num">' + top.sort_order + '</td>' +
      '<td><div class="table-actions">' +
        '<button class="btn btn-ghost btn-sm" onclick="openSubNew(' + top.id + ')">하위 추가</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="openCatEdit(' + top.id + ')">수정</button>' +
        '<button class="btn btn-ghost btn-sm" style="color:var(--up);" onclick="deleteCategory(' + top.id + ')">삭제</button>' +
      '</div></td></tr>');
    var subs = CTF.categories.filter(function (c) { return c.parent_id === top.id; }).sort(function (a, b) { return a.sort_order - b.sort_order; });
    subs.forEach(function (sub) {
      rows.push('<tr class="cat-sub"><td>' + AC.esc(sub.name) + '</td><td>' + AC.esc(top.name) + ' 하위</td><td class="num">' + sub.sort_order + '</td>' +
        '<td><div class="table-actions">' +
          '<button class="btn btn-ghost btn-sm" onclick="openCatEdit(' + sub.id + ')">수정</button>' +
          '<button class="btn btn-ghost btn-sm" style="color:var(--up);" onclick="deleteCategory(' + sub.id + ')">삭제</button>' +
        '</div></td></tr>');
    });
  });
  document.getElementById('catTbody').innerHTML = rows.join('') ||
    '<tr><td colspan="4" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">등록된 카테고리가 없습니다.</td></tr>';
  document.getElementById('totalCountText').textContent = '총 ' + CTF.categories.length + '개';

  var parentSelect = document.getElementById('ctf-parent');
  parentSelect.innerHTML = '<option value="">없음 (대분류)</option>' +
    tops.map(function (t) { return '<option value="' + t.id + '">' + AC.esc(t.name) + '</option>'; }).join('');
}

async function loadCategories() {
  var res = await sb.from('categories').select('*').order('sort_order');
  CTF.categories = res.data || [];
  renderCategories();
}

function openCatModal() { document.getElementById('catModalOverlay').style.display = 'flex'; }
function closeCatModal() { document.getElementById('catModalOverlay').style.display = 'none'; }

document.getElementById('newTopBtn').addEventListener('click', function () {
  document.getElementById('catModalTitle').textContent = '대분류 추가';
  document.getElementById('catSubmitBtn').textContent = '등록하기';
  document.getElementById('ctf-id').value = '';
  document.getElementById('ctf-name').value = '';
  document.getElementById('ctf-parent').value = '';
  document.getElementById('ctf-sort').value = CTF.categories.length ? Math.max.apply(null, CTF.categories.map(function (c) { return c.sort_order; })) + 1 : 0;
  openCatModal();
});

window.openSubNew = function (parentId) {
  document.getElementById('catModalTitle').textContent = '하위 카테고리 추가';
  document.getElementById('catSubmitBtn').textContent = '등록하기';
  document.getElementById('ctf-id').value = '';
  document.getElementById('ctf-name').value = '';
  document.getElementById('ctf-parent').value = parentId;
  document.getElementById('ctf-sort').value = CTF.categories.length ? Math.max.apply(null, CTF.categories.map(function (c) { return c.sort_order; })) + 1 : 0;
  openCatModal();
};

window.openCatEdit = function (id) {
  var c = CTF.categories.find(function (x) { return x.id === id; });
  if (!c) return;
  document.getElementById('catModalTitle').textContent = '카테고리 수정';
  document.getElementById('catSubmitBtn').textContent = '저장하기';
  document.getElementById('ctf-id').value = c.id;
  document.getElementById('ctf-name').value = c.name;
  document.getElementById('ctf-parent').value = c.parent_id || '';
  document.getElementById('ctf-sort').value = c.sort_order;
  openCatModal();
};

window.deleteCategory = async function (id) {
  var hasChildren = CTF.categories.some(function (c) { return c.parent_id === id; });
  if (hasChildren) { alert('하위 카테고리가 남아있어 삭제할 수 없습니다. 하위 카테고리를 먼저 삭제해주세요.'); return; }
  if (!confirm('이 카테고리를 삭제하시겠습니까? 이 카테고리로 등록된 상품이 있다면 삭제에 실패할 수 있습니다.')) return;
  var res = await sb.from('categories').delete().eq('id', id);
  if (res.error) { alert('삭제에 실패했습니다: ' + res.error.message); return; }
  await loadCategories();
};

document.getElementById('catModalClose').addEventListener('click', closeCatModal);
document.getElementById('catModalCancel').addEventListener('click', closeCatModal);
document.getElementById('catForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var id = document.getElementById('ctf-id').value;
  var parentVal = document.getElementById('ctf-parent').value;
  var payload = {
    name: document.getElementById('ctf-name').value.trim(),
    parent_id: parentVal ? Number(parentVal) : null,
    sort_order: Number(document.getElementById('ctf-sort').value || 0)
  };
  var res = id ? await sb.from('categories').update(payload).eq('id', id) : await sb.from('categories').insert(payload);
  if (res.error) { alert('저장에 실패했습니다: ' + res.error.message); return; }
  closeCatModal();
  await loadCategories();
});

AC.ready(async function (user) {
  document.querySelector('.admin-user .lbl b').textContent = (user.profile ? user.profile.name : user.email) || '관리자';
  document.querySelector('.admin-user .lbl span').textContent = user.email;
  document.querySelector('.admin-user .avatar').textContent = ((user.profile && user.profile.name) || user.email).charAt(0);
  await loadCategories();
});
</script>
