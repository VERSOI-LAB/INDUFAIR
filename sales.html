<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>판매관리 - 판다산다</title>
<link rel="icon" href="/이미지/web/logo.jpg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/이미지/app/icon-180.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="/app.css">
<style>
  .tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-bottom:1px solid var(--line);margin:8px 0 0;}
  .tabs button{height:52px;font-size:17px;font-weight:700;color:var(--hint);border-bottom:3px solid transparent;}
  .tabs button.on{color:var(--text);border-bottom-color:var(--text);}
  .tabs button em{font-style:normal;font-weight:600;margin-left:4px;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-radius:var(--radius);background:var(--bg);}
  .stats div{text-align:center;padding:16px 4px;}
  .stats b{display:block;font-size:24px;font-weight:800;}
  .stats span{font-size:14px;color:var(--sub);}
  .row-wrap{position:relative;}
  .row-wrap .row .s{justify-content:flex-start;}
  .row-wrap .row-acts{position:absolute;right:0;bottom:16px;display:flex;gap:6px;}
  .row-wrap .row-acts .chg{position:static;}
  .row-wrap .chg.bump{background:var(--primary-light);border-color:var(--primary);}
  .row-wrap .chg{position:absolute;right:0;bottom:16px;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" href="/mypage" aria-label="마이로 돌아가기"><i data-icon="back" data-size="24"></i></a>
    <h1>판매관리</h1>
  </header>
  <main class="page">
    <div class="stats" id="stats"><div><b>-</b><span>조회수</span></div><div><b>-</b><span>찜수</span></div><div><b>-</b><span>채팅수</span></div></div>
    <a class="btn" href="/sell" style="margin-top:12px"><i data-icon3d="camera" data-size="32"></i> 판다 · 새 물건 팔기</a>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="filter" hidden></div>
    <div class="list" id="list"><div class="skeleton" style="height:108px;margin:16px 0"></div></div>
  </main>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="statusSheet" role="dialog" aria-label="판매 상태 바꾸기">
  <div class="handle"></div>
  <button class="opt" data-s="selling"><i data-icon3d="sell" data-size="30"></i>판매중</button>
  <button class="opt" data-s="sold"><i data-icon3d="handshake" data-size="30"></i>판매완료</button>
  <button class="opt" data-s="delete" style="color:var(--danger)"><i data-icon3d="trash" data-size="30"></i>삭제하기</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  PS.renderTabbar('my');
  var $ = function (id) { return document.getElementById(id); };
  var products = [];
  var orders = [], buyers = {}; // 결제된 주문과 구매자 이름
  var payable = false; // 안전결제 판매자로 승인됐는가 (아니면 결제 주문이 들어오지 않음)
  var account = null, accountReady = false; // 정산 받을 계좌 (표가 아직 없으면 안내를 숨김)
  var tab = PS.STATUS[PS.param('tab')] || PS.param('tab') === 'orders' ? PS.param('tab') : 'selling';
  var targetId = null;
  var day = function (iso) { var d = new Date(iso); return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate(); };
  var soldAt = {}; // 판매완료 날짜 (sold_at, 없으면 등록일)
  // 판매완료·주문 내역 검색 (글자 + 기간)
  var filter = PS.makeFilter($('filter'), '', function () { renderTabs(); });

  PS.ready.then(function (user) { if (!user) return PS.goLogin(); load(); });

  async function load() {
    var res = await sb.from('products').select(PS.PRODUCT_LIST_COLUMNS)
      .eq('seller_profile_id', PS.user.id).neq('status', 'deleted').order('created_at', { ascending: false });
    products = res.data || [];
    // 판매완료 날짜 (컬럼이 아직 없으면 등록일로)
    var sr = await sb.from('products').select('id,sold_at').eq('seller_profile_id', PS.user.id).eq('status', 'sold');
    soldAt = {};
    if (!sr.error) (sr.data || []).forEach(function (x) { soldAt[x.id] = x.sold_at; });
    var sum = function (k) { return products.reduce(function (a, p) { return a + (p[k] || 0); }, 0).toLocaleString('ko-KR'); };
    $('stats').innerHTML = '<div><b>' + sum('view_count') + '</b><span>조회수</span></div><div><b>' + sum('like_count') + '</b><span>찜수</span></div><div><b>' + sum('inquiry_count') + '</b><span>채팅수</span></div>';
    orders = await PS.myOrders('seller');
    buyers = await PS.publicProfiles(orders.map(function (o) { return o.buyer_id; }));
    var ar = await sb.from('seller_payout_accounts').select('bank_name,account_no,holder_name').eq('profile_id', PS.user.id).maybeSingle();
    accountReady = !ar.error;
    account = ar.data || null;
    payable = await PS.canPay(PS.user.id);
    renderTabs();
  }

  function renderTabs() {
    // 예약중은 없앤 상태: 예전에 예약중으로 둔 물건이 남아 있으면 판매중으로 묶어 보여줌
    var inTab = function (p, s) { return p.status === s || (s === 'selling' && p.status === 'reserved'); };
    var count = function (s) { return products.filter(function (p) { return inTab(p, s); }).length; };
    $('tabs').innerHTML = Object.keys(PS.STATUS).map(function (s) {
      return '<button role="tab" aria-selected="' + (s === tab) + '" class="' + (s === tab ? 'on' : '') + '" data-s="' + s + '">' + PS.STATUS[s] + '<em>' + count(s) + '</em></button>';
    }).join('') +
      '<button role="tab" aria-selected="' + (tab === 'orders') + '" class="' + (tab === 'orders' ? 'on' : '') + '" data-s="orders">주문 내역<em>' + orders.length + '</em></button>';
    $('tabs').onclick = function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      tab = b.dataset.s;
      history.replaceState(null, '', '?tab=' + tab);
      renderTabs();
    };
    // 검색 줄은 판매완료·주문 내역에서만
    $('filter').hidden = !(tab === 'sold' || tab === 'orders');
    filter.setPlaceholder(tab === 'orders' ? '구매자·물건 이름·주문번호로 찾기' : '물건 이름으로 찾기');
    // 주문 내역: 구매자가 결제한 주문 (누가, 얼마, 어디로 보낼지)
    if (tab === 'orders') {
      // 정산 받을 계좌: 계좌번호는 뒤 4자리만 보여줌
      var acct = !accountReady ? '' : account
        ? '<div class="payacct"><div><b>정산 계좌</b><span>' + PS.esc(account.bank_name) + ' ****' + PS.esc(String(account.account_no).replace(/-/g, '').slice(-4)) + ' · ' + PS.esc(account.holder_name) + '</span></div>' +
          '<button type="button" class="btn white small" id="acctBtn">변경</button></div>'
        : '<div class="payacct need"><div><b>정산 받을 계좌를 등록해 주세요</b><span>계좌가 있어야 판매 대금을 받을 수 있어요</span></div>' +
          '<button type="button" class="btn small" id="acctBtn">등록</button></div>';
      if (!payable) acct = '<div class="payacct need"><div><b>안전결제로 팔고 싶다면</b><span>사업자 판매자는 신청하면 구매자가 바로 카드결제할 수 있어요. 사업자가 아니면 채팅으로 직접 거래해요</span></div>' +
        '<a class="btn small" href="/pay-seller">신청</a></div>' + (account ? acct : '');
      var shown = orders.filter(function (o) { return filter.test(PS.orderTexts(o, buyers, 'seller'), o.paid_at || o.created_at); });
      $('list').innerHTML = acct + (filter.active() && orders.length ? '<p class="lf-count">' + shown.length + '건</p>' : '') + (orders.length
        ? (shown.length ? shown.map(function (o) { return PS.orderCardHtml(o, 'seller', buyers); }).join('') : PS.FILTER_EMPTY)
        : '<div class="empty" style="padding:40px 0">' + PS.icon3d('sell', 80) + '아직 결제된 주문이 없어요</div>');
      return;
    }
    var rows = products.filter(function (p) { return inTab(p, tab); });
    var head = '';
    if (tab === 'sold' && rows.length) {
      // 판매완료: 판매일 최신순, 검색어·기간으로 거름
      var all = rows.length;
      var when = function (p) { return soldAt[p.id] || p.created_at; };
      rows = rows.filter(function (p) { return filter.test([p.title], when(p)); })
        .sort(function (a, b) { return new Date(when(b)) - new Date(when(a)); });
      if (!rows.length) { $('list').innerHTML = PS.FILTER_EMPTY; return; }
      if (filter.active()) head = '<p class="lf-count">' + rows.length + '건 / ' + all + '건</p>';
    }
    if (!rows.length) {
      var msg = { selling: '판매중인 물건이 없어요', sold: '아직 판매완료된 물건이 없어요' }[tab];
      $('list').innerHTML = '<div class="empty" style="padding:40px 0">' + PS.icon3d('sell', 80) + msg + '</div>';
      return;
    }
    $('list').innerHTML = head + rows.map(function (p) {
      // 사진·품명을 누르면 규격 수정하기 화면으로
      var html = PS.rowHtml(p).replace('href="' + PS.productUrl(p.id) + '"', 'href="/edit?id=' + encodeURIComponent(p.id) + '"');
      // 판매완료: 지역·등록 시각 대신 판매완료 날짜
      if (p.status === 'sold') html = html.replace(/<div class="m">[\s\S]*?<\/div>/, '<div class="m">' + (soldAt[p.id] ? '판매완료 ' + day(soldAt[p.id]) : '등록 ' + day(p.created_at)) + '</div>');
      return '<div class="row-wrap">' + html +
        '<div class="row-acts">' + (p.status === 'selling' ? '<button class="chg bump" data-bump="' + p.id + '">끌어올리기</button>' : '') +
        '<button class="chg" data-id="' + p.id + '">상태 바꾸기</button></div></div>';
    }).join('');
  }

  // 끌어올리기: 하루에 한 번, 물건 하나를 맨 위로
  $('list').addEventListener('click', async function (e) {
    var u = e.target.closest('[data-bump]');
    if (!u) return;
    e.preventDefault();
    u.disabled = true;
    var r = await sb.rpc('bump_product', { p_product_id: u.dataset.bump });
    u.disabled = false;
    PS.toast(r.data === 'ok' ? '맨 위로 끌어올렸어요!' : r.data === 'too_soon' ? '끌어올리기는 하루에 한 번만 할 수 있어요' : '끌어올리지 못했어요');
  });
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('.chg[data-id]');
    if (!b) return;
    e.preventDefault();
    targetId = b.dataset.id;
    $('statusSheet').classList.add('show');
    $('sheetBg').classList.add('show');
  });
  // 정산 계좌 등록·변경
  $('list').addEventListener('click', function (e) {
    if (!e.target.closest('#acctBtn')) return;
    PS.openPayoutAccount({ account: account, onSaved: function () { load(); } });
  });
  // 주문 내역의 발송함·주문 취소·취소 요청 동의/거절
  PS.bindOrderActions($('list'), 'seller', function (id) { return orders.filter(function (o) { return o.id === id; })[0]; }, load);
  function closeSheet() { $('statusSheet').classList.remove('show'); $('sheetBg').classList.remove('show'); }
  $('sheetBg').addEventListener('click', closeSheet);
  $('statusSheet').addEventListener('click', async function (e) {
    var opt = e.target.closest('.opt');
    if (!opt || !targetId) return;
    var s = opt.dataset.s;
    closeSheet();
    if (s === 'delete' && !confirm('정말 삭제할까요?')) return;
    var next = s === 'delete' ? 'deleted' : s;
    var res = await sb.from('products').update({ status: next }).eq('id', targetId);
    if (res.error) { PS.toast('바꾸지 못했어요'); return; }
    PS.toast(s === 'delete' ? '삭제했어요' : PS.STATUS[s] + '(으)로 바꿨어요');
    if (next !== 'deleted') tab = next;
    load();
  });
})();
</script>
</body>
</html>
