<style>
  @media (max-width:900px){ .admin-sidebar-toggle{display:flex !important;} }
  .inquiry-layout{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start;}
  .inquiry-layout > *{min-width:0;}
  @media (max-width:900px){ .inquiry-layout{grid-template-columns:1fr;} }
  .inquiry-buyer{display:flex;align-items:center;gap:10px;}
  .inquiry-buyer .avatar{width:32px;height:32px;border-radius:50%;background:var(--bg-soft);color:var(--text-tertiary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .inquiry-buyer .lbl{display:flex;flex-direction:column;line-height:1.35;}
  .inquiry-buyer .lbl b{font-size:.84rem;font-weight:700;}
  .inquiry-buyer .lbl span{font-size:.74rem;color:var(--text-tertiary);}
  .inquiry-detail .avatar-lg{width:44px;height:44px;border-radius:50%;background:var(--bg-soft);color:var(--text-tertiary);display:flex;align-items:center;justify-content:center;}
  .idetail-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;}
  .idetail-head .who{display:flex;align-items:center;gap:10px;}
  .idetail-head .who b{display:block;font-size:.92rem;font-weight:800;}
  .idetail-head .who span{font-size:.76rem;color:var(--text-tertiary);}
  .idetail-block{padding-block:16px;border-top:1px solid var(--border);}
  .idetail-block:first-of-type{border-top:none;padding-top:0;}
  .idetail-block-title{font-size:.78rem;font-weight:800;color:var(--text-tertiary);margin-bottom:10px;}
  .idetail-body{font-size:.86rem;color:var(--text);line-height:1.6;white-space:pre-wrap;}
  .answer-empty{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:12px 14px;font-size:.82rem;font-weight:700;}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-common.js"></script>
<script>
var QF = { userId: null, list: [], activeStatus: 'all', selectedId: null };
var TYPE_LABEL = { stock: '재고문의', price: '가격문의', product: '상품문의', shipping: '배송문의', settlement: '정산문의', tax: '세금문의', other: '기타문의' };
var personIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>';

function inqRowHtml(iq) {
  var buyerName = (iq.profiles && iq.profiles.name) ? iq.profiles.name : '구매자';
  var sel = iq.id === QF.selectedId ? ' style="background:var(--accent-soft);"' : '';
  return '<tr' + sel + ' onclick="selectInquiry(\'' + iq.id + '\')" style="cursor:pointer;">' +
    '<td><div class="inquiry-buyer"><span class="avatar">' + personIcon + '</span><div class="lbl"><b>' + AC.esc(buyerName) + '</b><span>' + AC.esc(iq.profiles ? iq.profiles.email || '' : '') + '</span></div></div></td>' +
    '<td style="max-width:280px;"><span class="cell-strong" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + AC.esc(iq.title || iq.content.slice(0, 30)) + '</span></td>' +
    '<td><span class="badge badge-warn" style="display:block;margin-bottom:6px;">' + (TYPE_LABEL[iq.inquiry_type] || iq.inquiry_type) + '</span><span class="badge ' + AC.badgeCls(iq.status) + '">' + AC.label(iq.status) + '</span></td>' +
    '<td class="num">' + AC.dt(iq.created_at, true) + '</td></tr>';
}

function renderInquiries() {
  var q = document.getElementById('inqSearchInput').value.trim().toLowerCase();
  var list = QF.list.filter(function (iq) {
    if (QF.activeStatus !== 'all' && iq.status !== QF.activeStatus) return false;
    if (q) {
      var hay = ((iq.title || '') + ' ' + iq.content + ' ' + (iq.profiles ? iq.profiles.name : '')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  document.getElementById('inqTbody').innerHTML = list.map(inqRowHtml).join('') ||
    '<tr><td colspan="4" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">문의가 없습니다.</td></tr>';
  document.getElementById('icnt-all').textContent = QF.list.length;
  document.getElementById('icnt-pending').textContent = QF.list.filter(function (i) { return i.status === 'pending'; }).length;
  document.getElementById('icnt-answered').textContent = QF.list.filter(function (i) { return i.status === 'answered'; }).length;
}

async function loadInquiries() {
  var res = await sb.from('inquiries').select('*, profiles:buyer_profile_id(name, phone, email)')
    .is('company_id', null).eq('thread_type', 'etc').order('created_at', { ascending: false });
  QF.list = res.data || [];
  renderInquiries();
  if (QF.selectedId) selectInquiry(QF.selectedId);
}

window.selectInquiry = async function (id) {
  QF.selectedId = id;
  renderInquiries();
  var iq = QF.list.find(function (x) { return x.id === id; });
  if (!iq) return;

  document.getElementById('inqEmptyState').style.display = 'none';
  document.getElementById('inqDetailBody').style.display = 'block';
  document.getElementById('id-buyer-name').textContent = iq.profiles ? iq.profiles.name : '구매자';
  document.getElementById('id-buyer-sub').textContent = iq.profiles ? (iq.profiles.email || iq.profiles.phone || '') : '';
  document.getElementById('id-type').textContent = TYPE_LABEL[iq.inquiry_type] || iq.inquiry_type;
  document.getElementById('id-date').textContent = '문의일 ' + AC.dt(iq.created_at, true);
  document.getElementById('id-content').textContent = iq.content;

  var msgRes = await sb.from('inquiry_messages').select('*').eq('inquiry_id', id).order('created_at');
  var msgs = msgRes.data || [];
  var msgHtml = msgs.map(function (m) {
    return '<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem;">' +
      '<b style="color:' + (m.sender_role === 'admin' ? 'var(--accent)' : 'var(--text)') + ';">' + (m.sender_role === 'admin' ? '관리자' : '구매자') + '</b> ' +
      '<span style="color:var(--text-tertiary);font-size:.72rem;">' + AC.dt(m.created_at, true) + '</span>' +
      '<p style="margin-top:4px;white-space:pre-wrap;">' + AC.esc(m.content) + '</p></div>';
  }).join('');
  document.getElementById('id-messages').innerHTML = msgHtml || '<div class="answer-empty">아직 답변이 등록되지 않았습니다.</div>';
};

document.getElementById('id-reply-submit').addEventListener('click', async function () {
  if (!QF.selectedId) return;
  var text = document.getElementById('id-reply-text').value.trim();
  if (!text) return;
  var res = await sb.from('inquiry_messages').insert({ inquiry_id: QF.selectedId, sender_id: QF.userId, sender_role: 'admin', content: text });
  if (res.error) { alert('답변 등록에 실패했습니다: ' + res.error.message); return; }
  await sb.from('inquiries').update({ status: 'answered' }).eq('id', QF.selectedId);
  document.getElementById('id-reply-text').value = '';
  await loadInquiries();
});

document.getElementById('inqTabs').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-status]');
  if (!btn) return;
  document.querySelectorAll('#inqTabs button').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  QF.activeStatus = btn.getAttribute('data-status');
  renderInquiries();
});
document.getElementById('inqSearchInput').addEventListener('input', renderInquiries);
document.getElementById('inqResetBtn').addEventListener('click', function () {
  document.getElementById('inqSearchInput').value = '';
  QF.activeStatus = 'all';
  document.querySelectorAll('#inqTabs button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-status') === 'all'); });
  renderInquiries();
});

AC.ready(async function (user) {
  document.querySelector('.admin-user .lbl b').textContent = (user.profile ? user.profile.name : user.email) || '관리자';
  document.querySelector('.admin-user .lbl span').textContent = user.email;
  document.querySelector('.admin-user .avatar').textContent = ((user.profile && user.profile.name) || user.email).charAt(0);
  QF.userId = user.id;
  await loadInquiries();
});
</script>
