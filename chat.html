<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<title>채팅 - 판다산다</title>
<link rel="icon" href="/이미지/web/logo.jpg">
<link rel="stylesheet" href="/app.css">
<style>
  /* 목록 */
  .chat-item{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);}
  .chat-item:active{background:var(--bg);}
  .chat-item .avatar{width:52px;height:52px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden;}
  .chat-item .avatar img{width:100%;height:100%;object-fit:cover;}
  .chat-item .mid{flex:1;min-width:0;}
  .chat-item .top{display:flex;gap:6px;align-items:baseline;}
  .chat-item .who{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-item .when{font-size:13px;color:var(--hint);flex-shrink:0;}
  .chat-item .prod{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-item .last{font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .chat-item .last.new{font-weight:700;}
  .chat-item .thumb{width:48px;height:48px;border-radius:8px;overflow:hidden;background:#F2F2F2;flex-shrink:0;}
  .chat-item .thumb img{width:100%;height:100%;object-fit:cover;}
  .unread{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--primary);color:var(--text);font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}

  /* 채팅방 */
  .app.no-tabbar:has(.room){padding-bottom:0;}
  .room{display:flex;flex-direction:column;height:calc(100vh - var(--tabbar-h) - env(safe-area-inset-bottom));height:calc(100dvh - var(--tabbar-h) - env(safe-area-inset-bottom));}
  .room .topbar{flex-shrink:0;}
  .prod-strip{flex-shrink:0;display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);}
  .prod-strip .thumb{width:48px;height:48px;border-radius:8px;overflow:hidden;background:#F2F2F2;flex-shrink:0;}
  .prod-strip .thumb img{width:100%;height:100%;object-fit:cover;}
  .prod-strip .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prod-strip .p{font-size:16px;font-weight:800;}
  .msgs{flex:1;overflow-y:auto;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:6px;}
  .day{align-self:center;font-size:12px;color:var(--hint);background:#EFEFEF;padding:4px 12px;border-radius:12px;margin:10px 0;}
  .msg{display:flex;align-items:flex-end;gap:6px;max-width:100%;}
  .msg.me{flex-direction:row-reverse;}
  .bubble{max-width:75%;padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.45;white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px;}
  .msg.me .bubble{background:var(--primary);border-color:var(--primary);border-top-left-radius:18px;border-top-right-radius:4px;}
  .side{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--hint);flex-shrink:0;line-height:1.3;}
  .msg:not(.me) .side{align-items:flex-start;}
  .side .r1{color:var(--primary-press);font-weight:800;font-size:12px;}
  .side .rd{color:var(--success);font-weight:700;}
  .composer{flex-shrink:0;display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface);}
  .composer textarea{flex:1;min-height:48px;max-height:120px;padding:12px 16px;border-radius:24px;border:1.5px solid var(--line);resize:none;font-size:16px;line-height:1.4;}
  .composer textarea:focus{outline:none;border-color:var(--primary);}
  .composer button{width:48px;height:48px;border-radius:50%;background:var(--primary);font-size:20px;flex-shrink:0;}
  .composer button:disabled{background:#E5E5E5;}
  .quick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;background:var(--surface);scrollbar-width:none;flex-shrink:0;}
  .quick::-webkit-scrollbar{display:none;}
  .quick button{flex-shrink:0;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);font-size:14px;color:var(--sub);}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var chatId = PS.idFromUrl('chat');

  PS.ready.then(function (user) {
    if (!user) return PS.goLogin();
    if (chatId) openRoom(chatId);
    else openList();
  });

  function timeLabel(iso) {
    var d = new Date(iso);
    var h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
    return (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + ':' + m;
  }

  // ---------- 채팅 목록 ----------
  async function openList() {
    PS.renderTabbar('chat');
    app.innerHTML = '<header class="topbar"><h1>채팅</h1></header><div id="list"><div class="skeleton" style="height:64px;margin:16px"></div><div class="skeleton" style="height:64px;margin:16px"></div></div>';
    var me = PS.user.id;
    var listCols = 'id,buyer_id,seller_id,last_message,last_message_at,created_at,products(id,title,status,product_images(url,sort_order))';
    var listQuery = function (cols) {
      return sb.from('chats').select(cols).or('buyer_id.eq.' + me + ',seller_id.eq.' + me).order('last_message_at', { ascending: false, nullsFirst: false });
    };
    var res = await listQuery(listCols + ',business_id,businesses(id,name,tagline,business_images(url,sort_order))');
    if (res.error) res = await listQuery(listCols); // 업체 채팅 컬럼이 아직 없을 때
    var chats = (res.data || []).filter(function (c) { return c.last_message || c.buyer_id === me; });
    var list = document.getElementById('list');
    if (!chats.length) {
      list.innerHTML = '<div class="empty">' + PS.icon3d('chat', 96) + '<b>아직 채팅이 없어요</b>마음에 드는 물건에서 채팅하기를 눌러 보세요<div style="margin-top:20px"><a class="btn" href="/buy">물건 보러 가기</a></div></div>';
      return;
    }
    var others = chats.map(function (c) { return c.buyer_id === me ? c.seller_id : c.buyer_id; });
    var names = await PS.publicProfiles(others);
    var unreadRes = await sb.from('messages').select('chat_id').in('chat_id', chats.map(function (c) { return c.id; }))
      .is('read_at', null).neq('sender_id', me);
    var unread = {};
    (unreadRes.data || []).forEach(function (m) { unread[m.chat_id] = (unread[m.chat_id] || 0) + 1; });

    list.innerHTML = chats.map(function (c) {
      var otherId = c.buyer_id === me ? c.seller_id : c.buyer_id;
      var o = names[otherId] || {};
      var p = c.businesses ? { title: '🏢 ' + c.businesses.name, product_images: c.businesses.business_images } : (c.products || {});
      var img = PS.firstImage(p);
      var n = unread[c.id] || 0;
      return '<a class="chat-item" href="/chat/' + c.id + '">' +
        '<div class="avatar">' + PS.avatarHtml(o.avatar_url) + '</div>' +
        '<div class="mid">' +
          '<div class="top"><span class="who">' + PS.esc(o.name || '이웃') + '</span><span class="when">' + (c.last_message_at ? PS.ago(c.last_message_at) : '') + '</span></div>' +
          '<div class="prod">' + PS.esc(p.title || '삭제된 물건') + '</div>' +
          '<div class="last' + (n ? ' new' : '') + '">' + PS.esc(c.last_message || '대화를 시작해 보세요') + '</div>' +
        '</div>' +
        (n ? '<span class="unread">' + n + '</span>' : '') +
        '<div class="thumb">' + (img ? '<img src="' + PS.esc(img) + '" alt="">' : '') + '</div>' +
        '</a>';
    }).join('');
  }

  // ---------- 채팅방 ----------
  var messages = [];

  async function openRoom(id) {
    app.classList.add('no-tabbar');
    app.style.paddingBottom = '0';
    app.innerHTML = '<div class="room">' +
      '<header class="topbar"><a class="back" href="/chat" aria-label="채팅 목록">' + PS.icon('back', 24) + '</a><h1><a id="otherName" href="#">채팅</a></h1></header>' +
      '<a class="prod-strip" id="strip" href="#"></a>' +
      '<div class="msgs" id="msgs"></div>' +
      '<div class="quick" id="quick"></div>' +
      '<form class="composer" id="composer"><textarea id="text" rows="1" placeholder="메시지 보내기" aria-label="메시지"></textarea><button type="submit" id="send" aria-label="보내기" disabled>' + PS.icon('send', 22) + '</button></form>' +
      '</div>';
    document.querySelector('.room .back').style.fontSize = '28px';

    var me = PS.user.id;
    var roomCols = 'id,buyer_id,seller_id,products(id,title,price,status,product_images(url,sort_order))';
    var res = await sb.from('chats').select(roomCols + ',business_id,businesses(id,name,tagline,business_images(url,sort_order))').eq('id', id).maybeSingle();
    if (res.error) res = await sb.from('chats').select(roomCols).eq('id', id).maybeSingle();
    if (!res.data) {
      document.getElementById('msgs').innerHTML = '<div class="empty">' + PS.sticker('sorry', 120) + '<b>채팅방을 찾을 수 없어요</b></div>';
      document.getElementById('composer').hidden = true;
      return;
    }
    var chat = res.data;
    var otherId = chat.buyer_id === me ? chat.seller_id : chat.buyer_id;
    var names = await PS.publicProfiles([otherId]);
    document.getElementById('otherName').textContent = ((names[otherId] && names[otherId].name) || '이웃') + ' ›';
    document.getElementById('otherName').href = PS.profileUrl(otherId);

    var strip = document.getElementById('strip');
    var bz = chat.businesses;
    if (bz) {
      var bimg = PS.firstImage({ product_images: bz.business_images });
      strip.href = PS.bizUrl(bz.id);
      strip.innerHTML = '<div class="thumb">' + (bimg ? '<img src="' + PS.esc(bimg) + '" alt="">' : '') + '</div>' +
        '<div style="min-width:0"><div class="t"><span class="verified" style="margin-right:6px">업체</span>' + PS.esc(bz.name) + '</div><div class="p" style="font-size:14px;font-weight:600;color:var(--sub)">' + PS.esc(bz.tagline) + '</div></div>';
    } else {
      var p = chat.products || {};
      var img = PS.firstImage(p);
      strip.href = p.id ? PS.productUrl(p.id) : '#';
      strip.innerHTML = '<div class="thumb">' + (img ? '<img src="' + PS.esc(img) + '" alt="">' : '') + '</div>' +
        '<div style="min-width:0"><div class="t">' + (p.status === 'reserved' ? '<span class="badge reserved">예약중</span>' : p.status === 'sold' ? '<span class="badge sold">판매완료</span>' : '') +
        PS.esc(p.title || '삭제된 물건') + '</div><div class="p">' + (p.title ? PS.won(p.price) : '') + '</div></div>';
    }

    var quick = bz
      ? (chat.buyer_id === me
          ? ['안녕하세요! 문의드려요', '견적 받을 수 있을까요?', '방문 가능한 날짜가 언제인가요?', '위치가 어디인가요?']
          : ['네, 말씀하세요!', '견적 보내드릴게요', '언제 방문하시면 될까요?'])
      : chat.buyer_id === me
      ? ['안녕하세요! 아직 판매하시나요?', '가격 조금 깎아주실 수 있나요?', '직접 보러 가도 될까요?', '어디서 거래할까요?']
      : ['네, 판매중이에요!', '직접 보러 오셔도 돼요', '죄송해요, 예약됐어요'];
    document.getElementById('quick').innerHTML = quick.map(function (q) { return '<button type="button">' + PS.esc(q) + '</button>'; }).join('');
    document.getElementById('quick').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (b) send(b.textContent);
    });

    var msgRes = await sb.from('messages').select('id,sender_id,message,read_at,created_at').eq('chat_id', id).order('created_at', { ascending: true }).limit(500);
    messages = msgRes.data || [];
    renderMessages(true);
    PS.fire(sb.rpc('mark_chat_read', { p_chat_id: id }));

    sb.channel('chat-' + id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'chat_id=eq.' + id }, function (payload) {
        var m = payload.new;
        if (messages.some(function (x) { return x.id === m.id; })) return;
        messages.push(m);
        renderMessages(true);
        if (m.sender_id !== me && document.visibilityState === 'visible') PS.fire(sb.rpc('mark_chat_read', { p_chat_id: id }));
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: 'chat_id=eq.' + id }, function (payload) {
        var m = payload.new;
        messages.forEach(function (x) { if (x.id === m.id) x.read_at = m.read_at; });
        renderMessages(false);
      })
      .subscribe();

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') PS.fire(sb.rpc('mark_chat_read', { p_chat_id: id }));
    });

    var ta = document.getElementById('text');
    var sendBtn = document.getElementById('send');
    ta.addEventListener('input', function () {
      sendBtn.disabled = !ta.value.trim();
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
    });
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(pointer:fine)').matches) {
        e.preventDefault();
        document.getElementById('composer').requestSubmit();
      }
    });
    document.getElementById('composer').addEventListener('submit', function (e) {
      e.preventDefault();
      send(ta.value);
      ta.value = '';
      ta.style.height = 'auto';
      sendBtn.disabled = true;
      ta.focus();
    });

    async function send(text) {
      text = (text || '').trim();
      if (!text) return;
      var ins = await sb.from('messages').insert({ chat_id: id, sender_id: me, message: text.slice(0, 2000) })
        .select('id,sender_id,message,read_at,created_at').single();
      if (ins.error) { PS.toast('보내지 못했어요. 다시 해 주세요'); return; }
      if (!messages.some(function (x) { return x.id === ins.data.id; })) messages.push(ins.data);
      renderMessages(true);
    }
  }

  function renderMessages(scroll) {
    var me = PS.user.id;
    var box = document.getElementById('msgs');
    if (!messages.length) {
      box.innerHTML = '<div class="empty" style="padding:40px 0">' + PS.sticker('hello', 120) + '<b>먼저 인사해 보세요</b>아래 버튼을 눌러도 돼요</div>';
      return;
    }
    var lastReadMine = -1;
    messages.forEach(function (m, i) { if (m.sender_id === me && m.read_at) lastReadMine = i; });
    var html = '';
    var lastDay = '';
    messages.forEach(function (m, i) {
      var d = new Date(m.created_at);
      var day = d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
      if (day !== lastDay) { html += '<div class="day">' + day + '</div>'; lastDay = day; }
      var mine = m.sender_id === me;
      var status = '';
      if (mine) status = m.read_at ? (i === lastReadMine ? '<span class="rd">읽음</span>' : '') : '<span class="r1" title="안 읽음">1</span>';
      html += '<div class="msg' + (mine ? ' me' : '') + '"><div class="bubble">' + PS.esc(m.message) + '</div>' +
        '<div class="side">' + status + '<span>' + timeLabel(m.created_at) + '</span></div></div>';
    });
    var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    box.innerHTML = html;
    if (scroll || nearBottom) box.scrollTop = box.scrollHeight;
  }
})();
</script>
</body>
</html>
