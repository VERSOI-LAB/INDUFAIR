# 판다산다 안드로이드 앱 빌드 (android/ 폴더가 바뀌면 자동, 또는 Actions 탭에서 "Run workflow")
#   결과물은 실행 화면 아래 Artifacts 에서 받기:
#     pandasanda-apk : 휴대폰에 바로 설치해 보는 파일
#     pandasanda-aab : 플레이 콘솔에 올리는 파일 (서명 키가 있을 때만)
#   서명 키(Settings > Secrets and variables > Actions):
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   키가 없으면 테스트용(디버그) APK 만 만듦. 이 APK 는 주소창이 보일 수 있음 (사이트와 서명이 안 맞아서)
name: android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 안드로이드 SDK 는 GitHub 빌드 서버에 이미 깔려 있음 (ANDROID_HOME). 필요한 버전은 Gradle 이 받음
      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 준비
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: 빌드 (서명)
        if: env.HAS_KEY == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/pandasanda-${VERSION_CODE}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/pandasanda-${VERSION_CODE}.aab"

      - name: 빌드 (테스트용, 서명 키 없음)
        if: env.HAS_KEY != 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/pandasanda-${VERSION_CODE}-test.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pandasanda-apk
          path: android/out/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: pandasanda-aab
          path: android/out/*.aab
          retention-days: 30
