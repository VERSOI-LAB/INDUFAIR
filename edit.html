<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>물건 고치기 - 판다산다</title>
<link rel="icon" href="/이미지/web/logo.jpg">
<link rel="stylesheet" href="/app.css">
<style>
  .app,.app.no-tabbar{padding-bottom:calc(var(--tabbar-h) + 104px + env(safe-area-inset-bottom));}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
  .photos .ph{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#F2F2F2;}
  .photos .ph img{width:100%;height:100%;object-fit:contain;background:#fff;}
  .photos .ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:28px;text-align:center;}
  .photos .ph .first{position:absolute;left:4px;bottom:4px;background:var(--text);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;}
  .photos .ph .lead{position:absolute;left:4px;bottom:4px;background:rgba(255,255,255,.9);border:1px solid var(--line);font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;}
  .photos .add{aspect-ratio:1/1;border-radius:12px;border:2px dashed #DDD;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);font-size:13px;font-weight:600;gap:2px;}
  .photos .add b{font-size:26px;line-height:1;}
  .hint{font-size:13px;color:var(--hint);margin-top:6px;}
  .price-row{display:flex;align-items:center;gap:8px;}
  .price-row .input{flex:1;}
  .price-row span{font-weight:700;}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:16px;}
  .chk input{width:20px;height:20px;accent-color:var(--primary);}
  .footer{position:fixed;left:0;right:0;bottom:0;max-width:var(--app-w);margin:0 auto;z-index:30;background:var(--surface);
    padding:12px 16px;display:flex;gap:8px;border-top:1px solid var(--line);}
  .footer .btn.white{flex:0 0 33%;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="back" id="backBtn" aria-label="뒤로"><i data-icon="back" data-size="24"></i></button>
    <h1>물건 고치기</h1>
  </header>
  <main class="page" id="main"><div class="skeleton" style="height:200px;border-radius:16px"></div></main>
</div>
<div class="footer over-tabbar" id="footer" hidden>
  <a class="btn white" id="viewBtn" href="#">미리보기</a>
  <button class="btn" id="saveBtn">저장하기</button>
</div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var id = PS.param('id');
  var MAX = 10;
  var product = null;
  var photos = [];        // { url, imgId } 기존 사진 / { blob, preview } 새 사진
  var removed = [];       // 지운 기존 사진
  var form = {};

  $('backBtn').addEventListener('click', function () {
    if (history.length > 1 && document.referrer.indexOf(location.host) !== -1) history.back();
    else location.href = '/sales';
  });

  PS.ready.then(async function (user) {
    if (!user) return PS.goLogin();
    var r = await sb.from('products')
      .select('id,title,price,description,condition,usage_period,category_id,status,seller_profile_id,product_images(id,url,sort_order)')
      .eq('id', id).maybeSingle();
    product = r.data;
    if (!product || product.status === 'deleted') return fail('물건을 찾을 수 없어요');
    if (product.seller_profile_id !== user.id) return fail('내가 올린 물건만 고칠 수 있어요');
    var cats = await sb.from('categories').select('id,name').is('parent_id', null);
    form.cats = cats.data || [];
    var t = PS.splitTitle(product.title);
    form.name = t.name; form.spec = t.spec;
    form.price = product.price || 0;
    form.desc = product.description || '';
    form.usage = product.usage_period || '';
    form.condition = product.condition || '';
    form.category = product.category_id || null;
    photos = (product.product_images || []).slice().sort(function (a, b) { return a.sort_order - b.sort_order; })
      .map(function (im) { return { url: im.url, imgId: im.id }; });
    render();
    $('footer').hidden = false;
    $('viewBtn').href = PS.productUrl(id);
  });

  function fail(msg) {
    $('main').innerHTML = '<div class="empty">' + PS.sticker('sorry', 120) + '<b>' + PS.esc(msg) + '</b><div style="margin-top:20px"><a class="btn" href="/sales">판매관리로</a></div></div>';
  }

  function chips(map, key) {
    return Object.keys(map).map(function (k) {
      return '<button type="button" class="chip' + (String(form[key]) === String(k) ? ' on' : '') + '" data-key="' + key + '" data-v="' + PS.esc(k) + '">' + PS.esc(map[k]) + '</button>';
    }).join('');
  }

  function render() {
    var catMap = {};
    form.cats.forEach(function (c) { catMap[c.id] = c.name; });
    $('main').innerHTML =
      '<div class="field" style="margin-top:8px"><span>사진 <small style="color:var(--hint);font-weight:500">(' + photos.length + '/' + MAX + ', 첫 사진이 대표)</small></span>' +
        '<div class="photos" id="photos"></div><p class="hint">사진을 누르면 대표 사진으로 바꿀 수 있어요</p></div>' +
      '<label class="field"><span>품명</span><input class="input" id="fName" maxlength="80" placeholder="예) 직압식 샌딩건 P1 SET" value="' + PS.esc(form.name) + '"></label>' +
      '<label class="field"><span>규격 <small style="color:var(--hint);font-weight:500">(안 써도 돼요)</small></span><input class="input" id="fSpec" maxlength="80" placeholder="예) Φ6.3/Φ7.9/Φ9.5" value="' + PS.esc(form.spec) + '"></label>' +
      '<div class="field"><span>가격</span>' +
        '<div class="price-row"><input class="input" id="fPrice" inputmode="numeric" placeholder="숫자만 써 주세요" value="' + (form.price ? form.price.toLocaleString('ko-KR') : '') + '"' + (form.price ? '' : ' disabled') + '><span>원</span></div>' +
        '<p class="hint" id="priceHint"></p>' +
        '<label class="chk"><input type="checkbox" id="fNego"' + (form.price ? '' : ' checked') + '> 가격 협의 (가격을 정하지 않고 문의 받기)</label></div>' +
      '<label class="field"><span>설명</span><textarea class="textarea" id="fDesc" maxlength="3000" placeholder="물건 설명, 사양, 규격을 자유롭게 써 주세요">' + PS.esc(form.desc) + '</textarea></label>' +
      '<div class="field"><span>분류</span><div class="chip-grid">' + chips(catMap, 'category') + '</div></div>' +
      '<div class="field"><span>얼마나 썼나요?</span><div class="chip-grid">' + chips(PS.USAGE, 'usage') + '</div></div>' +
      '<div class="field"><span>상태는 어때요?</span><div class="chip-grid">' + chips(PS.CONDITIONS, 'condition') + '</div></div>';
    renderPhotos();
    priceHint();
    $('fPrice').addEventListener('input', function (e) {
      var n = Number(e.target.value.replace(/[^0-9]/g, '').slice(0, 11)) || 0;
      e.target.value = n ? n.toLocaleString('ko-KR') : '';
      form.price = n; priceHint();
    });
    $('fNego').addEventListener('change', function (e) {
      $('fPrice').disabled = e.target.checked;
      if (e.target.checked) { form.price = 0; $('fPrice').value = ''; }
      else $('fPrice').focus();
      priceHint();
    });
    $('main').querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () {
        syncText();
        var k = b.dataset.key, v = b.dataset.v;
        if (k === 'category') form.category = Number(v);
        else form[k] = form[k] === v ? '' : v; // 한 번 더 누르면 해제
        render();
      });
    });
  }

  function priceHint() {
    var el = $('priceHint');
    if (el) el.textContent = $('fNego') && $('fNego').checked ? '화면에 "가격 협의"로 보이고, 구매하기 대신 문의를 받아요' : form.price ? '화면에는 ' + PS.won(form.price) + '으로 보여요' : '';
  }

  function syncText() {
    if (!$('fName')) return;
    form.name = $('fName').value; form.spec = $('fSpec').value; form.desc = $('fDesc').value;
  }

  function renderPhotos() {
    var box = $('photos');
    box.innerHTML = photos.map(function (p, i) {
      return '<div class="ph" data-i="' + i + '"><img src="' + PS.esc(p.preview || p.url) + '" alt="사진 ' + (i + 1) + '">' +
        (i === 0 ? '<span class="first">대표</span>' : '') +
        '<button type="button" class="x" data-x="' + i + '" aria-label="사진 빼기">×</button></div>';
    }).join('') + (photos.length < MAX ? '<button type="button" class="add" id="addPh"><b>+</b>사진 추가</button>' : '');
    box.querySelectorAll('.ph').forEach(function (el) {
      el.addEventListener('click', function (e) {
        var i = Number(el.dataset.i);
        if (e.target.dataset.x !== undefined) {
          var p = photos.splice(i, 1)[0];
          if (p.imgId) removed.push(p);
        } else if (i > 0) {
          photos.unshift(photos.splice(i, 1)[0]);
          PS.toast('대표 사진으로 바꿨어요');
        }
        syncText(); render();
      });
    });
    var add = $('addPh');
    if (add) add.addEventListener('click', function () { $('fileInput').click(); });
  }

  $('fileInput').addEventListener('change', async function (e) {
    var files = Array.prototype.slice.call(e.target.files || [], 0, MAX - photos.length);
    e.target.value = '';
    syncText();
    for (var i = 0; i < files.length; i++) {
      try {
        var blob = await resize(files[i], 1600, 0.85);
        photos.push({ blob: blob, preview: URL.createObjectURL(blob) });
      } catch (err) { PS.toast('사진을 읽지 못했어요'); }
    }
    render();
  });

  function resize(file, max, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('toBlob failed')); }, 'image/jpeg', quality);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('read')); };
      img.src = url;
    });
  }

  // 업로드한 사진이면 저장소 경로, 사이트에 들어 있는 사진(/img/...)이면 null
  function storagePath(url) {
    var m = String(url || '').match(/\/storage\/v1\/object\/public\/product-images\/(.+)$/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  $('saveBtn').addEventListener('click', async function () {
    syncText();
    var name = form.name.trim(), spec = form.spec.trim().replace(/[()]/g, '');
    if (!name) return PS.toast('품명을 써 주세요');
    if (!photos.length) return PS.toast('사진을 1장 이상 넣어 주세요');
    var nego = $('fNego').checked;
    if (!nego && !form.price) return PS.toast('가격을 쓰거나 "가격 협의"를 눌러 주세요');
    var btn = $('saveBtn');
    btn.disabled = true; btn.textContent = '저장하는 중…';
    try {
      // 1) 새 사진 올리기
      for (var i = 0; i < photos.length; i++) {
        var p = photos[i];
        if (!p.blob) continue;
        var path = PS.user.id + '/' + id + '/' + Date.now() + '-' + i + '.jpg';
        var up = await sb.storage.from('product-images').upload(path, p.blob, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        p.url = sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;
        var ins = await sb.from('product_images').insert({ product_id: id, url: p.url, sort_order: 100 + i }).select('id').single();
        if (ins.error) throw ins.error;
        p.imgId = ins.data.id; delete p.blob;
      }
      // 2) 뺀 사진 지우기
      if (removed.length) {
        var del = await sb.from('product_images').delete().in('id', removed.map(function (r) { return r.imgId; }));
        if (del.error) throw del.error;
        var paths = removed.map(function (r) { return storagePath(r.url); }).filter(Boolean);
        if (paths.length) PS.fire(sb.storage.from('product-images').remove(paths));
        removed = [];
      }
      // 3) 사진 순서
      for (var j = 0; j < photos.length; j++) {
        var o = await sb.from('product_images').update({ sort_order: j }).eq('id', photos[j].imgId);
        if (o.error) throw o.error;
      }
      // 4) 내용·가격
      var r = await sb.from('products').update({
        title: (spec ? name + ' (' + spec + ')' : name).slice(0, 100),
        price: nego ? 0 : form.price,
        description: form.desc.trim(),
        category_id: form.category || null,
        usage_period: form.usage || null,
        condition: form.condition || null
      }).eq('id', id);
      if (r.error) throw r.error;
      PS.toast('저장했어요!');
      setTimeout(function () { location.href = '/sales'; }, 600);
    } catch (err) {
      console.error(err);
      PS.toast('저장하지 못했어요. 다시 눌러 주세요');
      btn.disabled = false; btn.textContent = '저장하기';
    }
  });
})();
</script>
</body>
</html>
