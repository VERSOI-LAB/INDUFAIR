<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>안전결제 판매자 신청 - 판다산다</title>
<link rel="icon" href="/이미지/web/logo.jpg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/이미지/app/icon-180.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="/app.css">
<style>
  .steps{display:grid;gap:10px;margin-top:20px;}
  .step{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;}
  .step .n{flex:0 0 28px;height:28px;border-radius:50%;background:#F2F3F5;color:var(--sub);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .step.ok .n{background:var(--primary);color:#fff;}
  .step div{flex:1;min-width:0;}
  .step b{display:block;font-size:16px;}
  .step span{font-size:14px;color:var(--sub);}
  .step a.btn{flex:0 0 auto;}
  .info{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--primary-light);font-size:14px;line-height:1.6;}
  .err{margin-top:14px;padding:12px 14px;border-radius:12px;background:#FFF0EF;color:var(--danger);font-size:15px;font-weight:600;}
  .chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:15px;line-height:1.5;}
  .chk input{margin-top:4px;width:18px;height:18px;}
  .certbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-top:14px;min-height:140px;border:2px dashed #C9D6EE;border-radius:20px;background:#F5F8FE;cursor:pointer;text-align:center;overflow:hidden;position:relative;}
  .certbox b{font-size:17px;}
  .certbox span{font-size:14px;color:var(--sub);}
  .certbox.has{border-style:solid;padding:0;}
  .certbox img{width:100%;max-height:240px;object-fit:contain;background:#fff;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" href="/sales?tab=orders" aria-label="판매내역으로 돌아가기"><i data-icon="back" data-size="24"></i></a>
    <h1>안전결제 판매자 신청</h1>
  </header>
  <main class="page" id="main">
    <div class="skeleton" style="height:160px;margin-top:24px"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  PS.renderTabbar('my');
  var $ = function (id) { return document.getElementById(id); };
  var main = $('main');
  var certBlob = null;

  PS.ready.then(async function (user) {
    if (!user) return PS.goLogin();
    render();
  });

  async function render() {
    var r = await sb.from('business_verifications')
      .select('company_name,biz_reg_no,nts_status,mail_order_no,mail_order_exempt,pay_status,pay_reject_reason').eq('profile_id', PS.user.id).maybeSingle();
    var v = r.error ? null : r.data;
    var acct = await sb.from('seller_payout_accounts').select('bank_name').eq('profile_id', PS.user.id).maybeSingle();
    var hasAcct = !!(acct.data);
    var bizOk = !!v && v.nts_status === 'active';
    var status = v ? v.pay_status || 'none' : 'none';

    var head =
      '<h2 style="font-size:23px;font-weight:800;margin-top:20px">카드결제로 팔고, 대금은 정산받기</h2>' +
      '<p style="color:var(--sub);margin-top:6px;line-height:1.6">구매자가 판다산다에서 바로 결제하고, 물건을 받으면 판매 대금이 정산 계좌로 들어와요. ' +
      '결제대행사 정책에 따라 <b>사업자등록을 한 판매자(개인사업자·법인)</b>만 쓸 수 있어요. 사업자가 아니면 지금처럼 채팅으로 직접 거래하면 돼요.</p>';

    var steps = '<div class="steps">' +
      step(bizOk, 1, '사업자 인증', v ? PS.esc(v.company_name) + ' · ' + (bizOk ? '국세청 확인 완료' : '국세청 확인 중이거나 휴·폐업 상태') : '사업자등록증으로 인증해요',
        v ? '' : '<a class="btn small" href="/biz/verify?next=/pay-seller">인증하기</a>') +
      step(status === 'approved' || status === 'requested', 2, '통신판매업 신고 확인', status === 'approved' ? '확인 완료' : status === 'requested' ? '운영팀이 확인하고 있어요 (영업일 1~2일)' : '신고번호를 알려 주세요', '') +
      step(hasAcct, 3, '정산 계좌 등록', hasAcct ? '등록 완료' : '판매내역 › 주문 내역에서 등록해요', hasAcct ? '' : '<a class="btn small white" href="/sales?tab=orders">등록</a>') +
      '</div>';

    if (status === 'approved') {
      main.innerHTML = head + steps + '<div class="info"><b>안전결제 판매자로 승인됐어요!</b><br>이제 내 물건에 구매하기 버튼이 보이고, 구매자가 바로 결제할 수 있어요.' +
        (hasAcct ? '' : '<br>정산 계좌를 등록해야 판매 대금을 받을 수 있어요.') + '</div>';
      return;
    }
    if (status === 'requested') {
      main.innerHTML = head + steps + '<div class="info">신청을 받았어요. 확인이 끝나면 내 물건에 구매하기 버튼이 열려요.</div>';
      return;
    }
    if (!bizOk) { main.innerHTML = head + steps; return; }

    main.innerHTML = head + steps +
      (status === 'rejected' ? '<div class="err">지난 신청이 반려됐어요' + (v.pay_reject_reason ? ': ' + PS.esc(v.pay_reject_reason) : '') + '. 내용을 고쳐서 다시 신청해 주세요.</div>' : '') +
      '<form id="form" novalidate style="margin-top:20px">' +
        '<label class="field"><span>통신판매업 신고번호</span><input class="input" id="mno" maxlength="40" autocomplete="off" placeholder="예) 제2026-경기성남-0000호" value="' + PS.esc(v.mail_order_no || '') + '"></label>' +
        '<label class="certbox" id="certBox" for="certInput">' + PS.icon3d('camera', 44) + '<b>신고증 사진 올리기</b><span>있으면 더 빨리 확인돼요 (선택)</span></label>' +
        '<input type="file" id="certInput" accept="image/*" hidden>' +
        '<label class="chk"><input type="checkbox" id="exempt"' + (v.mail_order_exempt ? ' checked' : '') + '><span>신고 면제 대상이에요 (간이과세자 등). 운영팀이 사업자 정보를 보고 확인해요.</span></label>' +
        '<div class="err" id="err" hidden></div>' +
        '<button class="btn" id="submit" type="submit" style="margin:24px 0">신청하기</button>' +
      '</form>';
    $('exempt').addEventListener('change', function () { $('mno').disabled = this.checked; });
    $('mno').disabled = $('exempt').checked;
    $('certInput').addEventListener('change', function () {
      var f = this.files[0];
      this.value = '';
      if (!f) return;
      if (f.size > 10 * 1024 * 1024) { PS.toast('10MB 이하 사진만 올릴 수 있어요'); return; }
      certBlob = f;
      $('certBox').innerHTML = '<img src="' + URL.createObjectURL(f) + '" alt="통신판매업 신고증">';
      $('certBox').classList.add('has');
    });
    $('form').addEventListener('submit', submit);
  }

  function step(ok, n, title, sub, action) {
    return '<div class="step' + (ok ? ' ok' : '') + '"><span class="n">' + (ok ? '✓' : n) + '</span><div><b>' + title + '</b><span>' + sub + '</span></div>' + action + '</div>';
  }

  async function submit(e) {
    e.preventDefault();
    var err = $('err');
    err.hidden = true;
    var exempt = $('exempt').checked;
    var no = $('mno').value.trim();
    if (!exempt && !no) { err.textContent = '통신판매업 신고번호를 써 주세요'; err.hidden = false; return; }
    var btn = $('submit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>신청하는 중…';
    var path = null;
    if (certBlob) {
      path = PS.user.id + '/mail-order-' + Date.now() + '.' + ((certBlob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg'));
      var up = await sb.storage.from('biz-docs').upload(path, certBlob, { contentType: certBlob.type || 'image/jpeg' });
      if (up.error) path = null;
    }
    var r = await sb.rpc('request_pay_seller', { p_mail_order_no: exempt ? null : no, p_exempt: exempt, p_cert_path: path });
    btn.disabled = false;
    btn.textContent = '신청하기';
    var code = r.error ? 'error' : r.data;
    if (code === 'ok' || code === 'already_approved') { PS.toast('신청했어요'); return render(); }
    var msg = {
      login_required: '다시 로그인해 주세요',
      not_verified: '사업자 인증을 먼저 해 주세요',
      nts_not_active: '국세청에서 계속사업자로 확인된 뒤 신청할 수 있어요',
      mail_order_required: '통신판매업 신고번호를 써 주세요'
    }[code] || '신청하지 못했어요. 잠시 후 다시 해 주세요';
    err.textContent = msg;
    err.hidden = false;
  }
})();
</script>
</body>
</html>
