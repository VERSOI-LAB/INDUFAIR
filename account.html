<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERSOI 회원/계정</title>
<meta name="description" content="회원 정보와 알림, 보안 설정을 관리하는 VERSOI 회원/계정">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .board-tabs{display:flex;gap:18px;border-bottom:1px solid var(--border);margin-top:20px;overflow-x:auto;}
  .board-tabs button{padding:4px 2px 12px;font-size:.9rem;font-weight:700;color:var(--text-tertiary);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s ease;white-space:nowrap;}
  .board-tabs button.active{color:var(--text);border-bottom-color:var(--accent);}

  .info-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);box-shadow:var(--shadow-1);padding:22px 24px;margin-top:16px;}
  .info-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap;}
  .info-row:last-child{border-bottom:none;}
  .info-row .lbl{font-size:.84rem;font-weight:700;color:var(--text-tertiary);width:110px;flex-shrink:0;}
  .info-row .val{flex:1;font-size:.9rem;color:var(--text);font-family:var(--font-en);min-width:0;}
  .info-row .val.kr{font-family:var(--font-kr);}
  .grade-pill{font-size:.72rem;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:20px;}

  .settings-title{font-size:1.02rem;font-weight:800;margin:24px 0 4px;}
  .form-actions-simple{display:flex;align-items:center;justify-content:space-between;margin-top:20px;}
  .link-danger{font-size:.84rem;color:var(--text-tertiary);text-decoration:underline;}
  .link-danger:hover{color:var(--up);}

  .field-wrap{display:flex;align-items:center;gap:12px;flex:1;min-width:0;flex-wrap:wrap;}
  .edit-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;}
  .edit-form input{border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:.86rem;font-family:inherit;color:var(--text);background:var(--surface);min-width:120px;}
  .edit-form.addr-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
  .edit-form.addr-form input{width:100%;min-width:0;}
  @media (max-width:480px){ .edit-form.addr-form{grid-template-columns:1fr;} }
  .edit-form .edit-actions{display:flex;gap:6px;}
  .field-note{font-size:.78rem;color:var(--text-tertiary);}
  .field-msg{font-size:.78rem;color:var(--accent);font-weight:700;}
  .field-msg.error{color:var(--up);}
</style>
</head>

      <button class="icon-btn" aria-label="알림"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="icon-count">5</span></button>

      <button class="icon-btn nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>

          <a href="account.html" class="active"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>회원/계정</a>
          <a href="seller.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>판매자/입점</a>

    <div>
      <h1 style="font-size:1.5rem;font-weight:900;">회원/계정</h1>

        <div class="info-row" id="rowName"><span class="lbl">이름</span><div class="field-wrap" id="nameField"><span class="val kr" id="acctName">-</span><button class="btn btn-outline btn-sm" id="acctNameEditBtn">변경</button></div></div>
        <div class="info-row" id="rowEmail"><span class="lbl">이메일</span><div class="field-wrap" id="emailField"><span class="val" id="acctEmail">-</span><button class="btn btn-outline btn-sm" id="acctEmailBtn">이메일 변경</button></div></div>
        <div class="info-row" id="rowPhone"><span class="lbl">연락처</span><div class="field-wrap" id="phoneField"><span class="val" id="acctPhone">-</span><button class="btn btn-outline btn-sm" id="acctPhoneEditBtn">변경</button></div></div>
        <div class="info-row"><span class="lbl">가입일</span><span class="val" id="acctJoin">-</span></div>

<script>
  var navToggle = document.getElementById('navToggle');
  var mainNav = document.getElementById('mainNav');
  navToggle.addEventListener('click', function(){
    var open = mainNav.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.querySelectorAll('.board-tabs button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.board-tabs button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
    });
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  function fmtDate(s) {
    if (!s) return '';
    var d = new Date(s);
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate());
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var currentUser = null;
  var currentAddress = null;

  document.addEventListener('versoi:ready', function (e) {
    var user = e.detail.user;
    if (!user) return;
    currentUser = user;
    loadAccount(user).catch(function (err) { console.error('[account]', err); });
  });

  async function loadAccount(user) {
    var profile = user.profile || {};
    document.getElementById('acctMemberType').textContent = profile.member_type === 'business' ? '사업자회원' : '일반회원';
    document.getElementById('acctUsername').textContent = (profile.email || user.email || '').split('@')[0];
    document.getElementById('acctName').textContent = profile.name || '-';
    document.getElementById('acctEmail').textContent = profile.email || user.email;
    document.getElementById('acctPhone').textContent = profile.phone || '-';
    document.getElementById('acctJoin').textContent = fmtDate(profile.created_at);
    document.getElementById('toggleEmailOptin').checked = !!profile.marketing_opt_in;
    document.getElementById('toggleSmsOptin').checked = !!profile.notify_sms;
    document.getElementById('toggleNotifyOrder').checked = profile.notify_order !== false;
    document.getElementById('toggleNotifyInquiry').checked = profile.notify_inquiry !== false;

    var addrRes = await window.sb.from('addresses').select('*').eq('profile_id', user.id).order('is_default', { ascending: false }).limit(1).maybeSingle();
    currentAddress = addrRes.data || null;
    renderAddress();

    document.getElementById('acctNameEditBtn').addEventListener('click', openNameEdit);
    document.getElementById('acctPhoneEditBtn').addEventListener('click', openPhoneEdit);
    document.getElementById('acctAddressEditBtn').addEventListener('click', openAddressEdit);
    document.getElementById('acctEmailBtn').addEventListener('click', function (e) {
      e.preventDefault();
      openEmailEdit();
    });
    bindNotifyToggle('toggleEmailOptin', 'marketing_opt_in');
    bindNotifyToggle('toggleSmsOptin', 'notify_sms');
    bindNotifyToggle('toggleNotifyOrder', 'notify_order');
    bindNotifyToggle('toggleNotifyInquiry', 'notify_inquiry');
    document.getElementById('withdrawLink').addEventListener('click', function (e) {
      e.preventDefault();
      if (confirm('회원탈퇴를 진행하시겠습니까? 탈퇴 절차는 고객센터를 통해서만 처리됩니다.')) {
        alert('회원탈퇴는 고객센터 1:1 문의를 통해 접수해 주세요.');
      }
    });
  }

  function renderAddress() {
    var el = document.getElementById('acctAddress');
    if (!currentAddress) { el.textContent = '등록된 배송지가 없습니다.'; return; }
    var a = currentAddress;
    el.textContent = (a.zipcode ? '(' + a.zipcode + ') ' : '') + (a.addr1 || '') + (a.addr2 ? ', ' + a.addr2 : '');
  }

  function bindNotifyToggle(elId, column) {
    document.getElementById(elId).addEventListener('change', async function () {
      var checked = this.checked;
      var payload = {}; payload[column] = checked;
      var res = await window.sb.from('profiles').update(payload).eq('id', currentUser.id);
      if (res.error) { console.error('[account] ' + column + ' update failed', res.error); this.checked = !checked; }
    });
  }

  function isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  function openEmailEdit() {
    var wrap = document.getElementById('emailField');
    var current = document.getElementById('acctEmail').textContent;
    wrap.innerHTML = '<form class="edit-form" id="emailEditForm">' +
      '<input type="email" id="emailInput" placeholder="new-email@example.com" value="">' +
      '<span class="edit-actions"><button type="submit" class="btn btn-primary btn-sm">변경 요청</button> <button type="button" class="btn btn-outline btn-sm" id="emailCancelBtn">취소</button></span>' +
      '</form><div class="field-msg" id="emailMsg" style="width:100%;margin-top:6px;"></div>';
    document.getElementById('emailCancelBtn').addEventListener('click', function () { renderEmailField(current); });
    document.getElementById('emailEditForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var msgEl = document.getElementById('emailMsg');
      var val = document.getElementById('emailInput').value.trim();
      if (!isValidEmail(val)) {
        msgEl.textContent = '올바른 이메일 형식이 아닙니다.';
        msgEl.className = 'field-msg error';
        return;
      }
      if (val === current) {
        msgEl.textContent = '현재 이메일과 동일합니다.';
        msgEl.className = 'field-msg error';
        return;
      }
      var submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      msgEl.textContent = '';
      var res = await window.sb.auth.updateUser({ email: val });
      submitBtn.disabled = false;
      if (res.error) {
        console.error('[account] email change failed', res.error);
        msgEl.textContent = '이메일 변경 요청에 실패했습니다: ' + res.error.message;
        msgEl.className = 'field-msg error';
        return;
      }
      msgEl.textContent = val + ' 주소로 확인 메일을 발송했습니다. 새 이메일 받은편지함에서 링크를 클릭해야 변경이 완료됩니다. (완료 전까지는 기존 이메일로 로그인됩니다.)';
      msgEl.className = 'field-msg';
    });
  }

  function openNameEdit() {
    var wrap = document.getElementById('nameField');
    var current = document.getElementById('acctName').textContent;
    wrap.innerHTML = '<form class="edit-form" id="nameEditForm">' +
      '<input type="text" id="nameInput" value="' + esc(current === '-' ? '' : current) + '">' +
      '<span class="edit-actions"><button type="submit" class="btn btn-primary btn-sm">저장</button> <button type="button" class="btn btn-outline btn-sm" id="nameCancelBtn">취소</button></span>' +
      '</form>';
    document.getElementById('nameCancelBtn').addEventListener('click', function () { renderNameField(current); });
    document.getElementById('nameEditForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var val = document.getElementById('nameInput').value.trim();
      if (!val) return;
      var submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      var res = await window.sb.from('profiles').update({ name: val }).eq('id', currentUser.id);
      if (res.error) { console.error('[account] name update failed', res.error); submitBtn.disabled = false; return; }
      renderNameField(val);
    });
  }
  function renderNameField(name) {
    var wrap = document.getElementById('nameField');
    wrap.innerHTML = '<span class="val kr" id="acctName">' + esc(name) + '</span><button class="btn btn-outline btn-sm" id="acctNameEditBtn">변경</button>';
    document.getElementById('acctNameEditBtn').addEventListener('click', openNameEdit);
  }

  function openPhoneEdit() {
    var wrap = document.getElementById('phoneField');
    var current = document.getElementById('acctPhone').textContent;
    wrap.innerHTML = '<form class="edit-form" id="phoneEditForm">' +
      '<input type="tel" id="phoneInput" placeholder="010-0000-0000" value="' + esc(current === '-' ? '' : current) + '">' +
      '<span class="edit-actions"><button type="submit" class="btn btn-primary btn-sm">저장</button> <button type="button" class="btn btn-outline btn-sm" id="phoneCancelBtn">취소</button></span>' +
      '</form>';
    document.getElementById('phoneCancelBtn').addEventListener('click', function () { renderPhoneField(current); });
    document.getElementById('phoneEditForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var val = document.getElementById('phoneInput').value.trim();
      if (!val) return;
      var submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      var res = await window.sb.from('profiles').update({ phone: val }).eq('id', currentUser.id);
      if (res.error) { console.error('[account] phone update failed', res.error); submitBtn.disabled = false; return; }
      renderPhoneField(val);
    });
  }
  function renderPhoneField(phone) {
    var wrap = document.getElementById('phoneField');
    wrap.innerHTML = '<span class="val" id="acctPhone">' + esc(phone) + '</span><button class="btn btn-outline btn-sm" id="acctPhoneEditBtn">변경</button>';
    document.getElementById('acctPhoneEditBtn').addEventListener('click', openPhoneEdit);
  }

  function renderEmailField(email) {
    var wrap = document.getElementById('emailField');
    wrap.innerHTML = '<span class="val" id="acctEmail">' + esc(email) + '</span><button class="btn btn-outline btn-sm" id="acctEmailBtn">이메일 변경</button>';
    document.getElementById('acctEmailBtn').addEventListener('click', function (e) { e.preventDefault(); openEmailEdit(); });
  }

  function openAddressEdit() {
    var wrap = document.getElementById('addressField');
    var a = currentAddress || {};
    wrap.innerHTML = '<form class="edit-form addr-form" id="addrEditForm">' +
      '<input type="text" id="addrRecipient" placeholder="받는 사람" value="' + esc(a.recipient || '') + '">' +
      '<input type="text" id="addrPhone" placeholder="연락처" value="' + esc(a.phone || '') + '">' +
      '<input type="text" id="addrZip" placeholder="우편번호" value="' + esc(a.zipcode || '') + '">' +
      '<input type="text" id="addr1" placeholder="주소" value="' + esc(a.addr1 || '') + '">' +
      '<input type="text" id="addr2" placeholder="상세주소" value="' + esc(a.addr2 || '') + '" style="grid-column:1 / -1;">' +
      '<span class="edit-actions" style="grid-column:1 / -1;"><button type="submit" class="btn btn-primary btn-sm">저장</button> <button type="button" class="btn btn-outline btn-sm" id="addrCancelBtn">취소</button></span>' +
      '</form>';
    document.getElementById('addrCancelBtn').addEventListener('click', renderAddressField);
    document.getElementById('addrEditForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var payload = {
        profile_id: currentUser.id,
        recipient: document.getElementById('addrRecipient').value.trim(),
        phone: document.getElementById('addrPhone').value.trim(),
        zipcode: document.getElementById('addrZip').value.trim(),
        addr1: document.getElementById('addr1').value.trim(),
        addr2: document.getElementById('addr2').value.trim(),
        is_default: true
      };
      var submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      var res;
      if (currentAddress && currentAddress.id) {
        res = await window.sb.from('addresses').update(payload).eq('id', currentAddress.id).select().maybeSingle();
      } else {
        res = await window.sb.from('addresses').insert(payload).select().maybeSingle();
      }
      if (res.error) { console.error('[account] address save failed', res.error); submitBtn.disabled = false; return; }
      currentAddress = res.data || Object.assign({ id: currentAddress ? currentAddress.id : undefined }, payload);
      renderAddressField();
    });
  }
  function renderAddressField() {
    var wrap = document.getElementById('addressField');
    wrap.innerHTML = '<span class="val kr" id="acctAddress">-</span><button class="btn btn-outline btn-sm" id="acctAddressEditBtn">주소 변경</button>';
    renderAddress();
    document.getElementById('acctAddressEditBtn').addEventListener('click', openAddressEdit);
  }
})();
</script>
</body>
</html>
