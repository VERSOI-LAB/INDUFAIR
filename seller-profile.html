<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDUFAIR(인더페어) 판매자 프로필</title>
<meta name="description" content="INDUFAIR(인더페어) 입점 판매자의 대표 상품과 전체 상품을 확인하는 판매자 프로필 페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .profile-inner{max-width:88%;margin:0 auto;}
  @media (max-width:900px){ .profile-inner{max-width:100%;} }

  .seller-hero{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:40px 16px 28px;
  }
  .seller-hero-logo{
    height:170px;width:auto;max-width:360px;min-width:170px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:18px;
  }
  .seller-hero-logo img{height:100%;width:auto;max-width:360px;object-fit:contain;}
  .seller-hero-logo.placeholder{background:var(--bg-soft);width:170px;font-family:var(--font-en);font-weight:900;font-size:3.6rem;color:var(--text-tertiary);}
  .seller-hero h1{font-size:1.3rem;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .seller-hero p{margin-top:10px;font-size:.9rem;color:var(--text-secondary);line-height:1.6;max-width:640px;}

  /* Product tabs + grid + cards — matches goods.html's 추천상품 section */
  .product-tabs{
    display:flex;gap:4px;background:var(--bg-soft);border-radius:var(--radius-m);padding:5px;margin:26px 0 22px;
    overflow-x:auto;
  }
  .product-tabs button{
    padding:10px 18px;border-radius:8px;font-size:.9rem;font-weight:700;color:var(--text-secondary);
    white-space:nowrap;transition:background .15s ease,color .15s ease;flex-shrink:0;
  }
  .product-tabs button.active{background:var(--accent);color:#fff;box-shadow:var(--shadow-1);}
  .product-tabs button:not(.active):hover{color:var(--text);}

  .product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  .product-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;
    display:flex;flex-direction:column;transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease;
  }
  .product-card:hover{box-shadow:var(--shadow-2);transform:translateY(-3px);border-color:var(--border-strong);}
  .product-media{
    aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;
    background:var(--bg-soft);
  }
  .product-media svg{width:46%;height:46%;}
  .product-badges{position:absolute;top:10px;left:10px;display:flex;gap:5px;z-index:1;}
  .p-badge{font-size:.66rem;font-weight:800;padding:3px 8px;border-radius:20px;color:#fff;letter-spacing:.01em;}
  .p-badge.new{background:var(--accent);}
  .wish-btn{
    position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--surface);
    display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);box-shadow:var(--shadow-1);
    transition:color .15s ease,transform .15s ease;z-index:1;
  }
  .wish-btn:hover{color:var(--up);transform:scale(1.08);}
  .wish-btn.wished{color:var(--up);}
  .wish-btn.wished svg{fill:currentColor;}
  .product-body{padding:14px 15px 15px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .p-brand{display:flex;align-items:center;gap:6px;font-family:var(--font-en);font-weight:800;font-size:.78rem;letter-spacing:.01em;}
  .p-name{font-size:.94rem;font-weight:700;line-height:1.4;}
  .p-specs{font-size:.76rem;color:var(--text-tertiary);line-height:1.55;}
  .p-stock{font-size:.74rem;color:var(--text-tertiary);margin-top:2px;}
  .p-price{font-family:var(--font-en);font-weight:800;font-size:1.12rem;margin-top:2px;}
  .p-price .won{font-size:.82rem;font-weight:700;margin-right:1px;font-family:var(--font-kr);}
  .p-actions{display:flex;gap:8px;margin-top:auto;padding-top:10px;}
  .p-actions .btn{flex:1;padding:9px 8px;font-size:.8rem;}

  .brand-fanuc{color:#C9A200;}
  .brand-mitsu{color:#E4002B;}
  .brand-ls{color:#7B2D8E;}
  .brand-ntn{color:#00539B;}
  .brand-smc{color:#0068B4;}
  .brand-omron{color:#181B4B;}

  @media (max-width:1160px){ .product-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:720px){ .product-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .product-grid{grid-template-columns:1fr 1fr;gap:12px;} .p-actions{flex-direction:column;} }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html" aria-label="INDUFAIR 홈으로 이동">
      <span class="logo-text"><span class="logo-one">1</span>NDUFAIR</span>
      <span class="logo-tag">INDUSTRIAL CIRCULATION<br>PLATFORM</span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="index.html">홈</a><a href="goods.html">산업용품</a><a href="used.html">중고장터</a>
      <a href="brand.html">브랜드관</a><a href="rfq.html">견적요청(RFQ)</a><a href="community.html">커뮤니티</a><a href="support.html">고객센터</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" aria-label="검색"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      <a href="cart.html" class="icon-btn" aria-label="장바구니"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="icon-count">0</span></a>
      <a href="mypage.html" class="icon-btn" aria-label="마이페이지"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg></a>
      <button class="icon-btn nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </div>
</header>

<main>
  <div class="wrap" style="padding-block:0 64px;">

    <div id="notFoundBlock" style="display:none;padding:80px 0;text-align:center;color:var(--text-tertiary);">
      <p style="font-size:.95rem;font-weight:700;">판매자 정보를 찾을 수 없습니다.</p>
      <a href="goods.html" class="btn btn-outline" style="margin-top:16px;">산업용품 둘러보기</a>
    </div>

    <div id="profileBody" style="display:none;">
      <div class="profile-inner">
        <div class="seller-hero">
          <div class="seller-hero-logo placeholder" id="heroLogo">V</div>
          <h1 id="heroName">-</h1>
          <p id="heroIntro"></p>
        </div>

        <div class="product-tabs" id="profileTabs" role="tablist">
          <button class="active" data-cat="">추천상품</button>
        </div>

        <p style="font-size:.84rem;color:var(--text-tertiary);margin-bottom:14px;" id="totalCountText">총 0개의 상품이 있습니다.</p>
        <div class="product-grid" id="productGrid"></div>
      </div>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>&copy; 2026 INDUFAIR(인더페어). 산업 자원의 순환을 연결하다.</p>
    <div class="footer-links"><a href="terms.html">이용약관</a><a href="privacy.html">개인정보처리방침</a><a href="business-info.html">사업자정보확인</a><a href="seller-apply.html">제휴/입점문의</a></div>
  </div>
</footer>

<script>
  var navToggle = document.getElementById('navToggle');
  var mainNav = document.getElementById('mainNav');
  navToggle.addEventListener('click', function(){
    var open = mainNav.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  var PLACEHOLDER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#C9D8F5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="1.5"/><line x1="8" y1="9" x2="8" y2="15"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="16" y1="9" x2="16" y2="15"/><line x1="4" y1="9" x2="20" y2="9"/></svg>';
  var GRADE_LABEL = { a: 'A급', b: 'B급', c: 'C급', refurb: '리퍼비시', idle: '유휴재고', new: '신품' };
  var BG_GRADS = ['linear-gradient(150deg,#1E293F,#0F1830)','linear-gradient(150deg,#25313F,#101A22)','linear-gradient(150deg,#2B2417,#151009)','linear-gradient(150deg,#232A38,#10141C)'];
  var BRAND_CLASS = { MITSUBISHI:'brand-mitsu', FANUC:'brand-fanuc', SMC:'brand-smc', OMRON:'brand-omron', NTN:'brand-ntn' };
  var state = { category: '', products: [] };
  var favSet = new Set();

  function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function gradFor(id) { var sum = 0; String(id).split('').forEach(function (c) { sum += c.charCodeAt(0); }); return BG_GRADS[sum % BG_GRADS.length]; }
  function brandClass(m) {
    if (!m) return '';
    var key = m.toUpperCase();
    for (var k in BRAND_CLASS) { if (key.indexOf(k) !== -1) return BRAND_CLASS[k]; }
    if (key.indexOf('LS') !== -1) return 'brand-ls';
    return '';
  }

  function cardHTML(p) {
    var img = p.product_images && p.product_images.length ? p.product_images[0].url : null;
    var media = img ? '<img src="' + img + '" alt="" style="width:100%;height:100%;object-fit:contain;">' : PLACEHOLDER_SVG;
    var isUsed = p.market_type === 'used';
    var badges = '<span class="p-badge' + (isUsed ? '' : ' new') + '"' + (isUsed ? ' style="background:var(--up);"' : '') + '>' + (isUsed ? '중고' : '신품') + '</span>' +
      (p.stock <= 0 ? '<span class="p-badge" style="background:var(--text-tertiary);">품절</span>' : '');
    var specParts = [p.model_no];
    specParts.push(isUsed ? (GRADE_LABEL[p.condition] || p.condition) : (p.categories ? p.categories.name : ''));
    var specs = specParts.filter(Boolean).map(escapeHtml).join('<br>');
    return ''
      + '<article class="product-card">'
      +   '<a class="product-media" href="product-detail.html?id=' + p.id + '" style="background:' + (img ? 'var(--bg-soft)' : gradFor(p.id)) + ';">'
      +     '<div class="product-badges">' + badges + '</div>'
      +     '<button class="wish-btn' + (favSet.has(p.id) ? ' wished' : '') + '" aria-label="찜하기" data-id="' + p.id + '"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>'
      +     media
      +   '</a>'
      +   '<div class="product-body">'
      +     '<span class="p-brand ' + brandClass(p.manufacturer) + '">' + escapeHtml(p.manufacturer || '') + '</span>'
      +     '<span class="p-name">' + escapeHtml(p.title) + '</span>'
      +     '<span class="p-specs">' + specs + '</span>'
      +     '<span class="p-stock">' + (p.stock > 0 ? '재고 ' + p.stock + '개' : '품절') + '</span>'
      +     '<span class="p-price"><span class="won">₩</span>' + Number(p.price).toLocaleString('ko-KR') + '</span>'
      +     '<div class="p-actions">'
      +       '<button class="btn btn-primary btn-sm add-cart-btn" data-id="' + p.id + '" data-stock="' + p.stock + '">장바구니</button>'
      +       '<a class="btn btn-outline btn-sm" href="product-detail.html?id=' + p.id + '">상세보기</a>'
      +     '</div>'
      +   '</div>'
      + '</article>';
  }

  function render() {
    var list = state.category
      ? state.products.filter(function (p) { return String(p.category_id) === String(state.category); })
      : state.products.slice().sort(function (a, b) { return (b.view_count || 0) - (a.view_count || 0); });
    var grid = document.getElementById('productGrid');
    grid.innerHTML = list.length ? list.map(cardHTML).join('') : '<p style="padding:40px 0;color:var(--text-tertiary);grid-column:1/-1;text-align:center;">등록된 상품이 없습니다.</p>';
    document.getElementById('totalCountText').textContent = '총 ' + list.length + '개의 상품이 있습니다.';
  }

  function buildCategoryTabs() {
    var seen = {};
    var cats = [];
    state.products.forEach(function (p) {
      if (p.category_id && p.categories && !seen[p.category_id]) {
        seen[p.category_id] = true;
        cats.push({ id: p.category_id, name: p.categories.name });
      }
    });
    var tabs = document.getElementById('profileTabs');
    tabs.innerHTML = '<button class="active" data-cat="">추천상품</button>' +
      cats.map(function (c) { return '<button data-cat="' + c.id + '">' + escapeHtml(c.name) + '</button>'; }).join('');
  }

  async function toggleFavorite(productId, btn) {
    if (!window.VERSOI.requireAuth()) return;
    var uid = window.VERSOI.user.id;
    btn.disabled = true;
    try {
      if (favSet.has(productId)) {
        await sb.from('favorites').delete().eq('profile_id', uid).eq('product_id', productId);
        favSet.delete(productId);
        btn.classList.remove('wished');
      } else {
        await sb.from('favorites').insert({ profile_id: uid, product_id: productId });
        favSet.add(productId);
        btn.classList.add('wished');
      }
    } catch (err) { console.error(err); }
    btn.disabled = false;
  }

  async function handleAddToCart(productId, btn) {
    if (!window.VERSOI.requireAuth()) return;
    var original = btn.textContent;
    btn.disabled = true;
    try {
      var uid = window.VERSOI.user.id;
      var stock = parseInt(btn.dataset.stock, 10);
      var max = isNaN(stock) ? Infinity : stock;
      var existing = await sb.from('cart_items').select('id,qty').eq('profile_id', uid).eq('product_id', productId).maybeSingle();
      if (existing.data) {
        await sb.from('cart_items').update({ qty: Math.min(max, existing.data.qty + 1) }).eq('id', existing.data.id);
      } else {
        await sb.from('cart_items').insert({ profile_id: uid, product_id: productId, qty: Math.min(max, 1), selected: true });
      }
      btn.textContent = '담김';
    } catch (err) {
      console.error(err);
      btn.textContent = '오류';
    }
    setTimeout(function () { btn.textContent = original; btn.disabled = false; }, 1000);
  }

  document.getElementById('productGrid').addEventListener('click', function (e) {
    var wishBtn = e.target.closest('.wish-btn');
    if (wishBtn) { e.preventDefault(); toggleFavorite(wishBtn.dataset.id, wishBtn); return; }
    var cartBtn = e.target.closest('.add-cart-btn');
    if (cartBtn) { e.preventDefault(); handleAddToCart(cartBtn.dataset.id, cartBtn); return; }
  });

  document.getElementById('profileTabs').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll('#profileTabs button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.category = btn.dataset.cat;
    render();
  });

  async function init() {
    var companyId = new URLSearchParams(location.search).get('company_id');
    if (!companyId) { document.getElementById('notFoundBlock').style.display = 'block'; return; }

    var companyRes = await sb.from('companies').select('id,name,intro,logo_url,biz_verified_at').eq('id', companyId).maybeSingle();
    if (!companyRes.data) { document.getElementById('notFoundBlock').style.display = 'block'; return; }
    var company = companyRes.data;

    document.title = 'INDUFAIR(인더페어) 판매자 프로필 | ' + company.name;
    document.getElementById('profileBody').style.display = 'block';
    document.getElementById('heroName').innerHTML = escapeHtml(company.name) +
      (company.biz_verified_at ? ' <span class="badge badge-good" style="font-size:.7rem;vertical-align:middle;">사업자 인증</span>' : '');
    document.getElementById('heroIntro').textContent = company.intro || '아직 등록된 회사 소개가 없습니다.';
    var logoEl = document.getElementById('heroLogo');
    if (company.logo_url) {
      logoEl.classList.remove('placeholder');
      logoEl.innerHTML = '<img src="' + company.logo_url + '" alt="">';
    } else {
      logoEl.textContent = (company.name || 'V').charAt(0);
    }

    var productsRes = await sb.from('products')
      .select('id,title,model_no,manufacturer,price,stock,condition,market_type,view_count,category_id,categories(name),product_images(url,sort_order)')
      .eq('company_id', companyId).in('status', ['selling', 'soldout'])
      .order('sort_order', { foreignTable: 'product_images', ascending: true })
      .order('created_at', { ascending: false });
    state.products = productsRes.data || [];

    buildCategoryTabs();
    render();
  }

  document.addEventListener('versoi:ready', async function (e) {
    var user = e.detail.user;
    if (user) {
      var favRes = await sb.from('favorites').select('product_id').eq('profile_id', user.id);
      (favRes.data || []).forEach(function (f) { favSet.add(f.product_id); });
    }
    await init();
  });
})();
</script>
</body>
</html>
