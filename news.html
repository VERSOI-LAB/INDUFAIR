<style>
  .board-toolbar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .board-search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:var(--surface);}
  .board-search svg{color:var(--text-tertiary);flex-shrink:0;}
  .board-search input{border:none;background:none;padding:11px 0;font-size:.88rem;color:var(--text);font-family:inherit;width:100%;}
  .board-search input:focus{outline:none;}

  .news-row{display:flex;gap:16px;padding:20px 4px;border-bottom:1px solid var(--border);}
  .news-row:last-child{border-bottom:none;}
  .news-thumb{width:104px;height:78px;border-radius:9px;background:var(--bg-soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);overflow:hidden;}
  .news-tag{display:inline-flex;font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-bottom:8px;}
  .news-title{font-size:.98rem;font-weight:700;line-height:1.4;}
  .news-title:hover{color:var(--accent);}
  .news-desc{font-size:.82rem;color:var(--text-tertiary);margin-top:6px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
  .news-date{font-size:.76rem;color:var(--text-tertiary);margin-top:8px;font-family:var(--font-en);}

  @media (max-width:640px){ .news-thumb{display:none;} }
</style>
</head>
<body>

      <span class="logo-tag">INDUSTRIAL CIRCULATION<br>PLATFORM</span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="index.html">홈</a><a href="goods.html">산업용품</a><a href="used.html">중고장터</a>
      <a href="brand.html">브랜드관</a><a href="rfq.html">견적요청(RFQ)</a><a href="community.html" class="active">커뮤니티</a><a href="support.html">고객센터</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" aria-label="검색"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      <button class="icon-btn" aria-label="알림"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="icon-count">5</span></button>
      <a href="cart.html" class="icon-btn" aria-label="장바구니"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="icon-count">2</span></a>
      <button class="btn btn-ghost">로그인</button>
      <button class="btn btn-primary">회원가입</button>
      <button class="icon-btn nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </div>
</header>

<main>
  <div class="wrap page-layout">
    <aside>
      <div class="page-title-block" style="padding-top:26px;">
        <h1>산업 뉴스</h1>
        <p>산업 분야의 최신 뉴스와 트렌드를<br>한눈에 확인하세요.</p>
      </div>
      <div class="side-panel">
        <nav class="side-nav">
          <a href="news.html" class="active"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>전체 뉴스</a>
          <a href="#"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>정책/지원</a>
          <a href="#"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>기술/동향</a>
          <a href="#"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V10l6-4v15"/><path d="M15 21V13l6-3v11"/><path d="M9 21v-4h6v4"/></svg>산업/경영</a>
          <a href="#"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>기업/경영</a>
          <a href="#"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V4a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v3"/></svg>전시/행사</a>
        </nav>
      </div>
    </aside>

    <div>
      <h1 style="font-size:1.5rem;font-weight:900;">산업 뉴스</h1>
      <p style="margin-top:8px;font-size:.9rem;color:var(--text-secondary);">산업 분야의 최신 뉴스와 트렌드를 확인하세요.</p>

      <div class="board-toolbar">
        <form class="board-search" id="newsSearchForm" style="flex:1;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="newsSearchInput" placeholder="뉴스 제목, 키워드를 입력하세요">
        </form>
      </div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);box-shadow:var(--shadow-1);padding:6px 20px;margin-top:18px;" id="newsRows">
        <p style="padding:24px 0;text-align:center;color:var(--text-tertiary);">불러오는 중...</p>
      </div>
    </div>

<footer class="site-footer">

  </div>
</footer>

<script>
  var navToggle = document.getElementById('navToggle');
  var mainNav = document.getElementById('mainNav');
  navToggle.addEventListener('click', function(){
    var open = mainNav.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  var BOARD_TYPE = 'news';
  var THUMB_ICON = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>';
  var posts = [];
  var searchQ = '';

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    return iso.slice(0, 10).replace(/-/g, '.');
  }

  async function loadPosts() {
    var res = await sb.from('community_posts')
      .select('id,title,content,created_at')
      .eq('board_type', BOARD_TYPE)
      .order('created_at', { ascending: false });
    posts = res.data || [];
    render();
  }

  function render() {
    var wrap = document.getElementById('newsRows');
    var list = posts;
    if (searchQ) list = list.filter(function (p) { return p.title.toLowerCase().indexOf(searchQ.toLowerCase()) !== -1; });
    if (!list.length) { wrap.innerHTML = '<p style="padding:24px 0;text-align:center;color:var(--text-tertiary);">등록된 뉴스가 없습니다.</p>'; return; }
    wrap.innerHTML = list.map(function (p) {
      var desc = (p.content || '').slice(0, 80);
      return '<div class="news-row">' +
        '<span class="news-thumb">' + THUMB_ICON + '</span>' +
        '<div>' +
        '<span class="news-tag">산업 뉴스</span>' +
        '<a href="community.html?board=news&post=' + p.id + '" class="news-title" style="display:block;">' + escapeHtml(p.title) + '</a>' +
        '<p class="news-desc">' + escapeHtml(desc) + '</p>' +
        '<span class="news-date tabular">' + fmtDate(p.created_at) + '</span>' +
        '</div>' +
        '</div>';
    }).join('');
  }

  document.getElementById('newsSearchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    searchQ = document.getElementById('newsSearchInput').value.trim();
    render();
  });

  document.addEventListener('versoi:ready', function () { loadPosts(); });
})();
</script>
</body>
</html>
