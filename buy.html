<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>산다 - 판다산다</title>
<link rel="icon" href="/이미지/web/logo.jpg">
<link rel="stylesheet" href="/app.css">
<style>
  html,body{height:100%;overflow:hidden;}
  .app{min-height:0;height:100%;padding-bottom:0;}
  #map{position:fixed;top:0;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));left:0;right:0;max-width:var(--app-w);margin:0 auto;background:#EEF0F2;z-index:1;}

  /* 상단 검색 */
  .top{position:fixed;top:0;left:0;right:0;max-width:var(--app-w);margin:0 auto;z-index:30;padding:calc(12px + env(safe-area-inset-top)) 16px 0;pointer-events:none;}
  .top .search{pointer-events:auto;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.12);}
  .top .clear{width:32px;height:32px;border-radius:50%;background:#E5E5E5;color:var(--sub);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* 지도 핀 */
  .map-pin{position:relative;display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:16px;background:#fff;border:2px solid var(--primary);
    font:700 13px/1 "Pretendard Variable",Pretendard,sans-serif;color:var(--text);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;}
  .map-pin::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:#fff;border-right:2px solid var(--primary);border-bottom:2px solid var(--primary);transform:translateX(-50%) rotate(45deg);}
  .map-pin.on{background:var(--primary);transform:scale(1.12);}
  .map-pin.on::after{background:var(--primary);}
  .map-pin.biz{border-color:#2F5BD3;background:#2F5BD3;color:#fff;gap:4px;}
  .map-pin.biz::after{background:#2F5BD3;border-color:#2F5BD3;}
  .map-pin.biz.on{background:#1E3FA8;}
  .map-pin.biz.on::after{background:#1E3FA8;border-color:#1E3FA8;}
  .map-pin i{font-style:normal;font-size:13px;}
  .map-pin-wrap{background:none;border:none;}
  .map-pin-wrap .map-pin{transform:translate(-50%, calc(-100% - 8px));}
  .map-pin-wrap .map-pin.on{transform:translate(-50%, calc(-100% - 8px)) scale(1.12);}
  .map-me{width:18px;height:18px;border-radius:50%;background:#2F7CF6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,124,246,.2);}
  .leaflet-control-attribution{font-size:10px;}

  /* 아래 시트(목차바) */
  .sheet2{position:fixed;left:0;right:0;max-width:var(--app-w);margin:0 auto;z-index:20;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    height:calc(100dvh - var(--tabbar-h) - env(safe-area-inset-bottom) - 80px);background:var(--surface);border-radius:20px 20px 0 0;
    box-shadow:0 -4px 20px rgba(0,0,0,.10);display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform;}
  .sheet2.dragging{transition:none;}
  .sheet-head{flex-shrink:0;touch-action:none;cursor:grab;padding:10px 16px 0;user-select:none;-webkit-user-select:none;}
  .sheet-head img{-webkit-user-drag:none;user-drag:none;pointer-events:none;}
  .sheet-head .handle{width:44px;height:5px;border-radius:3px;background:#DDD;margin:0 auto 14px;}
  .cats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
  .cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;border-radius:16px;font-size:13px;font-weight:600;color:var(--text);line-height:1.2;text-align:center;white-space:nowrap;letter-spacing:-.3px;min-width:0;}
  .cat .i3d{transition:transform .15s ease;}
  .cat:active .i3d{transform:scale(.92);}
  .cat.on{background:var(--primary-light);box-shadow:inset 0 0 0 2px var(--primary);}
  .list-head{display:flex;align-items:center;justify-content:space-between;padding:12px 0 4px;border-top:1px solid var(--line);margin-top:8px;font-size:15px;font-weight:700;}
  .list-head span{font-size:13px;color:var(--hint);font-weight:500;}
  .sheet-body{flex:1;overflow-y:auto;padding:0 16px 24px;overscroll-behavior:contain;}
  .sec-h{font-size:21px;font-weight:800;margin:18px 0 14px;line-height:1.3;}
  /* 동네 업체: 여러 쪽이면 좌우로 넘기는 슬라이드 (3초마다 자동으로 다음 쪽) */
  .bizslider{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;}
  .bizslider::-webkit-scrollbar{display:none;}
  .bizslider > .bizgrid{flex:0 0 100%;scroll-snap-align:start;align-content:start;}
  .bizdots{display:flex;justify-content:center;gap:6px;margin-top:16px;}
  .bizdots button{width:8px;height:8px;border-radius:50%;background:#D9DCE1;transition:width .2s ease,background .2s ease;}
  .bizdots button.on{width:20px;border-radius:4px;background:var(--text);}
  /* 물건 정렬 */
  .badge.pick{background:var(--primary);color:var(--text);}
  .sorts{display:flex;gap:2px;}
  .sorts button{height:32px;padding:0 10px;border-radius:16px;font-size:13px;font-weight:600;color:var(--hint);white-space:nowrap;}
  .sorts button.on{background:#F2F3F5;color:var(--text);font-weight:700;}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:#F2F3F5;border-radius:12px;padding:4px;margin-top:14px;}
  .seg button{height:40px;border-radius:9px;font-size:15px;font-weight:700;color:var(--sub);}
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .divider{height:8px;background:#F2F3F5;margin:28px -16px 0;}
  .biz-cta{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px 16px;border-radius:14px;background:#EAF2FE;color:#1E3FA8;font-weight:700;font-size:15px;}
  .row.hl{background:var(--primary-light);margin:0 -16px;padding-left:16px;padding-right:16px;border-radius:0;}

  /* 떠 있는 버튼 (시트와 같이 움직임) */
  .floats{position:absolute;right:16px;top:-72px;display:flex;gap:10px;transition:opacity .2s ease;}
  .sheet2.full .floats{opacity:0;pointer-events:none;}
  .fbtn{width:56px;height:56px;border-radius:50%;background:var(--surface);box-shadow:0 3px 12px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;}
  .fbtn.add{background:var(--primary);font-size:30px;font-weight:400;color:var(--text);}
  .map-msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;color:var(--sub);font-size:15px;text-align:center;}

  .map-zoom,.map-close,.map-bg{display:none;} /* 지도 크게 보기는 PC 전용 */

  /* PC: 지도 고정 화면 대신 스크롤되는 한 페이지. 좌우 여백은 홈과 같게 (내용 폭 = 화면의 70%)
     1줄: 왼쪽 검색창 + 대분류 5개 / 오른쪽 작은 지도   2줄: 동네 업체 2칸   3줄: 근처 물건 2칸 (홈의 방금 올라온 물건과 같은 비율) */
  @media (min-width:1101px){
    html,body{height:auto;overflow:visible;}
    .app{height:auto;min-height:calc(100vh - var(--head-h));padding:28px 15vw 64px;
      display:grid;grid-template-columns:minmax(0,1fr) 36%;grid-template-rows:auto auto auto;column-gap:28px;align-content:start;}
    .app > *{max-width:none;margin:0;}
    .sheet2{display:contents;} /* 시트는 풀어서 안의 분류·목록을 페이지에 바로 놓음 (끌기 없음) */

    /* 오른쪽 위: 작은 지도 */
    #map{position:relative;top:auto;bottom:auto;left:auto;right:auto;max-width:none;margin:0;grid-column:2;grid-row:1 / span 2;height:auto;align-self:stretch; /* 높이는 왼쪽(검색창 + 대분류)에 맞춤 */
      border-radius:20px;overflow:hidden;border:1px solid var(--line);z-index:0;}
    .map-msg{position:static;transform:none;grid-column:2;grid-row:1 / span 2;align-self:center;justify-self:center;z-index:1;}
    .floats,.sheet2.full .floats{position:relative;top:auto;right:auto;grid-column:2;grid-row:1 / span 2;align-self:end;justify-self:end;
      margin:0 14px 14px 0;z-index:2;opacity:1;pointer-events:auto;}
    .fbtn{width:48px;height:48px;}
    .map-zoom{display:flex;position:relative;grid-column:2;grid-row:1 / span 2;align-self:start;justify-self:end;margin:14px 14px 0 0;z-index:2;font-size:20px;}

    /* 지도 크게 보기 (돋보기 버튼 → body.map-big). Esc 나 X 로 되돌림 */
    body.map-big{overflow:hidden;}
    body.map-big .map-bg{display:block;position:fixed;inset:0;max-width:none;z-index:79;background:rgba(0,0,0,.45);}
    body.map-big #map{position:fixed;top:calc(var(--head-h) + 20px);bottom:24px;left:5vw;right:5vw;height:auto;z-index:80;box-shadow:0 20px 60px rgba(0,0,0,.3);}
    body.map-big .map-zoom{display:none;}
    body.map-big .map-close{display:flex;position:fixed;top:calc(var(--head-h) + 34px);right:calc(5vw + 14px);z-index:81;}
    body.map-big .floats{position:fixed;right:calc(5vw + 14px);bottom:38px;margin:0;z-index:81;}
    .fbtn:hover{filter:brightness(.96);}

    /* 왼쪽 위: 검색창 + 대분류 */
    .top{position:static;grid-column:1;grid-row:1;width:auto;max-width:none;margin:0;padding:0;pointer-events:auto;}
    .top .search{height:64px;padding:0 22px;border-radius:20px;box-shadow:none;background:#F2F2F2;}
    .top .search input{font-size:19px;}
    .sheet-head{grid-column:1;grid-row:2;display:flex;padding:16px 0 0;cursor:default;touch-action:auto;}
    .sheet-head .handle{display:none;}
    .cats{flex:1;gap:12px;}
    .cat{justify-content:center;gap:12px;height:176px;padding:0;border-radius:20px;background:#F7F8FA;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s ease;}
    .cat .i3d{width:76px !important;height:76px !important;}
    .cat:hover{background:#EFF1F4;}
    .cat.on,.cat.on:hover{background:var(--primary-light);}

    /* 아래: 업체 2칸(가로형 카드) → 물건 2칸 */
    .sheet-body{grid-column:1 / -1;grid-row:3;overflow:visible;padding:0;}
    .seg{max-width:360px;margin-top:28px;}
    .sec-h{font-size:24px;margin:40px 0 16px;}
    .bizgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;}
    .bizcard{display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:20px;align-content:center;padding:14px;border:1px solid var(--line);border-radius:20px;transition:box-shadow .15s ease;}
    .bizcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);}
    .bizcard .bz-ph{grid-column:1;grid-row:1 / span 3;}
    .bizcard .bz-quote,.bizcard .bz-name,.bizcard .bz-meta{grid-column:2;}
    .bizcard .bz-quote{margin-top:0;font-size:16px;}
    .bizcard .bz-name{font-size:19px;}
    .bizslider{gap:20px;}
    .bizdots button{cursor:pointer;}
    .divider{display:none;}
    .list-head{margin-top:40px;padding:0 0 8px;border-top:none;font-size:24px;font-weight:800;}
    .sorts{gap:4px;}
    .sorts button{height:36px;padding:0 14px;font-size:15px;cursor:pointer;}
    .sorts button:not(.on):hover{color:var(--text);}
    .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;}
    .list .row:nth-last-child(2):nth-child(odd){border-bottom:none;}
    .list > .empty{grid-column:1 / -1;}
    .row.hl{margin:0;padding-left:12px;padding-right:12px;border-radius:12px;}
  }
</style>
</head>
<body>
<div class="app">
  <div id="map"></div>
  <div class="map-msg" id="mapMsg">지도를 불러오는 중…</div>
  <!-- PC 전용: 작은 지도를 크게 보기 / 닫기 -->
  <div class="map-bg" id="mapBg"></div>
  <button type="button" class="fbtn map-zoom" id="mapZoom" aria-label="지도 크게 보기">🔍</button>
  <button type="button" class="fbtn map-close" id="mapClose" aria-label="지도 작게 되돌리기"><i data-icon="close" data-size="22"></i></button>

  <div class="top">
    <form class="search" id="searchForm" role="search">
      <span class="si" aria-hidden="true" style="display:flex"><i data-icon3d="search" data-size="26"></i></span>
      <input id="q" type="search" placeholder="무엇을 찾으시나요?" enterkeyhint="search" autocomplete="off" aria-label="검색어">
      <button type="button" class="clear" id="clearQ" hidden aria-label="검색어 지우기"><i data-icon="close" data-size="16"></i></button>
    </form>
  </div>

  <section class="sheet2" id="sheet" aria-label="물건 목록">
    <div class="floats">
      <button type="button" class="fbtn" id="locBtn" aria-label="내 위치"><i data-icon3d="location" data-size="34"></i></button>
      <button type="button" class="fbtn add" id="addBtn" aria-label="올리기">+</button>
    </div>
    <div class="sheet-head" id="sheetHead">
      <div class="handle" aria-hidden="true"></div>
      <div class="cats" id="cats" role="tablist"></div>
    </div>
    <div class="sheet-body" id="sheetBody">
      <div id="segWrap"></div>
      <section id="bizSec"></section>
      <section id="prodSec">
        <div class="list-head"><b id="countLabel">물건</b>
          <div class="sorts" id="sorts" role="tablist" aria-label="정렬">
            <button type="button" role="tab" data-s="rec" class="on" aria-selected="true">추천순</button>
            <button type="button" role="tab" data-s="pop" aria-selected="false">인기순</button>
            <button type="button" role="tab" data-s="near" aria-selected="false">가까운순</button>
          </div>
        </div>
        <div class="list" id="list"><div class="skeleton" style="height:108px;margin:16px 0"></div></div>
      </section>
    </div>
  </section>

  <div class="sheet-bg" id="addBg"></div>
  <div class="sheet" id="addSheet" role="dialog" aria-label="무엇을 올릴까요">
    <div class="handle"></div>
    <a class="opt" href="/sell"><i data-icon3d="camera" data-size="34"></i>물건 팔기</a>
    <a class="opt" href="/biz/new"><i data-icon3d="home" data-size="34"></i>우리 업체 소개하기</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script src="/js/map.js"></script>
<script>
(function () {
  PS.renderTabbar('buy');
  var state = { q: PS.param('q') || '', cat: PS.param('c') || '', selected: null, tab: 'prod', page: 0, sort: 'rec' };
  var categoryIds = {}, categoryNames = {};
  var all = [];          // 모든 물건 (좌표 포함)
  var bizAll = [];       // 동네 업체 (사업자 인증 업체)
  var sellers = [];      // 판매자별 위치 (업체가 없는 판매자만, 지도 핀용)
  var BIZ_PAGE = 4;
  var map = null, adapter = null;
  var origin = null;     // 거리 기준점 (내 위치 또는 지도 중심)

  var $ = function (id) { return document.getElementById(id); };
  var qInput = $('q');
  qInput.value = state.q;
  $('clearQ').hidden = !state.q;

  // ---------- 목차바(대분류) ----------
  function renderCats() {
    $('cats').innerHTML = PS.CATEGORIES.map(function (c) {
      var on = state.cat === c;
      return '<button type="button" role="tab" aria-selected="' + on + '" class="cat' + (on ? ' on' : '') + '" data-c="' + PS.esc(c) + '">' +
        PS.categoryIcon(c, 54) + '<span>' + PS.esc(c) + '</span></button>';
    }).join('');
  }
  renderCats();

  // ---------- 시트 끌어올리기 ----------
  var sheet = $('sheet');
  var sheetState = 'half';
  function visibleFor(s) {
    var H = sheet.offsetHeight;
    var headH = $('sheetHead').offsetHeight;
    if (s === 'full') return H;
    if (s === 'half') return Math.max(headH + 160, Math.round(H * 0.55));
    return headH + 8;
  }
  function setSheet(s) {
    sheetState = s;
    sheet.classList.toggle('full', s === 'full');
    sheet.style.transform = 'translateY(' + (sheet.offsetHeight - visibleFor(s)) + 'px)';
  }
  var drag = null;
  $('sheetHead').addEventListener('pointerdown', function (e) {
    drag = { y: e.clientY, start: sheet.offsetHeight - visibleFor(sheetState), moved: false, id: e.pointerId };
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dy) < 6) return;
    if (!drag.moved) { drag.moved = true; sheet.classList.add('dragging'); }
    var H = sheet.offsetHeight;
    var y = Math.min(H - visibleFor('peek'), Math.max(0, drag.start + dy));
    sheet.style.transform = 'translateY(' + y + 'px)';
  });
  window.addEventListener('pointercancel', function () {
    if (!drag) return;
    sheet.classList.remove('dragging');
    setSheet(sheetState);
    drag = null;
  });
  window.addEventListener('pointerup', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var wasMoved = drag.moved;
    sheet.classList.remove('dragging');
    if (wasMoved) {
      var m = /translateY\(([-\d.]+)px\)/.exec(sheet.style.transform);
      var shown = sheet.offsetHeight - (m ? Number(m[1]) : 0);
      var best = ['peek', 'half', 'full'].reduce(function (a, s) {
        return Math.abs(visibleFor(s) - shown) < Math.abs(visibleFor(a) - shown) ? s : a;
      }, 'peek');
      setSheet(best);
      // 끌어서 놓은 직후 생기는 클릭은 무시
      $('sheetHead').addEventListener('click', function stop(ev) { ev.stopPropagation(); ev.preventDefault(); }, { capture: true, once: true });
    } else if (e.target.closest('.handle')) {
      setSheet(sheetState === 'peek' ? 'half' : sheetState === 'half' ? 'full' : 'peek');
    }
    drag = null;
  });
  window.addEventListener('resize', function () { setSheet(sheetState); if (map) map.relayout(); });

  $('cats').addEventListener('click', function (e) {
    var b = e.target.closest('.cat');
    if (!b) return;
    state.cat = state.cat === b.dataset.c ? '' : b.dataset.c;
    state.selected = null;
    state.page = 0;
    renderCats();
    syncUrl();
    render(true);
    if (sheetState === 'peek') setSheet('half');
  });

  // ---------- 검색 ----------
  $('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    state.q = qInput.value.trim();
    state.selected = null;
    state.tab = 'prod';
    qInput.blur();
    $('clearQ').hidden = !state.q;
    syncUrl();
    render(true);
    if (sheetState === 'peek') setSheet('half');
  });
  qInput.addEventListener('input', function () { $('clearQ').hidden = !qInput.value; });
  $('clearQ').addEventListener('click', function () {
    qInput.value = '';
    state.q = '';
    $('clearQ').hidden = true;
    syncUrl();
    render(true);
  });

  function syncUrl() {
    var p = new URLSearchParams();
    if (state.q) p.set('q', state.q);
    if (state.cat) p.set('c', state.cat);
    history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
  }

  // ---------- 목록 + 지도 그리기 ----------
  function filtered() {
    var q = state.q.toLowerCase();
    var catId = state.cat ? categoryIds[state.cat] : null;
    return all.filter(function (p) {
      if (state.cat && p.category_id !== catId) return false;
      if (q && (p.title + ' ' + (p.brand || '')).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function filteredBiz() {
    var q = state.q.toLowerCase();
    var catId = state.cat ? categoryIds[state.cat] : null;
    return bizAll.filter(function (b) {
      if (state.cat && b.category_id !== catId) return false;
      if (q && (b.name + ' ' + b.tagline + ' ' + (b.description || '')).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  // 보여주는 순서: 프리미엄 업체 먼저, 그다음 인기(찜·조회·끌어올림) 3개 + 새 업체 1개씩 섞어서 한 업체만 계속 위에 있지 않게
  function feedOrder(list) {
    var now = Date.now();
    var score = function (b) {
      var bumpDays = (now - new Date(b.bumped_at).getTime()) / 86400000;
      return (b.like_count || 0) * 3 + (b.view_count || 0) * 0.2 + Math.max(0, 7 - bumpDays) * 2;
    };
    var ranked = list.slice().sort(function (a, b) { return score(b) - score(a); });
    var newest = list.slice().sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    var used = {}, out = [];
    var take = function (arr) { for (var i = 0; i < arr.length; i++) if (!used[arr[i].id]) { used[arr[i].id] = 1; return arr[i]; } return null; };
    // 프리미엄 업체는 항상 맨 앞 (그 안에서는 점수순)
    ranked.forEach(function (b) { if (b._premium) { used[b.id] = 1; out.push(b); } });
    while (out.length < list.length) {
      for (var k = 0; k < 3; k++) { var r = take(ranked); if (r) out.push(r); }
      var n = take(newest); if (n) out.push(n);
    }
    return out;
  }

  function withKm(rows) {
    var base = origin || (map ? map.center() : null);
    rows.forEach(function (p) { p._km = base && p.lat != null ? PS.distanceKm(base, p) : null; });
    return rows;
  }

  function isSel(kind, id) { return state.selected && state.selected.kind === kind && state.selected.id === id; }

  function renderBiz(list, searching) {
    var sec = $('bizSec');
    if (!bizAll.length && !searching) {
      // 아직 업체가 없을 때: 소개하기 안내만
      sec.innerHTML = '<a class="biz-cta" href="/biz/new">' + PS.icon3d('home', 36) + '<span>우리 동네 첫 업체가 되어 보세요!<br><small style="font-weight:500">사업자 인증 후 무료로 소개할 수 있어요</small></span></a>';
      return;
    }
    var title = searching ? '' : '<h2 class="sec-h">' + (state.cat ? PS.esc(state.cat) + ' 업체' : '이웃들이 찾는 동네 업체는?') + '</h2>';
    if (!list.length) {
      sec.innerHTML = title + '<div class="empty" style="padding:24px 0">' + PS.icon3d('home', 72) + '<b>' + (searching ? '찾는 업체가 없어요' : '이 분류 업체가 아직 없어요') + '</b></div>';
      return;
    }
    var ordered = searching ? list : feedOrder(list);
    var pages = searching ? 1 : Math.ceil(ordered.length / BIZ_PAGE);
    if (state.page >= pages) state.page = 0;
    var card = function (b) {
      return PS.bizCardHtml(b, { km: b._km, categoryName: categoryNames[b.category_id], active: isSel('biz', b.id) });
    };
    if (pages <= 1) {
      sec.innerHTML = title + '<div class="bizgrid">' + ordered.map(card).join('') + '</div>';
      return;
    }
    // 여러 쪽: 한 쪽에 BIZ_PAGE 개씩 좌우 슬라이드
    var slides = '';
    for (var i = 0; i < pages; i++) slides += '<div class="bizgrid">' + ordered.slice(i * BIZ_PAGE, i * BIZ_PAGE + BIZ_PAGE).map(card).join('') + '</div>';
    var dots = '';
    for (var d = 0; d < pages; d++) dots += '<button type="button" data-p="' + d + '" aria-label="' + (d + 1) + '번째 쪽"></button>';
    sec.innerHTML = title + '<div class="bizslider" id="bizSlider">' + slides + '</div><div class="bizdots" id="bizDots">' + dots + '</div>';
    startBizSlider(pages);
  }

  // 업체 슬라이드: 3초마다 다음 쪽으로. 마우스를 올리거나 손으로 넘기는 동안은 멈춤
  var bizTimer = null, bizHold = false;
  function startBizSlider(pages) {
    var slider = $('bizSlider'), dotsEl = $('bizDots');
    var leftOf = function (p) { return slider.children[p].offsetLeft - slider.children[0].offsetLeft; };
    var mark = function () {
      Array.prototype.forEach.call(dotsEl.children, function (b, i) { b.classList.toggle('on', i === state.page); });
    };
    var goTo = function (p, smooth) {
      state.page = (p + pages) % pages;
      slider.scrollTo({ left: leftOf(state.page), behavior: smooth ? 'smooth' : 'auto' });
      mark();
    };
    goTo(state.page, false);
    // 손으로 넘겼을 때: 가장 가까운 쪽을 현재 쪽으로
    var st = null;
    slider.addEventListener('scroll', function () {
      clearTimeout(st);
      st = setTimeout(function () {
        var best = 0;
        for (var i = 1; i < pages; i++) if (Math.abs(leftOf(i) - slider.scrollLeft) < Math.abs(leftOf(best) - slider.scrollLeft)) best = i;
        state.page = best;
        mark();
      }, 120);
    });
    dotsEl.addEventListener('click', function (e) {
      var b = e.target.closest('[data-p]');
      if (b) goTo(Number(b.dataset.p), true);
    });
    var hold = function () { bizHold = true; }, release = function () { bizHold = false; };
    slider.addEventListener('pointerenter', hold);
    slider.addEventListener('pointerleave', release);
    slider.addEventListener('touchstart', hold, { passive: true });
    slider.addEventListener('touchend', function () { setTimeout(release, 3000); }, { passive: true });
    bizHold = false;
    clearInterval(bizTimer);
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; // 움직임 줄이기 설정이면 자동 넘김 없음
    bizTimer = setInterval(function () {
      if (!document.body.contains(slider)) { clearInterval(bizTimer); return; }
      if (bizHold || document.hidden) return;
      goTo(state.page + 1, true);
    }, 3000);
  }

  function renderProducts(rows, searching) {
    var label = state.cat || (state.q ? '"' + state.q + '"' : '근처 물건');
    $('countLabel').textContent = label + ' ' + rows.length + '개';
    $('list').innerHTML = rows.length
      ? rows.map(function (p) {
          var html = PS.rowHtml(p).replace('<a class="row"', '<a class="row' + (isSel('prod', p.id) ? ' hl' : '') + '" data-id="' + PS.esc(p.id) + '"');
          // 추천순에서 프리미엄 업체가 고른 물건은 '추천' 표시
          return state.sort === 'rec' && featured[p.id] ? html.replace('<div class="t">', '<div class="t"><span class="badge pick">추천</span>') : html;
        }).join('')
      : '<div class="empty" style="padding:32px 0">' + PS.sticker('curious', 100) + '<b>' + (all.length ? '찾는 물건이 없어요' : '아직 올라온 물건이 없어요') + '</b>' +
        (all.length ? '다른 분류나 검색어로 찾아보세요' : '첫 번째로 판매해 보세요!') + '</div>';
  }

  // 물건 정렬: 추천순(기본) · 인기순 · 가까운순
  //   추천순: 프리미엄 업체가 고른 추천 물건(업체당 최대 4개)이 맨 앞, 나머지는 추천 점수순
  //   인기순: 조회 많은 순      가까운순: 현재 위치(GPS)에서 가까운 순
  function recScore(p) {
    // 찜·문의·조회 + 새로 올라온 물건(2주 안) + 가까운 물건(30km 안)을 함께 반영
    var days = (Date.now() - new Date(p.created_at).getTime()) / 86400000;
    return (p.like_count || 0) * 3 + (p.inquiry_count || 0) * 2 + (p.view_count || 0) * 0.2 +
      Math.max(0, 14 - days) * 1.5 + (p._km == null ? 0 : Math.max(0, 30 - p._km) * 0.3);
  }
  function sortRows(rows) {
    var newer = function (a, b) { return new Date(b.created_at) - new Date(a.created_at); };
    if (state.sort === 'near') return rows.sort(function (a, b) { return (a._km == null ? 9999 : a._km) - (b._km == null ? 9999 : b._km); });
    if (state.sort === 'pop') return rows.sort(function (a, b) { return (b.view_count || 0) - (a.view_count || 0) || newer(a, b); });
    return rows.sort(function (a, b) {
      return (featured[b.id] ? 1 : 0) - (featured[a.id] ? 1 : 0) || recScore(b) - recScore(a) || newer(a, b);
    });
  }
  $('sorts').addEventListener('click', function (e) {
    var b = e.target.closest('[data-s]');
    if (!b || b.dataset.s === state.sort) return;
    state.sort = b.dataset.s;
    Array.prototype.forEach.call($('sorts').children, function (x) {
      x.classList.toggle('on', x === b);
      x.setAttribute('aria-selected', String(x === b));
    });
    render(false);
    if (state.sort === 'near' && !gpsOk) locateMe(false); // 가까운순은 현재 위치 기준: 아직 못 찾았으면 지금 찾음
  });

  var lastRows = [], lastBiz = [];
  var featured = {};   // 프리미엄 업체가 고른 추천 물건 { productId: 1 }
  var gpsOk = false;   // 현재 위치(GPS)를 찾았는지
  function render(refit) {
    var rows = sortRows(withKm(filtered()));
    var biz = withKm(filteredBiz());
    var searching = !!state.q;
    lastRows = rows; lastBiz = biz;

    // 검색 중이면 [물건 | 업체] 탭, 아니면 업체 피드 → 물건 목록
    if (searching) {
      $('segWrap').innerHTML = '<div class="seg" role="tablist">' +
        '<button type="button" data-t="prod" class="' + (state.tab === 'prod' ? 'on' : '') + '">물건 ' + rows.length + '</button>' +
        '<button type="button" data-t="biz" class="' + (state.tab === 'biz' ? 'on' : '') + '">업체 ' + biz.length + '</button></div>';
      $('bizSec').hidden = state.tab !== 'biz';
      $('prodSec').hidden = state.tab !== 'prod';
    } else {
      $('segWrap').innerHTML = '';
      $('bizSec').hidden = false;
      $('prodSec').hidden = false;
    }
    renderBiz(biz, searching);
    if (!searching) $('bizSec').insertAdjacentHTML('beforeend', '<div class="divider"></div>');
    renderProducts(rows, searching);
    drawPins(refit);
  }

  function drawPins(refit) {
    if (!map) return;
    // 지도에는 업체와 판매자 위치만 (물건 하나하나는 아래 목록에서)
    var shown = {};
    lastRows.forEach(function (p) { shown[p.seller_profile_id] = 1; });
    var sellerPins = sellers.filter(function (x) { return x._plat != null && shown[x.id]; }).map(function (x) {
      return { id: 's:' + x.id, lat: x._plat, lng: x._plng, label: (x.name.length > 6 ? x.name.slice(0, 6) + '…' : x.name) + ' · ' + x.count + '개' };
    });
    var pins = sellerPins.concat(lastBiz.filter(function (b) { return b._plat != null; }).map(function (b) {
      return { id: 'b:' + b.id, kind: 'biz', lat: b._plat, lng: b._plng, label: b.name.length > 8 ? b.name.slice(0, 8) + '…' : b.name, active: isSel('biz', b.id) };
    }));
    map.setMarkers(pins, onPin);
    if (refit && pins.length) map.fit(pins);
  }

  function onPin(pinId) {
    if (pinId.slice(0, 2) === 's:') { location.href = PS.profileUrl(pinId.slice(2)); return; } // 판매자 → 판매자 프로필(판매 물건)
    var kind = pinId.slice(0, 1) === 'b' ? 'biz' : 'prod';
    var id = pinId.slice(2);
    state.selected = { kind: kind, id: id };
    if (state.q) state.tab = kind;
    if (kind === 'biz' && !state.q) {
      // 그 업체가 있는 페이지로
      var ordered = feedOrder(lastBiz);
      var idx = ordered.findIndex(function (b) { return b.id === id; });
      if (idx >= 0) state.page = Math.floor(idx / BIZ_PAGE);
    }
    render(false);
    if (sheetState === 'peek') setSheet('half');
    var el = kind === 'biz' ? $('bizSec').querySelector('[data-biz="' + CSS.escape(id) + '"]') : $('list').querySelector('[data-id="' + CSS.escape(id) + '"]');
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  $('segWrap').addEventListener('click', function (e) {
    var b = e.target.closest('[data-t]');
    if (!b) return;
    state.tab = b.dataset.t;
    render(false);
  });

  // PC: 돋보기 버튼으로 지도 크게 보기, Esc·X·바깥 누르면 원래 크기로
  function setMapBig(on) {
    var c = map ? map.center() : null; // 보던 곳이 커진·줄어든 지도에서도 가운데에 오게
    document.body.classList.toggle('map-big', on);
    requestAnimationFrame(function () { if (!map) return; map.relayout(); map.panTo(c.lat, c.lng); });
  }
  $('mapZoom').addEventListener('click', function () { setMapBig(true); });
  $('mapClose').addEventListener('click', function () { setMapBig(false); });
  $('mapBg').addEventListener('click', function () { setMapBig(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.body.classList.contains('map-big')) setMapBig(false);
  });

  // + 버튼: 물건 팔기 / 업체 소개하기
  $('addBtn').addEventListener('click', function () { $('addSheet').classList.add('show'); $('addBg').classList.add('show'); });
  $('addBg').addEventListener('click', function () { $('addSheet').classList.remove('show'); $('addBg').classList.remove('show'); });

  // ---------- 데이터 ----------
  async function loadProducts() {
    var cols = PS.PRODUCT_LIST_COLUMNS + ',brand,category_id,seller_profile_id';
    var res = await sb.from('products').select(cols + ',lat,lng').in('status', ['selling', 'reserved'])
      .order('created_at', { ascending: false }).limit(300);
    if (res.error) {
      // 좌표 컬럼이 아직 없을 때(마이그레이션 전)도 목록은 보이게
      res = await sb.from('products').select(cols).in('status', ['selling', 'reserved'])
        .order('created_at', { ascending: false }).limit(300);
    }
    all = res.data || [];
  }

  async function loadBusinesses() {
    var res = await sb.from('businesses').select(PS.BIZ_COLUMNS + ',description').eq('status', 'active')
      .order('bumped_at', { ascending: false }).limit(200);
    bizAll = res.error ? [] : (res.data || []);
    // 프리미엄(월 정기결제) 업체 표시. 컬럼이 아직 없으면(준비 전) 아무도 프리미엄이 아닌 것으로
    var pr = await sb.from('businesses').select('id').eq('status', 'active').gt('premium_until', new Date().toISOString());
    var prem = {};
    if (!pr.error) (pr.data || []).forEach(function (x) { prem[x.id] = 1; });
    bizAll.forEach(function (b) { b._premium = !!prem[b.id]; });
    // 프리미엄 업체가 고른 추천 물건 (추천순 맨 앞). 표가 아직 없으면 없는 것으로
    featured = {};
    var premIds = Object.keys(prem);
    if (premIds.length) {
      var fr = await sb.from('biz_featured').select('product_id').in('business_id', premIds);
      if (!fr.error) (fr.data || []).forEach(function (x) { featured[x.product_id] = 1; });
    }
  }

  async function placePins() {
    // 좌표 없는 물건은 지역 이름으로 동네 중심을 찾는다
    for (var i = 0; i < all.length; i++) {
      var p = all[i];
      if (p.lat == null && p.region) {
        var pos = await PS.geocodeRegion(adapter, p.region);
        if (pos) { p.lat = pos.lat; p.lng = pos.lng; }
      }
    }
    for (var j = 0; j < bizAll.length; j++) {
      var b = bizAll[j];
      if (b.lat == null && b.region) {
        var bp = await PS.geocodeRegion(adapter, b.region);
        if (bp) { b.lat = bp.lat; b.lng = bp.lng; }
      }
    }
    // 판매자 핀: 판매자마다 하나 (업체 소개가 있는 판매자는 업체 핀으로 대신)
    var owners = {};
    bizAll.forEach(function (b) { owners[b.owner_id] = 1; });
    var bySeller = {};
    all.forEach(function (p) {
      if (!p.seller_profile_id || owners[p.seller_profile_id] || p.lat == null) return;
      (bySeller[p.seller_profile_id] = bySeller[p.seller_profile_id] || { id: p.seller_profile_id, lat: p.lat, lng: p.lng, count: 0 }).count++;
    });
    sellers = Object.keys(bySeller).map(function (k) { return bySeller[k]; });
    if (sellers.length) {
      var names = await PS.publicProfiles(sellers.map(function (x) { return x.id; }));
      sellers.forEach(function (x) { x.name = (names[x.id] && names[x.id].name) || '판매자'; });
    }
    var withPos = bizAll.filter(function (b) { return b.lat != null; }).concat(sellers); // 지도 핀: 업체 + 판매자
    var spread = PS.spreadPins(withPos.map(function (p) { return { id: p.id, lat: p.lat, lng: p.lng }; }));
    spread.forEach(function (s, i) { withPos[i]._plat = s.lat; withPos[i]._plng = s.lng; });
  }

  function locateMe(silent) {
    if (!navigator.geolocation) { if (!silent) PS.toast('이 기기에서는 위치를 찾을 수 없어요'); return; }
    navigator.geolocation.getCurrentPosition(function (pos) {
      origin = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      gpsOk = true;
      if (map) { map.showMe(origin.lat, origin.lng); map.panTo(origin.lat, origin.lng); }
      render(false);
    }, function () {
      if (!silent) PS.toast('위치 권한을 허용하면 가까운 물건부터 보여드려요');
    }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
  }
  $('locBtn').addEventListener('click', function () { locateMe(false); });

  (async function init() {
    sheet.classList.add('dragging'); // 처음엔 애니메이션 없이 바로 자리 잡기
    setSheet('half'); // 처음엔 한 단계 올린 상태(지도 + 분류 + 목록 시작)
    sheet.offsetHeight;
    sheet.classList.remove('dragging');
    var catRes = await sb.from('categories').select('id,name').is('parent_id', null);
    (catRes.data || []).forEach(function (c) { categoryIds[c.name] = c.id; categoryNames[c.id] = c.name; });
    await Promise.all([loadProducts(), loadBusinesses()]);
    render(false);
    if (state.q || state.cat) setSheet('half'); // 검색어·분류를 들고 들어오면 결과가 보이게

    try {
      adapter = await PS.loadMap();
      var home = PS.getHome();
      if (home && home.lat != null) origin = { lat: home.lat, lng: home.lng };
      map = adapter.create($('map'), origin || PS.DEFAULT_CENTER);
      $('mapMsg').hidden = true;
      await placePins();
      render(true);
      var t = null;
      map.onMove(function () {
        if (origin) return;
        clearTimeout(t);
        t = setTimeout(function () { render(false); }, 400);
      });
    } catch (e) {
      console.error('[판다산다] 지도를 불러오지 못했어요', e);
      $('mapMsg').textContent = '지도를 불러오지 못했어요. 아래 목록에서 골라 주세요';
      setSheet('half');
    }
  })();
})();
</script>
</body>
