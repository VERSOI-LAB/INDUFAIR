<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERSOI 중고 시세</title>
<meta name="description" content="주요 산업 설비류 중고 시세 정보를 제공하는 VERSOI 중고 시세 게시판">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .board-search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:var(--surface);}
  .board-search svg{color:var(--text-tertiary);flex-shrink:0;}
  .board-search input{border:none;background:none;padding:11px 0;font-size:.88rem;color:var(--text);font-family:inherit;width:100%;}
  .board-search input:focus{outline:none;}
  .board-toolbar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}

  .price-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);box-shadow:var(--shadow-1);
    padding:18px 20px;margin-top:14px;display:flex;align-items:center;gap:16px;
  }
  .price-card-thumb{width:56px;height:56px;border-radius:9px;background:var(--bg-soft);color:var(--text-tertiary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .price-card-brand{font-family:var(--font-en);font-weight:800;font-size:.76rem;color:var(--text-tertiary);}
  .price-card-name{font-size:.94rem;font-weight:700;margin:3px 0;}
  .price-card-cat{font-size:.78rem;color:var(--text-tertiary);}
  .price-card-range{margin-left:auto;text-align:right;flex-shrink:0;}
  .price-card-range .range{font-family:var(--font-en);font-weight:800;font-size:1rem;color:var(--accent);}
  .price-card-range .avg{font-size:.76rem;color:var(--text-tertiary);margin-top:3px;}
  @media (max-width:480px){
    .price-card{flex-wrap:wrap;}
    .price-card-range{margin-left:72px;text-align:left;margin-top:10px;}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html" aria-label="VERSOI 홈으로 이동">
      <span class="logo-mark">V</span><span class="logo-text">VERSOI</span>
      <span class="logo-tag">INDUSTRIAL CIRCULATION<br>PLATFORM</span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="index.html">홈</a><a href="goods.html">산업용품</a><a href="used.html">중고장터</a>
      <a href="brand.html">브랜드관</a><a href="rfq.html">견적요청(RFQ)</a><a href="community.html" class="active">커뮤니티</a><a href="support.html">고객센터</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" aria-label="검색"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      <button class="icon-btn" aria-label="알림"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="icon-count">5</span></button>
      <a href="cart.html" class="icon-btn" aria-label="장바구니"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="icon-count">2</span></a>
      <button class="btn btn-ghost">로그인</button>
      <button class="btn btn-primary">회원가입</button>
      <button class="icon-btn nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </div>
</header>

<main>
  <div class="wrap page-layout">
    <aside>
      <div class="page-title-block" style="padding-top:26px;">
        <h1>중고 시세</h1>
        <p>주요 산업 설비류 중고 시세 정보를<br>확인하세요.</p>
      </div>
      <div class="side-panel">
        <nav class="side-nav" id="priceCatNav">
          <a href="#" class="active" data-cat="">전체 카테고리</a>
        </nav>
      </div>
    </aside>

    <div>
      <h1 style="font-size:1.5rem;font-weight:900;">중고 시세</h1>
      <p style="margin-top:8px;font-size:.9rem;color:var(--text-secondary);">실시간 중고 시세 정보를 제공합니다.</p>

      <div class="board-toolbar">
        <form class="board-search" id="priceSearchForm">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="priceSearchInput" placeholder="제품명, 모델명을 입력하세요">
        </form>
        <div class="select-field" id="priceCatSelectLabel">전체 카테고리 <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></div>
      </div>

      <h2 style="font-size:1.05rem;font-weight:800;margin-top:24px;">인기 제품 시세</h2>

      <div id="priceCardList">
        <p style="padding:40px 0;text-align:center;color:var(--text-tertiary);">불러오는 중...</p>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>&copy; 2026 VERSOI. 산업 자원의 순환을 연결하다.</p>
    <div class="footer-links"><a href="terms.html">이용약관</a><a href="privacy.html">개인정보처리방침</a><a href="business-info.html">사업자정보확인</a><a href="seller-apply.html">제휴/입점문의</a></div>
  </div>
</footer>

<script>
  var navToggle = document.getElementById('navToggle');
  var mainNav = document.getElementById('mainNav');
  navToggle.addEventListener('click', function(){
    var open = mainNav.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  var CAT_ICONS = {
    1: '<rect x="4" y="5" width="16" height="14" rx="1.5"/><line x1="8" y1="9" x2="8" y2="15"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="16" y1="9" x2="16" y2="15"/>',
    2: '<rect x="5" y="4" width="14" height="16" rx="2"/><rect x="8" y="7" width="8" height="5" rx="1"/>',
    3: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4"/>',
    4: '<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>',
    5: '<rect x="4" y="9" width="10" height="6" rx="1"/><path d="M14 11h4a2 2 0 0 1 2 2v2h-6"/>',
    9: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/>',
    7: '<rect x="3" y="5" width="14" height="10" rx="1.5"/><circle cx="18" cy="17" r="3"/>'
  };
  var DEFAULT_ICON = '<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';

  var allCategories = [];
  var rows = [];
  var state = { category: '', q: '' };

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtWon(n) { return '₩' + Number(n || 0).toLocaleString('ko-KR'); }

  async function loadCategories() {
    var res = await sb.from('categories').select('id,name').not('parent_id', 'is', null).order('sort_order');
    allCategories = res.data || [];
    var icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>';
    var nav = document.getElementById('priceCatNav');
    nav.innerHTML = '<a href="#" data-cat="">' + icon + '전체 카테고리</a>' +
      allCategories.map(function (c) { return '<a href="#" data-cat="' + c.id + '">' + icon + esc(c.name) + '</a>'; }).join('');
    syncCatUI();
  }

  function syncCatUI() {
    document.querySelectorAll('#priceCatNav a').forEach(function (a) {
      a.classList.toggle('active', (a.getAttribute('data-cat') || '') === String(state.category));
    });
    var label = state.category ? (allCategories.find(function (c) { return String(c.id) === String(state.category); }) || {}).name : '전체 카테고리';
    document.getElementById('priceCatSelectLabel').innerHTML = esc(label || '전체 카테고리') + ' <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>';
  }

  async function loadPrices() {
    var q = sb.from('price_references').select('*, categories(id,name)').order('sample_count', { ascending: false });
    if (state.category) q = q.eq('category_id', state.category);
    if (state.q) q = q.or('model_no.ilike.%' + state.q + '%,manufacturer.ilike.%' + state.q + '%');
    var res = await q;
    rows = res.data || [];
    render();
  }

  function render() {
    var wrap = document.getElementById('priceCardList');
    if (!rows.length) { wrap.innerHTML = '<p style="padding:40px 0;text-align:center;color:var(--text-tertiary);">조건에 맞는 시세 정보가 없습니다.</p>'; return; }
    wrap.innerHTML = rows.map(function (p) {
      var icon = CAT_ICONS[p.category_id] || DEFAULT_ICON;
      var catName = p.categories ? p.categories.name : '';
      return '<div class="price-card">' +
        '<span class="price-card-thumb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' + icon + '</svg></span>' +
        '<div>' +
        '<div class="price-card-brand">' + esc(p.manufacturer) + '</div>' +
        '<div class="price-card-name">' + esc(p.model_no) + '</div>' +
        '<div class="price-card-cat">' + esc(catName) + '</div>' +
        '</div>' +
        '<div class="price-card-range">' +
        '<div class="range tabular">' + fmtWon(p.price_min) + ' ~ ' + fmtWon(p.price_max) + '</div>' +
        '<div class="avg">평균 시세 <b class="tabular" style="color:var(--text);">' + fmtWon(p.price_avg) + '</b> · 거래 ' + (p.sample_count || 0) + '건</div>' +
        '</div>' +
        '</div>';
    }).join('');
  }

  document.getElementById('priceCatNav').addEventListener('click', function (e) {
    var a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    state.category = a.getAttribute('data-cat') || '';
    syncCatUI();
    loadPrices();
  });

  document.getElementById('priceSearchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    state.q = document.getElementById('priceSearchInput').value.trim();
    loadPrices();
  });

  document.addEventListener('versoi:ready', async function () {
    await loadCategories();
    await loadPrices();
  });
})();
</script>
</body>
</html>
