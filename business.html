<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>동네 업체 - 판다산다</title>
<link rel="icon" href="/이미지/web/logo.jpg">
<link rel="stylesheet" href="/app.css">
<style>
  .app{padding-bottom:calc(88px + env(safe-area-inset-bottom));}
  .slider-wrap{position:relative;background:#EEF2F8;}
  .slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:1/1;}
  .slider::-webkit-scrollbar{display:none;}
  .slider img,.slider .noimg{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;}
  .dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:6px;pointer-events:none;}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);}
  .dots i.on{background:#fff;}
  .float-btn{position:absolute;top:calc(10px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2;}
  .float-btn.back{left:10px;}
  .float-btn.more{right:10px;font-size:22px;font-weight:800;letter-spacing:1px;}
  .bname{font-size:24px;font-weight:800;margin-top:20px;line-height:1.3;}
  .bmeta{font-size:14px;color:var(--hint);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .tagline{margin-top:16px;padding:16px 18px;border-radius:16px;background:#EAF2FE;color:#1E3FA8;font-size:18px;font-weight:800;line-height:1.45;}
  .tagline span{font-family:Georgia,serif;font-size:26px;line-height:0;margin-right:4px;vertical-align:-6px;}
  .desc{margin-top:20px;font-size:17px;line-height:1.7;white-space:pre-wrap;}
  .mini{height:180px;border-radius:16px;overflow:hidden;margin-top:24px;background:#EEF0F2;}
  .where{font-size:15px;color:var(--sub);margin-top:8px;}
  .stats{margin:20px 0 8px;font-size:14px;color:var(--hint);}
  .owner{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--line);margin-top:20px;}
  .owner .avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-light);overflow:hidden;flex-shrink:0;}
  .owner .avatar img{width:100%;height:100%;object-fit:cover;}
  .bar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;}
  .heart{width:56px;height:56px;flex-shrink:0;border-radius:14px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .heart .i3d{filter:grayscale(1);opacity:.35;transition:all .2s ease;}
  .heart.on{border-color:#FFD3D0;background:#FFF5F4;}
  .heart.on .i3d{filter:none;opacity:1;transform:scale(1.1);}
  .bar .btn{flex:1;}
  .map-pin{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:16px;background:#2F5BD3;color:#fff;font:700 13px/1 sans-serif;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .map-pin i{font-style:normal;}
  .map-pin-wrap .map-pin{transform:translate(-50%, calc(-100% - 8px));}
  .map-pin-wrap{background:none;border:none;}
</style>
</head>
<body>
<div class="app no-tabbar">
  <div class="slider-wrap">
    <button class="float-btn back" id="backBtn" aria-label="뒤로"><i data-icon="back" data-size="24"></i></button>
    <button class="float-btn more" id="moreBtn" aria-label="더 보기" hidden>⋯</button>
    <div class="slider" id="slider"><div class="skeleton" style="flex:0 0 100%;border-radius:0"></div></div>
    <div class="dots" id="dots"></div>
  </div>
  <main class="page" id="body"></main>
</div>
<div class="bar" id="bar" hidden></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="ownerSheet" role="dialog" aria-label="내 업체 관리">
  <div class="handle"></div>
  <button class="opt" data-a="edit"><i data-icon3d="request" data-size="30"></i>수정하기</button>
  <button class="opt" data-a="bump"><i data-icon3d="chart" data-size="30"></i>끌어올리기 (하루 1번)</button>
  <button class="opt" data-a="delete" style="color:var(--danger)"><i data-icon3d="trash" data-size="30"></i>삭제하기</button>
</div>
<div class="sheet" id="reportSheet" role="dialog" aria-label="신고하기">
  <div class="handle"></div>
  <h2 style="font-size:19px;font-weight:800;padding:4px 4px 8px">이 업체를 신고할까요?</h2>
  <button class="opt" data-r="광고·도배">광고·도배예요</button>
  <button class="opt" data-r="거짓 정보">거짓 정보가 있어요</button>
  <button class="opt" data-r="불법·위험">불법이거나 위험해요</button>
  <button class="opt" data-r="기타">다른 이유예요</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script src="/js/map.js"></script>
<script>
(function () {
  var id = PS.idFromUrl('biz');
  var biz = null, liked = false, mine = false;
  var $ = function (x) { return document.getElementById(x); };

  $('backBtn').addEventListener('click', function () {
    if (history.length > 1 && document.referrer.indexOf(location.host) !== -1) history.back();
    else location.href = '/buy';
  });

  function notFound() {
    $('slider').innerHTML = '<div class="noimg">' + PS.icon3d('home', 120) + '</div>';
    $('body').innerHTML = '<div class="empty">' + PS.sticker('sorry', 120) + '<b>업체를 찾을 수 없어요</b>삭제됐거나 숨겨진 업체예요<div style="margin-top:20px"><a class="btn" href="/buy">다른 업체 보기</a></div></div>';
  }

  async function load() {
    if (!id) return notFound();
    var res = await sb.from('businesses').select('*,categories(name),business_images(url,sort_order)').eq('id', id).maybeSingle();
    if (res.error || !res.data || res.data.status === 'deleted') return notFound();
    biz = res.data;
    document.title = biz.name + ' - 판다산다';
    await PS.ready;
    mine = !!(PS.user && PS.user.id === biz.owner_id);

    var viewKey = 'ps_bviewed_' + id, seen = false;
    try { seen = !!sessionStorage.getItem(viewKey); } catch (e) {}
    if (!seen && !mine) {
      biz.view_count = (biz.view_count || 0) + 1;
      PS.fire(sb.rpc('increment_business_view', { p_business_id: id }));
      try { sessionStorage.setItem(viewKey, '1'); } catch (e) {}
    }

    var owners = await PS.publicProfiles([biz.owner_id]);
    renderSlider();
    renderBody(owners[biz.owner_id] || {});
    renderBar();
    $('moreBtn').hidden = false;
    renderMap();
  }

  function renderSlider() {
    var imgs = (biz.business_images || []).slice().sort(function (a, b) { return a.sort_order - b.sort_order; });
    if (!imgs.length) { $('slider').innerHTML = '<div class="noimg">' + PS.icon3d('home', 120) + '</div>'; return; }
    $('slider').innerHTML = imgs.map(function (im, i) { return '<img src="' + PS.esc(im.url) + '" alt="사진 ' + (i + 1) + '"' + (i ? ' loading="lazy"' : '') + '>'; }).join('');
    if (imgs.length > 1) {
      $('dots').innerHTML = imgs.map(function (_, i) { return '<i class="' + (i ? '' : 'on') + '"></i>'; }).join('');
      $('slider').addEventListener('scroll', function () {
        var idx = Math.round($('slider').scrollLeft / $('slider').clientWidth);
        $('dots').querySelectorAll('i').forEach(function (d, i) { d.classList.toggle('on', i === idx); });
      }, { passive: true });
    }
  }

  function renderBody(owner) {
    var b = biz;
    var home = PS.getHome();
    var km = home && home.lat != null && b.lat != null ? PS.distanceKm(home, b) : null;
    var meta = [b.categories ? b.categories.name : '', b.region, PS.distLabel(km)].filter(Boolean).map(PS.esc).join(' · ');
    $('body').innerHTML =
      '<h1 class="bname">' + PS.esc(b.name) + '</h1>' +
      '<div class="bmeta"><span class="verified">✓ 사업자 인증</span>' + meta + '</div>' +
      (b.status === 'hidden' ? '<div class="err" style="margin-top:12px;padding:12px;border-radius:12px;background:#FFF0EF;color:var(--danger);font-weight:600">신고가 많아 숨겨진 업체예요. 다른 사람에게는 보이지 않아요.</div>' : '') +
      '<div class="tagline"><span>“</span>' + PS.esc(b.tagline) + '</div>' +
      (b.description ? '<div class="desc">' + PS.esc(b.description) + '</div>' : '') +
      (b.lat != null ? '<div class="mini" id="mini"></div>' : '') +
      (b.region ? '<p class="where">📍 ' + PS.esc(b.region) + ' 근처</p>' : '') +
      '<a class="owner" href="' + PS.profileUrl(b.owner_id) + '"><div class="avatar">' + PS.avatarHtml(owner.avatar_url) + '</div>' +
        '<div style="flex:1;min-width:0"><b style="display:block">' + PS.esc(owner.name || '대표') + '</b><span style="font-size:14px;color:var(--sub)">올린 물건 보기 ›</span></div></a>' +
      '<div class="stats">찜 ' + (b.like_count || 0) + ' · 조회 ' + (b.view_count || 0) + ' · ' + PS.ago(b.created_at) + ' 소개</div>';
  }

  async function renderMap() {
    if (biz.lat == null || !$('mini')) return;
    try {
      var adapter = await PS.loadMap();
      var m = adapter.create($('mini'), { lat: biz.lat, lng: biz.lng });
      m.setMarkers([{ id: biz.id, kind: 'biz', lat: biz.lat, lng: biz.lng, label: biz.name }], function () {});
    } catch (e) { $('mini').hidden = true; }
  }

  async function renderBar() {
    var bar = $('bar');
    bar.hidden = false;
    if (mine) {
      bar.innerHTML = '<button class="btn white" id="manageBtn">' + PS.icon3d('request', 26) + ' 내 업체 관리하기</button>';
      $('manageBtn').addEventListener('click', function () { openSheet('ownerSheet'); });
      return;
    }
    if (PS.user) {
      var f = await sb.from('business_likes').select('id').eq('business_id', id).eq('profile_id', PS.user.id).maybeSingle();
      liked = !!f.data;
    }
    bar.innerHTML =
      '<button class="heart' + (liked ? ' on' : '') + '" id="heartBtn" aria-label="찜하기" aria-pressed="' + liked + '">' + PS.icon3d('heart', 34) + '</button>' +
      (biz.phone ? '<a class="btn white" href="tel:' + PS.esc(biz.phone.replace(/[^0-9+]/g, '')) + '">' + PS.icon('phone', 20) + ' 전화하기</a>' : '') +
      '<button class="btn" id="chatBtn">' + PS.icon3d('chat', 28) + ' 채팅하기</button>';
    $('heartBtn').addEventListener('click', toggleLike);
    $('chatBtn').addEventListener('click', startChat);
  }

  async function toggleLike() {
    if (!PS.requireLogin()) return;
    var btn = $('heartBtn');
    liked = !liked;
    btn.classList.toggle('on', liked);
    btn.setAttribute('aria-pressed', liked);
    var res = liked
      ? await sb.from('business_likes').insert({ profile_id: PS.user.id, business_id: id })
      : await sb.from('business_likes').delete().eq('profile_id', PS.user.id).eq('business_id', id);
    if (res.error && res.error.code !== '23505') { PS.toast('잠시 후 다시 해 주세요'); return; }
    PS.toast(liked ? '찜했어요!' : '찜을 취소했어요');
  }

  async function startChat() {
    if (!PS.requireLogin()) return;
    var btn = $('chatBtn');
    btn.disabled = true;
    var found = await sb.from('chats').select('id').eq('business_id', id).eq('buyer_id', PS.user.id).maybeSingle();
    var chatId = found.data && found.data.id;
    if (!chatId) {
      var ins = await sb.from('chats').insert({ business_id: id, buyer_id: PS.user.id, seller_id: biz.owner_id }).select('id').single();
      if (ins.error) { btn.disabled = false; PS.toast('채팅을 열지 못했어요. 다시 해 주세요'); return; }
      chatId = ins.data.id;
    }
    location.href = '/chat/' + chatId;
  }

  // ---------- 더 보기: 본인은 관리, 남은 신고 ----------
  var bg = $('sheetBg');
  function openSheet(x) { $(x).classList.add('show'); bg.classList.add('show'); }
  function closeSheets() { document.querySelectorAll('.sheet').forEach(function (s) { s.classList.remove('show'); }); bg.classList.remove('show'); }
  bg.addEventListener('click', closeSheets);
  $('moreBtn').addEventListener('click', function () {
    if (mine) return openSheet('ownerSheet');
    if (!PS.requireLogin()) return;
    openSheet('reportSheet');
  });

  $('ownerSheet').addEventListener('click', async function (e) {
    var o = e.target.closest('.opt');
    if (!o) return;
    closeSheets();
    if (o.dataset.a === 'edit') { location.href = '/biz/new?id=' + encodeURIComponent(id); return; }
    if (o.dataset.a === 'bump') {
      var r = await sb.rpc('bump_business', { p_business_id: id });
      PS.toast(r.data === 'ok' ? '맨 위로 끌어올렸어요!' : r.data === 'too_soon' ? '끌어올리기는 하루에 한 번만 할 수 있어요' : '끌어올리지 못했어요');
      return;
    }
    if (o.dataset.a === 'delete') {
      if (!confirm('정말 삭제할까요?')) return;
      var d = await sb.from('businesses').update({ status: 'deleted' }).eq('id', id);
      if (d.error) { PS.toast('삭제하지 못했어요'); return; }
      location.href = '/my-biz';
    }
  });

  $('reportSheet').addEventListener('click', async function (e) {
    var o = e.target.closest('.opt');
    if (!o) return;
    closeSheets();
    var r = await sb.from('business_reports').insert({ reporter_id: PS.user.id, business_id: id, reason: o.dataset.r });
    if (r.error && r.error.code === '23505') { PS.toast('이미 신고한 업체예요'); return; }
    if (r.error) { PS.toast('신고하지 못했어요'); return; }
    PS.toast('신고했어요. 확인 후 조치할게요');
  });

  load();
})();
</script>
</body>
</html>
