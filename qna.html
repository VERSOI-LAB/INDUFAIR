<style>
  .board-toolbar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .board-search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:var(--surface);}
  .board-search svg{color:var(--text-tertiary);flex-shrink:0;}
  .board-search input{border:none;background:none;padding:11px 0;font-size:.88rem;color:var(--text);font-family:inherit;width:100%;}
  .board-search input:focus{outline:none;}
  .board-tabs{display:flex;gap:18px;border-bottom:1px solid var(--border);margin-top:20px;}
  .board-tabs button{padding:4px 2px 12px;font-size:.9rem;font-weight:700;color:var(--text-tertiary);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s ease;}
  .board-tabs button.active{color:var(--text);border-bottom-color:var(--accent);}

  .qna-row{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--border);}
  .qna-row:last-child{border-bottom:none;}
  .qna-icon{width:36px;height:36px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .qna-main{flex:1;min-width:0;}
  .qna-row .q-title{font-size:.92rem;font-weight:700;line-height:1.4;}
  .qna-row .q-title:hover{color:var(--accent);}
  .qna-row .q-meta{font-size:.76rem;color:var(--text-tertiary);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}
  .status-tag2{font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:20px;flex-shrink:0;white-space:nowrap;}
  .status-tag2.done{background:var(--good-soft);color:var(--good);}
  .status-tag2.wait{background:var(--warn-soft);color:var(--warn);}
</style>

      <a href="cart.html" class="icon-btn" aria-label="장바구니"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="icon-count">2</span></a>
      <button class="btn btn-ghost">로그인</button>

<main>

      <div class="side-panel">

          <a href="#" onclick="alert('준비 중인 기능입니다.');return false;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>즐겨찾기</a>
        </nav>
      </div>
    </aside>

    <div>
      <h1 style="font-size:1.5rem;font-weight:900;">기술 Q&amp;A</h1>
      <p style="margin-top:8px;font-size:.9rem;color:var(--text-secondary);">궁금한 기술 정보를 질문하고 전문가의 답변을 받아보세요.</p>

      <div class="board-toolbar">
        <form class="board-search" id="qnaSearchForm" style="flex:1;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="qnaSearchInput" placeholder="질문 제목, 키워드를 입력하세요">

      <div class="board-tabs" id="qnaTabs">

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);box-shadow:var(--shadow-1);padding:6px 20px;margin-top:16px;" id="qnaRows">

<script>
  var navToggle = document.getElementById('navToggle');
  var mainNav = document.getElementById('mainNav');
  navToggle.addEventListener('click', function(){
    var open = mainNav.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  var BOARD_TYPE = 'qna';
  var ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
  var posts = [];
  var commentCounts = {};
  var currentTab = 'latest';
  var searchQ = '';

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    return iso.slice(0, 10).replace(/-/g, '.');
  }

  async function loadPosts() {
    var res = await sb.from('community_posts')
      .select('id,title,view_count,created_at')
      .eq('board_type', BOARD_TYPE)
      .order('created_at', { ascending: false });
    posts = res.data || [];
    commentCounts = {};
    var ids = posts.map(function (p) { return p.id; });
    if (ids.length) {
      var cRes = await sb.from('community_comments').select('post_id').in('post_id', ids);
      (cRes.data || []).forEach(function (c) { commentCounts[c.post_id] = (commentCounts[c.post_id] || 0) + 1; });
    }
    render();
  }

  function filtered() {
    var list = posts.slice();
    if (currentTab === 'popular') list.sort(function (a, b) { return (b.view_count || 0) - (a.view_count || 0); });
    if (searchQ) list = list.filter(function (p) { return p.title.toLowerCase().indexOf(searchQ.toLowerCase()) !== -1; });
    return list;
  }

  function render() {
    var wrap = document.getElementById('qnaRows');
    var list = filtered();
    if (!list.length) { wrap.innerHTML = '<p style="padding:24px 0;text-align:center;color:var(--text-tertiary);">등록된 질문이 없습니다.</p>'; return; }
    wrap.innerHTML = list.map(function (p) {
      var answered = (commentCounts[p.id] || 0) > 0;
      var statusBadge = answered ? '<span class="status-tag2 done">답변완료</span>' : '<span class="status-tag2 wait">답변대기</span>';
      return '<div class="qna-row">' +
        '<span class="qna-icon">' + ICON + '</span>' +
        '<div class="qna-main">' +
        '<a href="community.html?board=qna&post=' + p.id + '" class="q-title">' + escapeHtml(p.title) + '</a>' +
        '<div class="q-meta"><span>답변 <b class="tabular">' + (commentCounts[p.id] || 0) + '</b></span><span>조회 <b class="tabular">' + (p.view_count || 0) + '</b></span><span class="tabular">' + fmtDate(p.created_at) + '</span></div>' +
        '</div>' + statusBadge +
        '</div>';
    }).join('');
  }

  document.getElementById('qnaTabs').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    document.querySelectorAll('#qnaTabs button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentTab = btn.getAttribute('data-tab');
    render();
  });

  document.getElementById('qnaSearchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    searchQ = document.getElementById('qnaSearchInput').value.trim();
    render();
  });

  document.addEventListener('versoi:ready', function () { loadPosts(); });
})();
</script>
</body>
