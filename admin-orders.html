<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-common.js"></script>
<script>
var OF = { orders: [], activeStatus: 'all' };

function sellerNames(o) {
  var names = (o.order_items || []).map(function (oi) { return oi.companies ? oi.companies.name : null; }).filter(Boolean);
  var uniq = names.filter(function (n, i) { return names.indexOf(n) === i; });
  return uniq.length ? uniq.join(', ') : '-';
}

function orderRowHtml(o) {
  return '<tr>' +
    '<td class="num cell-strong">' + AC.esc(o.order_no) + '</td>' +
    '<td>' + AC.esc(o.profiles ? o.profiles.name : '-') + '</td>' +
    '<td>' + AC.esc(sellerNames(o)) + '</td>' +
    '<td class="num">' + AC.won(o.total_amount) + '</td>' +
    '<td class="num">' + AC.dt(o.created_at, true) + '</td>' +
    '<td><span class="badge ' + AC.badgeCls(o.status) + '">' + AC.label(o.status) + '</span></td></tr>';
}

function renderOrders() {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var days = Number(document.getElementById('dateFilter').value);
  var list = OF.orders.filter(function (o) {
    if (OF.activeStatus !== 'all' && o.status !== OF.activeStatus) return false;
    if (days) {
      var cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
      if (new Date(o.created_at) < cutoff) return false;
    }
    if (q && (o.order_no + ' ' + (o.profiles ? o.profiles.name : '')).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  document.getElementById('ordersTbody').innerHTML = list.map(orderRowHtml).join('') ||
    '<tr><td colspan="6" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">주문이 없습니다.</td></tr>';
  document.getElementById('totalCountText').textContent = '총 ' + list.length + '건';
  ['all', 'paid', 'preparing', 'shipping', 'delivered', 'canceled'].forEach(function (s) {
    var n = s === 'all' ? OF.orders.length : OF.orders.filter(function (o) { return o.status === s; }).length;
    document.getElementById('cnt-' + s).textContent = n;
  });
}

async function loadOrders() {
  var res = await sb.from('orders')
    .select('*, profiles:buyer_id(name), order_items(companies(name))')
    .order('created_at', { ascending: false });
  OF.orders = res.data || [];
  renderOrders();
}

document.getElementById('statusTabs').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-status]');
  if (!btn) return;
  document.querySelectorAll('#statusTabs button').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  OF.activeStatus = btn.getAttribute('data-status');
  renderOrders();
});
document.getElementById('searchInput').addEventListener('input', renderOrders);
document.getElementById('dateFilter').addEventListener('change', renderOrders);
document.getElementById('resetFilterBtn').addEventListener('click', function () {
  document.getElementById('searchInput').value = '';
  document.getElementById('dateFilter').value = '0';
  OF.activeStatus = 'all';
  document.querySelectorAll('#statusTabs button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-status') === 'all'); });
  renderOrders();
});

AC.ready(async function (user) {
  document.querySelector('.admin-user .lbl b').textContent = (user.profile ? user.profile.name : user.email) || '관리자';
  document.querySelector('.admin-user .lbl span').textContent = user.email;
  document.querySelector('.admin-user .avatar').textContent = ((user.profile && user.profile.name) || user.email).charAt(0);
  await loadOrders();
});
</script>
