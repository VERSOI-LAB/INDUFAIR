<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
var PGF = { pages: [] };
var PUBLIC_URL = { guide: 'guide.html', 'safe-trade': 'safe-trade.html', policy: 'policy.html' };

function pageCardHtml(p) {
  return '<div class="page-card">' +
    '<div><b>' + AC.esc(p.title) + '</b><span>/' + AC.esc(PUBLIC_URL[p.slug] || p.slug) + ' · 최종 수정 ' + AC.dt(p.updated_at, true) + '</span></div>' +
    '<div class="table-actions">' +
      '<a class="btn btn-ghost btn-sm" href="' + AC.esc(PUBLIC_URL[p.slug] || '#') + '" target="_blank">보기</a>' +
      '<button class="btn btn-primary btn-sm" onclick="openPageEdit(\'' + p.slug + '\')">편집</button>' +
    '</div></div>';
}

async function loadPages() {
  var res = await sb.from('site_pages').select('*').order('slug');
  PGF.pages = res.data || [];
  document.getElementById('pagesList').innerHTML = PGF.pages.map(pageCardHtml).join('') ||
    '<p style="color:var(--text-tertiary);padding:20px 0;">등록된 페이지가 없습니다.</p>';
}

window.openPageEdit = function (slug) {
  var p = PGF.pages.find(function (x) { return x.slug === slug; });
  if (!p) return;
  document.getElementById('pageModalTitle').textContent = p.title + ' 수정';
  document.getElementById('pf-slug').value = p.slug;
  document.getElementById('pf-title').value = p.title;
  document.getElementById('pf-html').value = p.content_html;
  document.getElementById('pageModalOverlay').style.display = 'flex';
};
function closePageModal() { document.getElementById('pageModalOverlay').style.display = 'none'; }
document.getElementById('pageModalClose').addEventListener('click', closePageModal);
document.getElementById('pageModalCancel').addEventListener('click', closePageModal);
document.getElementById('pageForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var slug = document.getElementById('pf-slug').value;
  var res = await sb.from('site_pages').update({
    title: document.getElementById('pf-title').value.trim(),
    content_html: document.getElementById('pf-html').value,
    updated_at: new Date().toISOString()
  }).eq('slug', slug);
  if (res.error) { alert('저장에 실패했습니다: ' + res.error.message); return; }
  closePageModal();
  await loadPages();
});

AC.ready(async function (user) {
  document.querySelector('.admin-user .lbl b').textContent = (user.profile ? user.profile.name : user.email) || '관리자';
  document.querySelector('.admin-user .lbl span').textContent = user.email;
  document.querySelector('.admin-user .avatar').textContent = ((user.profile && user.profile.name) || user.email).charAt(0);
  await loadPages();
});
</script>
