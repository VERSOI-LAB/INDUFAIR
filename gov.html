<style>
  .board-toolbar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .board-search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:var(--surface);}
  .board-search svg{color:var(--text-tertiary);flex-shrink:0;}
  .board-search input{border:none;background:none;padding:11px 0;font-size:.88rem;color:var(--text);font-family:inherit;width:100%;}
  .board-search input:focus{outline:none;}
  .board-tabs{display:flex;gap:18px;border-bottom:1px solid var(--border);margin-top:20px;margin-bottom:2px;}
  .board-tabs button{padding:4px 2px 12px;font-size:.9rem;font-weight:700;color:var(--text-tertiary);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s ease;}
  .board-tabs button.active{color:var(--text);border-bottom-color:var(--accent);}

  .gov-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);box-shadow:var(--shadow-1);padding:20px 22px;margin-top:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .gov-tag{font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:20px;flex-shrink:0;}
  .gov-tag.new{background:var(--accent-soft);color:var(--accent);}
  .gov-tag.urgent{background:var(--warn-soft);color:var(--warn);}
  .gov-tag.open{background:var(--good-soft);color:var(--good);}
  .gov-main{flex:1;min-width:220px;}
  .gov-title{font-size:.96rem;font-weight:700;margin-top:8px;}
  .gov-title:hover{color:var(--accent);}
  .gov-org{font-size:.78rem;color:var(--text-tertiary);margin-top:4px;}
  .gov-meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;font-size:.78rem;color:var(--text-tertiary);}
  .gov-meta b{color:var(--text-secondary);font-weight:700;}
</style>

        <button type="button" class="btn btn-primary" style="width:100%;justify-content:center;" onclick="alert('맞춤 지원사업 추천 기능은 준비 중입니다.');">맞춤 설정하기</button>
      </div>
    </aside>

    <div>
      <h1 style="font-size:1.5rem;font-weight:900;">정부 지원사업</h1>

      <div class="board-toolbar">
        <form class="board-search" id="govSearchForm" style="flex:1;">

<script>
  var navToggle = document.getElementById('navToggle');
  var mainNav = document.getElementById('mainNav');
  navToggle.addEventListener('click', function(){
    var open = mainNav.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  // NOTE: community_posts has no deadline/subsidy-amount columns, so the tabs below are an
  // approximation over available fields (created_at / author) rather than real 접수기간 data.
  var BOARD_TYPE = 'gov';
  var TAG_META = {
    new: { cls: 'new', label: '신규모집' },
    open: { cls: 'open', label: '접수중' },
    urgent: { cls: 'urgent', label: '마감임박' }
  };
  var posts = [];
  var currentTab = 'new';
  var searchQ = '';

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    return iso.slice(0, 10).replace(/-/g, '.');
  }

  async function loadPosts() {
    var res = await sb.from('community_posts')
      .select('id,title,content,created_at,profiles(name)')
      .eq('board_type', BOARD_TYPE)
      .order('created_at', { ascending: false });
    posts = res.data || [];
    render();
  }

  function filtered() {
    var list = posts.slice();
    if (currentTab === 'urgent') list.reverse(); // proxy for "been open longest / closing soon"
    if (searchQ) list = list.filter(function (p) { return p.title.toLowerCase().indexOf(searchQ.toLowerCase()) !== -1; });
    return list;
  }

  function render() {
    var wrap = document.getElementById('govCards');
    var list = filtered();
    if (!list.length) { wrap.innerHTML = '<p style="padding:24px 0;text-align:center;color:var(--text-tertiary);">등록된 지원사업이 없습니다.</p>'; return; }
    var tag = TAG_META[currentTab];
    wrap.innerHTML = list.map(function (p) {
      var org = p.profiles && p.profiles.name ? p.profiles.name : 'VERSOI';
      var desc = (p.content || '').slice(0, 60);
      return '<div class="gov-card">' +
        '<span class="gov-tag ' + tag.cls + '">' + tag.label + '</span>' +
        '<div class="gov-main">' +
        '<a href="community.html?board=gov&post=' + p.id + '" class="gov-title" style="display:block;">' + escapeHtml(p.title) + '</a>' +
        '<div class="gov-org">' + escapeHtml(org) + '</div>' +
        '<div class="gov-meta"><span>등록일 <b class="tabular">' + fmtDate(p.created_at) + '</b></span><span>' + escapeHtml(desc) + '</span></div>' +
        '</div>' +
        '<a href="community.html?board=gov&post=' + p.id + '" class="btn btn-outline btn-sm">지원사업 보기</a>' +
        '</div>';
    }).join('');
  }

  document.getElementById('govTabs').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    document.querySelectorAll('#govTabs button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentTab = btn.getAttribute('data-tab');
    render();
  });

  document.getElementById('govSearchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    searchQ = document.getElementById('govSearchInput').value.trim();
    render();
  });

  document.addEventListener('versoi:ready', function () { loadPosts(); });
})();
</script>
</body>
