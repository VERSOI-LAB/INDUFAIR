<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-common.js"></script>
<script>
var PF = { products: [], activeStatus: 'all' };

var MARKET_LABEL = { new: '신품', used: '중고' };
var CONDITION_LABEL = { new: '신품', like_new: '거의 새 것', used: '중고', damaged: '파손/하자' };
var TRADE_LABEL = { delivery: '택배거래', direct: '직거래', both: '택배/직거래' };

function productRowHtml(p) {
  return '<tr>' +
    '<td><div class="row-thumb" onclick="openProductDetail(\'' + p.id + '\')"><span class="thumb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></span><div><div class="name">' + AC.esc(p.title) + '</div><div class="sub">' + AC.esc(p.model_no || p.manufacturer || '') + '</div></div></div></td>' +
    '<td>' + AC.esc(p.companies ? p.companies.name : '-') + '</td>' +
    '<td>' + AC.esc(p.categories ? p.categories.name : '-') + '</td>' +
    '<td class="num">' + AC.won(p.price) + '</td>' +
    '<td class="num">' + p.stock + '</td>' +
    '<td><span class="badge ' + AC.badgeCls(p.status) + '">' + AC.label(p.status) + '</span></td>' +
    '<td class="num">' + AC.dt(p.created_at) + '</td>' +
    '<td><div class="table-actions">' +
      (p.status === 'selling' ? '<button class="btn btn-ghost btn-sm" onclick="setProductStatus(\'' + p.id + '\',\'stopped\')">중지</button>' : (p.status === 'stopped' ? '<button class="btn btn-ghost btn-sm" onclick="setProductStatus(\'' + p.id + '\',\'selling\')">재개</button>' : '')) +
      (p.status !== 'deleted' ? '<button class="btn btn-ghost btn-sm" style="color:var(--up);" onclick="setProductStatus(\'' + p.id + '\',\'deleted\')">삭제</button>' : '') +
    '</div></td></tr>';
}

function renderProducts() {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var market = document.getElementById('marketFilter').value;
  var list = PF.products.filter(function (p) {
    if (PF.activeStatus !== 'all' && p.status !== PF.activeStatus) return false;
    if (market && p.market_type !== market) return false;
    if (q && (p.title + ' ' + (p.model_no || '') + ' ' + (p.companies ? p.companies.name : '')).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  document.getElementById('productsTbody').innerHTML = list.map(productRowHtml).join('') ||
    '<tr><td colspan="8" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">상품이 없습니다.</td></tr>';
  document.getElementById('totalCountText').textContent = '총 ' + list.length + '개 상품';
  ['all', 'selling', 'stopped', 'soldout', 'deleted'].forEach(function (s) {
    var n = s === 'all' ? PF.products.length : PF.products.filter(function (p) { return p.status === s; }).length;
    document.getElementById('cnt-' + s).textContent = n;
  });
}

window.setProductStatus = async function (id, status) {
  if (status === 'deleted' && !confirm('이 상품을 삭제 처리하시겠습니까?')) return;
  var res = await sb.from('products').update({ status: status }).eq('id', id);
  if (res.error) { alert('처리에 실패했습니다: ' + res.error.message); return; }
  await loadProducts();
};

async function loadProducts() {
  var res = await sb.from('products').select('*, companies(name), categories(name)').order('created_at', { ascending: false });
  PF.products = res.data || [];
  renderProducts();
}

window.openProductDetail = async function (id) {
  var p = PF.products.find(function (x) { return x.id === id; });
  if (!p) return;
  document.getElementById('pdTitle').textContent = p.title;
  document.getElementById('pdDesc').textContent = p.description || '등록된 설명이 없습니다.';
  document.getElementById('pdKv').innerHTML = [
    ['판매자', p.companies ? p.companies.name : '-'],
    ['카테고리', p.categories ? p.categories.name : '-'],
    ['모델명', p.model_no || '-'],
    ['제조사', p.manufacturer || '-'],
    ['판매가', AC.won(p.price)],
    ['재고수량', p.stock + '개'],
    ['거래구분', MARKET_LABEL[p.market_type] || p.market_type],
    ['상품상태', CONDITION_LABEL[p.condition] || p.condition],
    ['거래방식', TRADE_LABEL[p.trade_type] || p.trade_type],
    ['지역', p.region || '-'],
    ['판매상태', AC.label(p.status)],
    ['조회수', p.view_count + ' · 문의 ' + p.inquiry_count + ' · 찜 ' + p.like_count],
    ['등록일', AC.dt(p.created_at, true)],
    ['수정일', AC.dt(p.updated_at, true)]
  ].map(function (kv) { return '<div class="item"><span>' + kv[0] + '</span><b>' + AC.esc(String(kv[1])) + '</b></div>'; }).join('');

  var galleryEl = document.getElementById('pdGallery');
  galleryEl.innerHTML = '';
  var imgRes = await sb.from('product_images').select('url').eq('product_id', id).order('sort_order', { ascending: true });
  var imgs = imgRes.data || [];
  galleryEl.innerHTML = imgs.length
    ? imgs.map(function (img) { return '<img src="' + AC.esc(img.url) + '" alt="">'; }).join('')
    : '<p style="font-size:.8rem;color:var(--text-tertiary);">등록된 이미지가 없습니다.</p>';

  document.getElementById('productModalOverlay').style.display = 'flex';
};
function closeProductModal() { document.getElementById('productModalOverlay').style.display = 'none'; }
document.getElementById('pdClose').addEventListener('click', closeProductModal);
document.getElementById('pdCloseBtn').addEventListener('click', closeProductModal);

document.getElementById('statusTabs').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-status]');
  if (!btn) return;
  document.querySelectorAll('#statusTabs button').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  PF.activeStatus = btn.getAttribute('data-status');
  renderProducts();
});
document.getElementById('searchInput').addEventListener('input', renderProducts);
document.getElementById('marketFilter').addEventListener('change', renderProducts);
document.getElementById('resetFilterBtn').addEventListener('click', function () {
  document.getElementById('searchInput').value = '';
  document.getElementById('marketFilter').value = '';
  PF.activeStatus = 'all';
  document.querySelectorAll('#statusTabs button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-status') === 'all'); });
  renderProducts();
});

AC.ready(async function (user) {
  document.querySelector('.admin-user .lbl b').textContent = (user.profile ? user.profile.name : user.email) || '관리자';
  document.querySelector('.admin-user .lbl span').textContent = user.email;
  document.querySelector('.admin-user .avatar').textContent = ((user.profile && user.profile.name) || user.email).charAt(0);
  await loadProducts();
});
</script>
