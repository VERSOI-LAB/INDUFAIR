<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERSOI 자유 게시판</title>
<meta name="description" content="다양한 주제로 자유롭게 소통하는 VERSOI 자유 게시판">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .board-toolbar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .board-search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:var(--surface);}
  .board-search svg{color:var(--text-tertiary);flex-shrink:0;}
  .board-search input{border:none;background:none;padding:11px 0;font-size:.88rem;color:var(--text);font-family:inherit;width:100%;}
  .board-search input:focus{outline:none;}
  .board-tabs{display:flex;gap:18px;border-bottom:1px solid var(--border);margin-top:20px;margin-bottom:2px;}
  .board-tabs button{padding:4px 2px 12px;font-size:.9rem;font-weight:700;color:var(--text-tertiary);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s ease;}
  .board-tabs button.active{color:var(--text);border-bottom-color:var(--accent);}

  .free-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .free-table th{text-align:left;font-size:.78rem;color:var(--text-tertiary);font-weight:700;padding:11px 8px;border-bottom:1px solid var(--border);}
  .free-table th.num{width:5%;}
  .free-table th.views{width:10%;text-align:right;}
  .free-table th.date{width:14%;}
  .free-table th.author{width:14%;}
  .free-table td{font-size:.88rem;padding:13px 8px;border-bottom:1px solid var(--border);color:var(--text-secondary);}
  .free-table tr:hover td{background:var(--bg-soft);}
  .free-table td:first-child{font-family:var(--font-en);color:var(--text-tertiary);}
  .free-table td.title a{color:var(--text);font-weight:600;}
  .free-table td.title a:hover{color:var(--accent);}
  .free-table td.views{text-align:right;font-family:var(--font-en);}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html" aria-label="VERSOI 홈으로 이동">
      <span class="logo-mark">V</span><span class="logo-text">VERSOI</span>
      <span class="logo-tag">INDUSTRIAL CIRCULATION<br>PLATFORM</span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="index.html">홈</a><a href="goods.html">산업용품</a><a href="used.html">중고장터</a>
      <a href="brand.html">브랜드관</a><a href="rfq.html">견적요청(RFQ)</a><a href="community.html" class="active">커뮤니티</a><a href="support.html">고객센터</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" aria-label="검색"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      <button class="icon-btn" aria-label="알림"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="icon-count">5</span></button>
      <a href="cart.html" class="icon-btn" aria-label="장바구니"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="icon-count">2</span></a>
      <button class="btn btn-ghost">로그인</button>
      <button class="btn btn-primary">회원가입</button>
      <button class="icon-btn nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </div>
</header>

<main>
  <div class="wrap page-layout">
    <aside>
      <div class="page-title-block" style="padding-top:26px;">
        <h1>자유 게시판</h1>
        <p>자유롭게 의견을 나누고<br>정보를 공유하는 공간입니다.</p>
      </div>
      <a class="btn btn-primary" href="community-write.html?board=free" style="width:100%;justify-content:center;margin-bottom:16px;display:flex;">글쓰기</a>
      <div class="side-panel">
        <nav class="side-nav">
          <a href="free.html" class="active"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>전체 게시글</a>
          <a href="#" data-tab="popular"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>인기 게시글</a>
          <a href="#" data-tab="mine"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>내 게시글</a>
        </nav>
      </div>
    </aside>

    <div>
      <h1 style="font-size:1.5rem;font-weight:900;">자유 게시판</h1>
      <p style="margin-top:8px;font-size:.9rem;color:var(--text-secondary);">다양한 주제로 자유롭게 소통해보세요.</p>

      <div class="board-toolbar">
        <form class="board-search" id="freeSearchForm" style="flex:1;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="freeSearchInput" placeholder="검색어를 입력하세요">
        </form>
        <button class="btn btn-primary" id="freeSearchBtn">검색</button>
      </div>

      <div class="board-tabs" id="freeTabs">
        <button class="active" data-tab="all">전체글</button>
        <button data-tab="popular">인기글</button>
        <button data-tab="mine">내글</button>
      </div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);box-shadow:var(--shadow-1);padding:0 20px;overflow-x:auto;">
        <table class="free-table">
          <thead><tr><th class="num">번호</th><th>제목</th><th class="author">작성자</th><th class="date">작성일</th><th class="views">조회</th></tr></thead>
          <tbody id="freeTableBody">
            <tr><td colspan="5" style="text-align:center;color:var(--text-tertiary);">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>&copy; 2026 VERSOI. 산업 자원의 순환을 연결하다.</p>
    <div class="footer-links"><a href="#">이용약관</a><a href="#">개인정보처리방침</a><a href="#">사업자정보확인</a><a href="#">제휴/입점문의</a></div>
  </div>
</footer>

<script>
  var navToggle = document.getElementById('navToggle');
  var mainNav = document.getElementById('mainNav');
  navToggle.addEventListener('click', function(){
    var open = mainNav.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  var BOARD_TYPE = 'free';
  var posts = [];
  var currentTab = 'all';
  var searchQ = '';
  var currentUserId = null;

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    return iso.slice(0, 10).replace(/-/g, '.');
  }

  async function loadPosts() {
    var res = await sb.from('community_posts')
      .select('id,profile_id,title,view_count,created_at,profiles(name)')
      .eq('board_type', BOARD_TYPE)
      .order('created_at', { ascending: false });
    posts = res.data || [];
    render();
  }

  function filtered() {
    var list = posts.slice();
    if (currentTab === 'popular') list.sort(function (a, b) { return (b.view_count || 0) - (a.view_count || 0); });
    else if (currentTab === 'mine') list = currentUserId ? list.filter(function (p) { return p.profile_id === currentUserId; }) : [];
    if (searchQ) list = list.filter(function (p) { return p.title.toLowerCase().indexOf(searchQ.toLowerCase()) !== -1; });
    return list;
  }

  function render() {
    var body = document.getElementById('freeTableBody');
    var list = filtered();
    if (!list.length) { body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-tertiary);">게시글이 없습니다.</td></tr>'; return; }
    body.innerHTML = list.map(function (p, i) {
      var author = p.profiles && p.profiles.name ? p.profiles.name : '익명';
      return '<tr>' +
        '<td class="tabular">' + (list.length - i) + '</td>' +
        '<td class="title"><a href="community.html?board=free&post=' + p.id + '">' + escapeHtml(p.title) + '</a></td>' +
        '<td>' + escapeHtml(author) + '</td>' +
        '<td class="tabular">' + fmtDate(p.created_at) + '</td>' +
        '<td class="views tabular">' + (p.view_count || 0) + '</td>' +
        '</tr>';
    }).join('');
  }

  document.getElementById('freeTabs').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    document.querySelectorAll('#freeTabs button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentTab = btn.getAttribute('data-tab');
    if (currentTab === 'mine' && !currentUserId) { window.VERSOI.requireAuth(); return; }
    render();
  });

  document.getElementById('freeSearchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    searchQ = document.getElementById('freeSearchInput').value.trim();
    render();
  });
  document.getElementById('freeSearchBtn').addEventListener('click', function () {
    searchQ = document.getElementById('freeSearchInput').value.trim();
    render();
  });

  document.addEventListener('versoi:ready', function (e) {
    currentUserId = e.detail.user ? e.detail.user.id : null;
    loadPosts();
  });
})();
</script>
</body>
</html>
