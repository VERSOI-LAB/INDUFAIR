<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
var BF = { activeBoard: 'free', data: { free: [], news: [], gov: [], qna: [], wanted: [] } };

function postRowHtml(p) {
  return '<tr>' +
    '<td class="cell-strong link" onclick="openPostView(\'' + p.id + '\')" style="max-width:320px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + AC.esc(p.title || p.content.slice(0, 40)) + '</td>' +
    '<td>' + AC.esc(p.profiles ? p.profiles.name : '-') + '</td>' +
    '<td class="num">' + (p.view_count || 0) + '</td>' +
    '<td class="num">' + (p.like_count || 0) + '</td>' +
    '<td class="num">' + AC.dt(p.created_at, true) + '</td>' +
    '<td><div class="table-actions"><button class="btn btn-ghost btn-sm" style="color:var(--up);" onclick="deletePost(\'' + p.id + '\')">삭제</button></div></td></tr>';
}

function renderPosts() {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var list = (BF.data[BF.activeBoard] || []).filter(function (p) {
    if (q) {
      var hay = ((p.title || '') + ' ' + p.content + ' ' + (p.profiles ? p.profiles.name : '')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  document.getElementById('postsTbody').innerHTML = list.map(postRowHtml).join('') ||
    '<tr><td colspan="6" style="text-align:center;color:var(--text-tertiary);padding:24px 0;">게시글이 없습니다.</td></tr>';
  document.getElementById('totalCountText').textContent = '총 ' + list.length + '건';
}

window.openPostView = function (id) {
  var p = (BF.data[BF.activeBoard] || []).find(function (x) { return x.id === id; });
  if (!p) return;
  document.getElementById('pvTitle').textContent = p.title || '(제목 없음)';
  document.getElementById('pvMeta').textContent = (p.profiles ? p.profiles.name : '-') + ' · ' + AC.dt(p.created_at, true) +
    (p.region ? ' · ' + p.region : '') + (p.budget ? ' · 예산 ' + AC.won(p.budget) : '');
  document.getElementById('pvBody').textContent = p.content || p.description || '';
  document.getElementById('postModalOverlay').style.display = 'flex';
};
function closePostModal() { document.getElementById('postModalOverlay').style.display = 'none'; }
document.getElementById('pvClose').addEventListener('click', closePostModal);
document.getElementById('pvCloseBtn').addEventListener('click', closePostModal);

window.deletePost = async function (id) {
  if (!confirm('이 게시글을 삭제하시겠습니까? 삭제된 게시글은 복구할 수 없습니다.')) return;
  var table = BF.activeBoard === 'wanted' ? 'wanted_posts' : 'community_posts';
  var res = await sb.from(table).delete().eq('id', id);
  if (res.error) { alert('삭제에 실패했습니다: ' + res.error.message); return; }
  await loadBoard(BF.activeBoard);
};

async function loadBoard(board) {
  if (board === 'wanted') {
    var res = await sb.from('wanted_posts').select('*, profiles:profile_id(name)').order('created_at', { ascending: false });
    BF.data.wanted = res.data || [];
  } else {
    var res2 = await sb.from('community_posts').select('*, profiles:profile_id(name)').eq('board_type', board).order('created_at', { ascending: false });
    BF.data[board] = res2.data || [];
  }
  document.getElementById('cnt-' + board).textContent = BF.data[board].length;
  if (BF.activeBoard === board) renderPosts();
}

async function loadAllBoards() {
  await Promise.all(['free', 'news', 'gov', 'qna', 'wanted'].map(loadBoard));
}

document.getElementById('boardTabs').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-board]');
  if (!btn) return;
  document.querySelectorAll('#boardTabs button').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  BF.activeBoard = btn.getAttribute('data-board');
  renderPosts();
});
document.getElementById('searchInput').addEventListener('input', renderPosts);
document.getElementById('resetFilterBtn').addEventListener('click', function () {
  document.getElementById('searchInput').value = '';
  renderPosts();
});

AC.ready(async function (user) {
  document.querySelector('.admin-user .lbl b').textContent = (user.profile ? user.profile.name : user.email) || '관리자';
  document.querySelector('.admin-user .lbl span').textContent = user.email;
  document.querySelector('.admin-user .avatar').textContent = ((user.profile && user.profile.name) || user.email).charAt(0);
  await loadAllBoards();
});
</script>
