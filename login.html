<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>시작하기 - 판다산다</title>
<link rel="icon" href="/이미지/web/logo.jpg">
<link rel="stylesheet" href="/app.css">
<style>
  .hello{text-align:center;padding:40px 0 8px;}
  .hello .panda{font-size:64px;line-height:1;}
  .hello h1{font-size:26px;font-weight:800;margin-top:12px;}
  .hello p{color:var(--sub);margin-top:4px;}
  .err{margin-top:14px;padding:12px 14px;border-radius:12px;background:#FFF0EF;color:var(--danger);font-size:15px;font-weight:600;}
  .info{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--primary-light);font-size:15px;font-weight:600;}
  .switch{text-align:center;margin-top:16px;font-size:15px;color:var(--sub);}
  .switch button{color:var(--text);font-weight:800;text-decoration:underline;padding:8px;}
  .legal{text-align:center;font-size:13px;color:var(--hint);margin-top:24px;}
  .legal a{text-decoration:underline;}
</style>
</head>
<body>
<div class="app no-tabbar">
  <header class="topbar"><a class="back" href="/" aria-label="홈으로"><i data-icon="back" data-size="24"></i></a><h1></h1></header>
  <main class="page">
    <section class="hello">
      <div class="panda" aria-hidden="true" id="loginStk"><i data-sticker="hello" data-size="140"></i></div>
      <h1 id="heading">반가워요!</h1>
      <p id="subheading">이메일로 바로 시작해요</p>
    </section>

    <form id="form" novalidate>
      <label class="field" id="nameField" hidden><span>이름 (다른 사람에게 보여요)</span>
        <input class="input" id="name" maxlength="20" autocomplete="nickname" placeholder="예) 김판다">
      </label>
      <label class="field"><span>이메일</span>
        <input class="input" id="email" type="email" inputmode="email" autocomplete="email" placeholder="panda@example.com">
      </label>
      <label class="field"><span>비밀번호</span>
        <input class="input" id="password" type="password" autocomplete="current-password" placeholder="6자 이상">
      </label>
      <div class="err" id="err" hidden></div>
      <div class="info" id="info" hidden></div>
      <button class="btn" id="submit" type="submit" style="margin-top:24px">로그인</button>
    </form>

    <div class="switch" id="switch"></div>
    <p class="legal">시작하면 <a href="/terms">이용약관</a>과 <a href="/privacy">개인정보처리방침</a>에 동의하는 거예요</p>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  var mode = PS.param('mode') === 'signup' ? 'signup' : 'login';
  var $ = function (id) { return document.getElementById(id); };

  function nextUrl() {
    var n = PS.param('next') || '/';
    return n.charAt(0) === '/' && n.charAt(1) !== '/' ? n : '/';
  }

  PS.ready.then(function (user) { if (user) location.replace(nextUrl()); });

  function setMode(m) {
    mode = m;
    var signup = m === 'signup';
    $('nameField').hidden = !signup;
    var stk = document.querySelector('#loginStk img');
    if (stk) stk.src = signup ? '/이미지/icons/user.webp' : '/이미지/stickers/hello.webp';
    $('heading').textContent = signup ? '처음 오셨군요!' : '반가워요!';
    $('subheading').textContent = signup ? '이름, 이메일, 비밀번호만 쓰면 끝' : '이메일로 바로 시작해요';
    $('submit').textContent = signup ? '가입하고 시작하기' : '로그인';
    $('password').autocomplete = signup ? 'new-password' : 'current-password';
    $('switch').innerHTML = signup
      ? '이미 가입했나요? <button type="button" data-m="login">로그인</button>'
      : '처음이에요? <button type="button" data-m="signup">새로 가입하기</button>';
    $('err').hidden = true;
    $('info').hidden = true;
    (signup ? $('name') : $('email')).focus();
  }

  $('switch').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) setMode(b.dataset.m);
  });

  function showErr(msg) { $('err').textContent = msg; $('err').hidden = false; }

  $('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('err').hidden = true;
    $('info').hidden = true;
    var name = $('name').value.trim();
    var email = $('email').value.trim();
    var password = $('password').value;
    if (mode === 'signup' && !name) return showErr('이름을 써 주세요');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return showErr('이메일을 다시 확인해 주세요');
    if (password.length < 6) return showErr('비밀번호는 6자 이상이에요');

    var btn = $('submit');
    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = '잠깐만요…';

    if (mode === 'login') {
      var res = await sb.auth.signInWithPassword({ email: email, password: password });
      btn.disabled = false;
      btn.textContent = label;
      if (res.error) {
        if (/confirm/i.test(res.error.message)) return showErr('메일함에서 확인 버튼을 먼저 눌러 주세요');
        return showErr('이메일이나 비밀번호가 맞지 않아요. 처음이라면 아래 "새로 가입하기"를 눌러요');
      }
      location.replace(nextUrl());
      return;
    }

    var su = await sb.auth.signUp({
      email: email,
      password: password,
      options: { data: { name: name }, emailRedirectTo: location.origin + '/login?next=' + encodeURIComponent(nextUrl()) }
    });
    btn.disabled = false;
    btn.textContent = label;
    if (su.error) {
      if (/registered|already/i.test(su.error.message)) { setMode('login'); return showErr('이미 가입한 이메일이에요. 비밀번호를 넣고 로그인해 주세요'); }
      if (/password/i.test(su.error.message)) return showErr('비밀번호가 너무 쉬워요. 더 길게 써 주세요');
      return showErr('가입하지 못했어요. 잠시 후 다시 해 주세요');
    }
    if (su.data.session) { location.replace(nextUrl()); return; }
    $('info').textContent = email + ' 메일함에서 확인 버튼을 누르면 가입이 끝나요!';
    $('info').hidden = false;
    setTimeout(function () { mode = 'login'; $('nameField').hidden = true; $('submit').textContent = '로그인'; $('switch').innerHTML = '처음이에요? <button type="button" data-m="signup">새로 가입하기</button>'; }, 0);
  });

  setMode(mode);
})();
</script>
</body>
</html>
