<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>시작하기 - 판다산다</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="/app.css">
<style>
  .hello{text-align:center;padding:40px 0 8px;}
  .hello .panda{font-size:64px;line-height:1;}
  .hello h1{font-size:26px;font-weight:800;margin-top:12px;}
  .hello p{color:var(--sub);margin-top:4px;}
  .err{margin-top:14px;padding:12px 14px;border-radius:12px;background:#FFF0EF;color:var(--danger);font-size:15px;font-weight:600;}
  .info{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--primary-light);font-size:15px;font-weight:600;}
  .switch{text-align:center;margin-top:16px;font-size:15px;color:var(--sub);}
  .switch button{color:var(--text);font-weight:800;text-decoration:underline;padding:8px;}
  .legal{text-align:center;font-size:13px;color:var(--hint);margin-top:24px;}
  .legal a{text-decoration:underline;}
  /* 카카오 로그인 버튼 (카카오 디자인 가이드: 노란 바탕 #FEE500, 검정 85% 글씨) */
  .kakao-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;margin-top:20px;border-radius:12px;background:#FEE500;color:rgba(0,0,0,.85);font-size:17px;font-weight:700;}
  .kakao-btn:disabled,.google-btn:disabled{opacity:.6;}
  /* 구글 로그인 버튼 (구글 브랜드 가이드: 흰 바탕, 회색 테두리, 4색 G 로고) */
  .google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;margin-top:10px;border-radius:12px;background:#fff;border:1px solid #DADCE0;color:#1F1F1F;font-size:17px;font-weight:700;}
  #socialWrap > button:first-child{margin-top:20px;}
  .ads-ok{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:15px;line-height:1.5;cursor:pointer;}
  .ads-ok input{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--primary);}
  .ads-ok small{display:block;font-size:13px;color:var(--hint);}
  .or{display:flex;align-items:center;gap:12px;margin:20px 0 4px;color:var(--hint);font-size:14px;}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line);}
</style>
</head>
<body>
<div class="app no-tabbar">
  <header class="topbar"><a class="back" href="/" aria-label="홈으로"><i data-icon="back" data-size="24"></i></a><h1></h1></header>
  <main class="page">
    <section class="hello">
      <div class="panda" aria-hidden="true" id="loginStk"><i data-sticker="hello" data-size="140"></i></div>
      <h1 id="heading">반가워요!</h1>
      <p id="subheading">이메일로 바로 시작해요</p>
    </section>

    <div id="socialWrap" hidden>
      <button type="button" class="kakao-btn" id="kakaoBtn" data-provider="kakao" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.48 3 2 6.54 2 10.9c0 2.8 1.86 5.27 4.66 6.67l-.95 3.5c-.08.3.26.55.52.38l4.15-2.75c.53.06 1.07.1 1.62.1 5.52 0 10-3.54 10-7.9S17.52 3 12 3z"/></svg>
        카카오로 3초 만에 시작하기
      </button>
      <button type="button" class="google-btn" id="googleBtn" data-provider="google" hidden>
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        구글(Gmail)로 시작하기
      </button>
      <div class="or"><span>또는 이메일로</span></div>
    </div>

    <form id="form" novalidate>
      <label class="field" id="nameField" hidden><span>이름 (다른 사람에게 보여요)</span>
        <input class="input" id="name" maxlength="20" autocomplete="nickname" placeholder="예) 김판다">
      </label>
      <label class="field"><span>이메일</span>
        <input class="input" id="email" type="email" inputmode="email" autocomplete="email" placeholder="panda@example.com">
      </label>
      <label class="field" id="pwField"><span>비밀번호</span>
        <input class="input" id="password" type="password" autocomplete="current-password" placeholder="6자 이상">
      </label>
      <label class="ads-ok" id="adsField" hidden><input type="checkbox" id="adsOk"><span>(선택) 할인·새 기능·지원사업 소식을 푸시·이메일로 받을게요 <small>광고성 정보 · 언제든 설정에서 끌 수 있어요</small></span></label>
      <div class="err" id="err" hidden></div>
      <div class="info" id="info" hidden></div>
      <button class="btn" id="submit" type="submit" style="margin-top:24px">로그인</button>
    </form>
    <div style="text-align:center"><button type="button" class="link-btn" id="forgotBtn">비밀번호를 잊었어요</button></div>

    <div class="switch" id="switch"></div>
    <p class="legal">시작하면 <a href="/terms">이용약관</a>과 <a href="/privacy">개인정보처리방침</a>에 동의하는 거예요</p>
    <div class="test-note" id="reviewBox" hidden style="margin-top:20px"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
<script>
(function () {
  var mode = ['signup', 'reset'].indexOf(PS.param('mode')) !== -1 ? PS.param('mode') : 'login';
  var $ = function (id) { return document.getElementById(id); };

  // 결제 심사용 계정 안내 (PS.REVIEW_ACCOUNT 가 있을 때만, 오픈 전까지)
  if (PS.REVIEW_ACCOUNT) {
    $('reviewBox').innerHTML = '결제 심사용 계정<br>아이디: ' + PS.esc(PS.REVIEW_ACCOUNT.id) + '<br>비밀번호: ' + PS.esc(PS.REVIEW_ACCOUNT.pw);
    $('reviewBox').hidden = false;
  }

  function nextUrl() {
    var n = PS.param('next') || '/';
    return n.charAt(0) === '/' && n.charAt(1) !== '/' ? n : '/';
  }

  PS.ready.then(function (user) { if (user) location.replace(nextUrl()); });

  var social = []; // 켜진 간편 로그인 (아래에서 Supabase 설정을 읽어 채움)
  var LABEL = { kakao: '카카오', google: '구글' };

  function setMode(m, keepFocus) {
    mode = m;
    var signup = m === 'signup';
    var reset = m === 'reset';
    $('nameField').hidden = !signup;
    $('adsField').hidden = !signup;
    $('pwField').hidden = reset;
    $('forgotBtn').hidden = m !== 'login';
    var stk = document.querySelector('#loginStk img');
    if (stk) stk.src = '/이미지/stickers/' + (signup ? 'fighting' : reset ? 'curious' : 'hello') + '.webp';
    $('heading').textContent = signup ? '처음 오셨군요!' : reset ? '비밀번호를 잊었나요?' : '반가워요!';
    var names = social.map(function (p) { return LABEL[p]; });
    $('subheading').textContent = reset ? '가입한 이메일로 새 비밀번호 링크를 보내드려요'
      : names.length ? names.join('·') + ' 계정이나 이메일로 바로 시작해요'
      : signup ? '이름, 이메일, 비밀번호만 쓰면 끝' : '이메일로 바로 시작해요';
    $('socialWrap').hidden = !social.length || reset;
    $('submit').textContent = signup ? '가입하고 시작하기' : reset ? '메일 받기' : '로그인';
    $('password').autocomplete = signup ? 'new-password' : 'current-password';
    $('switch').innerHTML = signup
      ? '이미 가입했나요? <button type="button" data-m="login">로그인</button>'
      : reset ? '비밀번호가 생각났나요? <button type="button" data-m="login">로그인</button>'
      : '처음이에요? <button type="button" data-m="signup">새로 가입하기</button>';
    if (keepFocus) return; // 버튼만 새로 보여줄 때는 입력 중인 내용·안내를 건드리지 않음
    $('err').hidden = true;
    $('info').hidden = true;
    (signup ? $('name') : $('email')).focus();
  }

  // 간편 로그인(카카오·구글): Supabase 에서 켜진 것만 버튼을 보여준다 (켜고 끄는 데 코드 수정·배포 필요 없음)
  //   카카오/구글 → Supabase → 이 화면(#access_token) 으로 돌아오면 PS.ready 가 로그인시키고 위에서 next 로 보냄
  if (PS.hashParams.get('error') || PS.param('error')) {
    var q = new URLSearchParams(location.search);
    ['error', 'error_code', 'error_description'].forEach(function (k) { q.delete(k); });
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
    setTimeout(function () { showErr('간편 로그인을 마치지 못했어요. 다시 눌러 주세요. 계속 안 되면 이메일로 가입해 주세요'); }, 0);
  }
  ['kakaoBtn', 'googleBtn'].forEach(function (id) {
    $(id).addEventListener('click', async function () {
      var btn = this, provider = btn.dataset.provider;
      btn.disabled = true;
      PS.track(mode === 'signup' ? 'signup_start' : 'login_start', { method: provider });
      var opts = { redirectTo: location.origin + '/login?next=' + encodeURIComponent(nextUrl()) };
      if (provider === 'google') opts.queryParams = { prompt: 'select_account' };
      var r = await sb.auth.signInWithOAuth({ provider: provider, options: opts });
      if (r.error) { btn.disabled = false; showErr(LABEL[provider] + ' 로그인을 열지 못했어요. 잠시 후 다시 해 주세요'); }
    });
  });
  (window.sbAuthProviders ? sbAuthProviders() : Promise.resolve({})).then(function (ext) {
    social = ['kakao', 'google'].filter(function (p) { return ext[p] || (p === 'kakao' && PS.KAKAO_LOGIN); });
    $('kakaoBtn').hidden = social.indexOf('kakao') === -1;
    $('googleBtn').hidden = social.indexOf('google') === -1;
    if (social.length) setMode(mode, true);
  });

  $('forgotBtn').addEventListener('click', function () { setMode('reset'); });

  $('switch').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) setMode(b.dataset.m);
  });

  function showErr(msg) { $('err').textContent = msg; $('err').hidden = false; }

  $('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('err').hidden = true;
    $('info').hidden = true;
    var name = $('name').value.trim();
    var email = $('email').value.trim();
    var password = $('password').value;
    if (mode === 'signup' && !name) return showErr('이름을 써 주세요');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return showErr('이메일을 다시 확인해 주세요');
    if (mode !== 'reset' && password.length < 6) return showErr('비밀번호는 6자 이상이에요');

    var btn = $('submit');
    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = '잠깐만요…';

    if (mode === 'reset') {
      var rs = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/reset-password' });
      btn.disabled = false;
      btn.textContent = label;
      if (rs.error) {
        if (/rate|seconds|too many/i.test(rs.error.message)) return showErr('메일을 너무 자주 보냈어요. 1분 뒤에 다시 해 주세요');
        return showErr('메일을 보내지 못했어요. 잠시 후 다시 해 주세요');
      }
      // 가입 여부를 알려주지 않도록 항상 같은 안내
      $('info').textContent = email + ' 로 가입했다면 메일이 갔어요. 메일의 링크를 눌러 새 비밀번호를 정해 주세요. (안 보이면 스팸함도 확인해요)';
      $('info').hidden = false;
      return;
    }

    if (mode === 'login') {
      var res = await sb.auth.signInWithPassword({ email: email, password: password });
      btn.disabled = false;
      btn.textContent = label;
      if (res.error) {
        if (/confirm/i.test(res.error.message)) return showErr('메일함에서 확인 버튼을 먼저 눌러 주세요');
        return showErr('이메일이나 비밀번호가 맞지 않아요. 비밀번호가 기억나지 않으면 "비밀번호를 잊었어요"를 눌러요');
      }
      location.replace(nextUrl());
      return;
    }

    var su = await sb.auth.signUp({
      email: email,
      password: password,
      options: { data: { name: name, ads_ok: $('adsOk').checked }, emailRedirectTo: location.origin + '/login?next=' + encodeURIComponent(nextUrl()) }
    });
    btn.disabled = false;
    btn.textContent = label;
    if (su.error) {
      if (/registered|already/i.test(su.error.message)) { setMode('login'); return showErr('이미 가입한 이메일이에요. 비밀번호를 넣고 로그인해 주세요'); }
      if (/password/i.test(su.error.message)) return showErr('비밀번호가 너무 쉬워요. 더 길게 써 주세요');
      return showErr('가입하지 못했어요. 잠시 후 다시 해 주세요');
    }
    if (su.data.session) { location.replace(nextUrl()); return; }
    $('info').textContent = email + ' 메일함에서 확인 버튼을 누르면 가입이 끝나요!';
    $('info').hidden = false;
    setTimeout(function () { mode = 'login'; $('nameField').hidden = true; $('adsField').hidden = true; $('submit').textContent = '로그인'; $('switch').innerHTML = '처음이에요? <button type="button" data-m="signup">새로 가입하기</button>'; }, 0);
  });

  setMode(mode);
})();
</script>
</body>
</html>
